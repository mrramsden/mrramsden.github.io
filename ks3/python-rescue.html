<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Rescue: indentation, if, loops and subroutines</title>
<style>
:root{
  --navy:#0B1F3A; --deep:#13315C; --blue:#1F6FB2; --mid:#5B8DBE; --sky:#8CCBF5;
  --pale:#EAF2FB; --bg:#F3F7FC; --line:#D3E2F2; --amber:#F2A541; --amber-pale:#FFF4E2;
  --red:#C2413A; --red-pale:#FDECEA; --green:#2A9D6F;
  --lvB:#2A9D8F; --lvI:#1F6FB2; --lvA:#13315C;
  --code:"Cascadia Mono","Cascadia Code",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--navy);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:17px;line-height:1.55}
code{font-family:var(--code);background:var(--pale);color:var(--deep);padding:1px 5px;border-radius:4px;font-size:.92em}
h1,h2,h3{line-height:1.2;margin:0}
button{font:inherit;cursor:pointer}
svg.i{width:1.1em;height:1.1em;vertical-align:-.18em;flex:none}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:18px;padding:10px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem;margin-right:auto}
.brand svg{color:var(--amber);width:28px;height:28px}
.brand small{font-weight:400;color:var(--sky);font-size:.9rem}
.lvswitch{display:flex;background:var(--deep);border-radius:999px;padding:4px;gap:2px}
.lvswitch span{font-size:.8rem;color:var(--sky);align-self:center;padding:0 8px 0 10px}
.lvswitch button{border:0;background:transparent;color:#fff;padding:6px 14px;border-radius:999px;font-size:.92rem}
.lvswitch button[aria-pressed="true"]{background:#fff;color:var(--navy);font-weight:700}
.filebar{display:flex;gap:6px;align-items:center}
.filebar button{border:0;border-radius:999px;padding:6px 14px;font-size:.92rem;font-weight:600;display:inline-flex;gap:6px;align-items:center;background:var(--deep);color:#fff;position:relative}
.filebar button.savebtn{background:var(--amber);color:var(--navy)}
.filebar button.savebtn.dirty::after{content:"";position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--navy)}
.filebar button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;box-shadow:0 4px 14px rgba(11,31,58,.3);z-index:30;font-size:.95rem;max-width:90vw}
.toast.bad{background:var(--red)}
.toast[hidden]{display:none}
.dots{display:flex;justify-content:center;gap:8px;padding:12px 10px 4px;flex-wrap:wrap}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--mid);font-weight:700;font-size:.85rem;display:grid;place-items:center;padding:0}
.dot.current{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 3px rgba(31,111,178,.2)}
.dot.done-B{background:var(--lvB);border-color:var(--lvB);color:#fff}
.dot.done-I{background:var(--lvI);border-color:var(--lvI);color:#fff}
.dot.done-A{background:var(--lvA);border-color:var(--lvA);color:#fff}

main{max-width:1000px;margin:0 auto;padding:10px 20px 110px}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(19,49,92,.12);padding:22px 24px;margin:18px 0}

/* stage header */
.stage-head{background:var(--deep);color:#fff;border-radius:16px;padding:24px 28px;margin-top:14px;display:flex;gap:22px;align-items:center}
.stage-head .badge{flex:none;width:76px;height:76px;border-radius:50%;background:var(--navy);display:grid;place-items:center;color:var(--amber);font-size:2rem;font-weight:800}
.stage-head .kicker{color:var(--sky);font-size:.9rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stage-head h1{font-size:2rem;margin:2px 0 6px}
.stage-head p{margin:0;color:#DCE9F7}
.stage-head code{background:rgba(255,255,255,.14);color:#fff}

h2.sec{display:flex;align-items:center;gap:10px;font-size:1.3rem;margin-bottom:10px}
h2.sec svg{color:var(--blue)}
.learn p{margin:.4em 0}
.learn ul{margin:.3em 0;padding-left:1.3em}

details.help{padding:0}
details.help summary{list-style:none;cursor:pointer;padding:16px 24px;font-weight:700;display:flex;align-items:center;gap:10px}
details.help summary::-webkit-details-marker{display:none}
details.help summary::after{content:"Show";margin-left:auto;font-weight:600;font-size:.85rem;color:var(--blue)}
details.help[open] summary::after{content:"Hide"}
.helpgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:0 24px 20px}
.helpgrid h3{font-size:1rem;margin-bottom:6px;color:var(--deep)}
.kw{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}
.kw dt{font-family:var(--code);font-weight:700;color:var(--blue)}
.kw dd{margin:0}
.mist{margin:0;padding-left:1.2em;font-size:.95rem}
.mist li{margin-bottom:4px}

/* level panel */
.lvhead{display:flex;align-items:center;gap:14px;margin:30px 0 4px}
.lvpill{color:#fff;font-weight:700;border-radius:999px;padding:6px 16px;font-size:.95rem}
.lv-B .lvpill{background:var(--lvB)} .lv-I .lvpill{background:var(--lvI)} .lv-A .lvpill{background:var(--lvA)}
.lvhead p{margin:0;color:var(--deep)}
.part{border-left:0}
.part h3{font-size:1.2rem;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tasknum{background:var(--pale);color:var(--blue);font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 10px;border-radius:999px}
.part p{margin:.4em 0}
.part ul{margin:.3em 0 .6em;padding-left:1.3em}
pre.sample{background:var(--navy);color:#E6F0FB;font-family:var(--code);font-size:.92rem;padding:12px 16px;border-radius:10px;overflow-x:auto;margin:10px 0;line-height:1.45}
.steps{list-style:none;padding:0;margin:10px 0}
.steps li{margin:6px 0}
.steps label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.steps input{width:20px;height:20px;margin-top:3px;accent-color:var(--green);flex:none}
.steps input:checked + span{color:var(--mid);text-decoration:line-through}

.part.kind-ext, .part.kind-stretch{background:linear-gradient(#fff,#fff) padding-box;border:2px dashed var(--sky)}
.part.locked .pbody{display:none}
.lockrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lockrow p{margin:0;color:var(--deep)}
.lockrow[hidden]{display:none}

.hints{margin-top:12px}
.hintbtn{background:var(--amber-pale);border:1px solid var(--amber);color:var(--navy);border-radius:8px;padding:7px 14px;display:inline-flex;gap:8px;align-items:center;font-weight:600}
.hintbtn[disabled]{opacity:.55;cursor:default}
.hint{background:var(--amber-pale);border-radius:8px;padding:9px 14px;margin-top:8px;font-size:.95rem}
.hint b{color:#9A5B00}

.btn{border:0;border-radius:9px;padding:9px 18px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.btn.primary{background:var(--blue);color:#fff}
.btn.ghost{background:var(--pale);color:var(--deep)}
.btn.amber{background:var(--amber);color:var(--navy)}
.btn:focus-visible,.dot:focus-visible,.lvswitch button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* runner */
.runner{margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.rbar{display:flex;align-items:center;gap:6px;background:var(--pale);padding:7px 10px;flex-wrap:wrap}
.rbar .lbl{font-size:.8rem;font-weight:700;color:var(--mid);text-transform:uppercase;letter-spacing:.06em;margin-right:auto;padding-left:4px}
.rbar button{border:0;border-radius:7px;padding:6px 12px;font-size:.88rem;font-weight:600;display:inline-flex;gap:6px;align-items:center;background:#fff;color:var(--deep)}
.rbar button.run{background:var(--green);color:#fff}
.rbar button.stop{background:var(--red);color:#fff}
.rbar button[disabled]{opacity:.45;cursor:default}
.rbar button.check{background:var(--amber);color:var(--navy)}
.gut div.todo{background:var(--amber-pale);color:#9A5B00;border-radius:4px;padding-right:4px;box-shadow:inset 3px 0 0 var(--amber)}
.msg.pass{background:#E3F4EC;color:#1C5C42;border-left:5px solid var(--green)}
.passed{background:var(--green);color:#fff;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;display:inline-flex;gap:5px;align-items:center;margin-left:auto}
.cov{background:#fff;border-top:1px solid var(--line);padding:10px 14px;font-size:.95rem}
.cov[hidden]{display:none}
.cov .covtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cov .bar{flex:1;min-width:120px;height:10px;background:var(--pale);border-radius:99px;overflow:hidden}
.cov .bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.cov ul{margin:6px 0 0;padding-left:1.2em}
.cov li code{font-size:.85em}
.cov .covreset{border:0;background:none;color:var(--blue);font-weight:600;font-size:.85rem;padding:0;text-decoration:underline}
.predict .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.predict .opt{border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;text-align:left;font-family:var(--code);font-size:.95rem;color:var(--navy)}
.predict .opt:not([disabled]):hover{border-color:var(--blue)}
.predict .opt.right{border-color:var(--green);background:#E3F4EC}
.predict .opt.wrong{border-color:var(--red);background:var(--red-pale)}
.predict .opt[disabled]{cursor:default}
.predict .q{font-weight:700;margin:10px 0 0}
.checkcount{font-size:.9rem;color:var(--deep);margin-top:4px}
@media (max-width:760px){.predict .opts{grid-template-columns:1fr}}
.ed{display:grid;grid-template-columns:auto 1fr;font-family:var(--code);font-size:15px;line-height:22px;background:#fff}
.gut{background:#F6F9FD;color:#9AB3CF;text-align:right;padding:10px 8px 10px 10px;user-select:none;border-right:1px solid var(--line);min-width:38px}
.gut div{height:22px}
.gut div.err{background:var(--red);color:#fff;border-radius:4px;padding-right:4px}
.gut div.gap{background:var(--amber);color:var(--navy);border-radius:4px;padding-right:4px}
.ed textarea{border:0;outline:0;resize:none;font:inherit;line-height:22px;padding:10px 12px;white-space:pre;overflow-x:auto;overflow-y:hidden;color:var(--navy);background:#fff;tab-size:4;min-height:110px}
.ed textarea:focus{background:#FCFDFF}
.con{background:var(--navy);color:#E6F0FB;font-family:var(--code);font-size:14.5px;line-height:1.5;padding:10px 14px;min-height:56px;max-height:340px;overflow-y:auto}
.con pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit}
.con .typed{color:var(--amber);font-weight:700}
.con .muted{color:#8FAACA;font-style:italic}
.inrow{display:flex;align-items:center;gap:8px;margin-top:4px}
.inrow label{color:var(--amber);font-weight:700}
.inrow input{flex:1;font-family:var(--code);font-size:14.5px;border:2px solid var(--amber);border-radius:6px;padding:5px 8px;background:#14294A;color:#fff;outline:0}
.inrow small{color:#8FAACA;font-family:"Segoe UI",system-ui,sans-serif}
.msg{font-family:"Segoe UI",system-ui,sans-serif;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:.95rem;line-height:1.45}
.msg.error{background:var(--red-pale);color:#7A1F1A}
.msg.warn{background:var(--amber-pale);color:#6B4100}
.msg.ok{background:#E3F4EC;color:#1C5C42;padding:6px 12px}
.msg strong{display:block}
.msg code{background:rgba(255,255,255,.7)}

/* welcome */
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:34px 34px;margin-top:14px;display:flex;gap:28px;align-items:center}
.hero h1{font-size:2.5rem}
.hero p{color:#DCE9F7;margin:.6em 0 0;max-width:560px}
.hero svg.big{width:120px;height:120px;color:var(--amber);flex:none}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.how div{background:var(--pale);border-radius:12px;padding:16px}
.how b{display:flex;gap:8px;align-items:center;color:var(--deep)}
.how svg{color:var(--blue)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lvcard{border:3px solid transparent;background:#fff;border-radius:14px;padding:20px;text-align:left;box-shadow:0 1px 3px rgba(19,49,92,.12);display:flex;flex-direction:column;gap:8px;color:var(--navy)}
.lvcard .lvpill{align-self:flex-start}
.lvcard.lv-B .lvpill{background:var(--lvB)} .lvcard.lv-I .lvpill{background:var(--lvI)} .lvcard.lv-A .lvpill{background:var(--lvA)}
.lvcard[aria-pressed="true"]{border-color:var(--amber)}
.lvcard q{font-weight:700;font-size:1.05rem;quotes:none}
.lvcard span.d{font-size:.95rem;color:var(--deep)}

/* stage end */
.endcard{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.endcard .grow{flex:1;min-width:240px}
.endcard p{margin:0}
.done-msg{color:var(--green);font-weight:700}

/* finish */
table.prog{border-collapse:collapse;width:100%}
table.prog th,table.prog td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.prog td.c,table.prog th.c{text-align:center}
.tick{color:var(--green);font-weight:800}

/* bottom nav */
.navbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:10px 22px;z-index:20}
.navbar .where{color:var(--mid);font-size:.9rem}

.plan label{display:block;font-weight:600;margin:10px 0}
.plan input,.plan select{display:block;width:100%;font:inherit;font-weight:400;border:1px solid var(--line);border-radius:7px;padding:7px 9px;margin-top:4px;background:#fff;color:var(--navy)}
.plan table{width:100%;border-collapse:collapse;margin-top:12px}
.plan th{text-align:left;font-size:.85rem;color:var(--deep);padding:4px}
.plan td{padding:4px;vertical-align:top}.plan td input,.plan td select{margin:0}
.plan td.rn{font-weight:800;color:var(--blue);width:24px;padding-top:11px}
.plan th:nth-child(3){width:38%}
.saved{font-size:.85rem;color:var(--mid);margin:8px 0 0}
.gamecard{border:3px solid var(--amber)}
.myplan summary{cursor:pointer;font-weight:600;color:var(--blue);margin:6px 0}
.myplan ol{margin:6px 0;padding-left:1.4em}.muted2{color:var(--mid)}
@media (max-width:760px){
  .helpgrid,.how,.levels{grid-template-columns:1fr}
  .hero{flex-direction:column;align-items:flex-start}
  .stage-head{flex-direction:column;align-items:flex-start}
}
/* reference panel */
.refbtn{border:0;border-radius:999px;padding:6px 14px;font-size:.92rem;font-weight:600;display:inline-flex;gap:6px;align-items:center;background:var(--sky);color:var(--navy)}
.refbtn[aria-expanded="true"]{background:#fff}
.refbtn:focus-visible,.reflink:focus-visible,.chips button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.ref{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:#fff;z-index:40;box-shadow:-6px 0 24px rgba(11,31,58,.22);display:flex;flex-direction:column}
.ref[hidden]{display:none}
.refhead{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.refhead h2{font-size:1.15rem;margin-right:auto;display:flex;gap:8px;align-items:center}
.refhead h2 svg{color:var(--amber)}
.refhead button{border:0;background:var(--deep);color:#fff;border-radius:8px;padding:5px 12px;font-weight:600}
.refsearch{padding:12px 16px 4px}
.refsearch input{width:100%;font:inherit;border:2px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--navy)}
.refsearch input:focus{border-color:var(--blue);outline:0}
.reftip{font-size:.85rem;color:var(--mid);margin:6px 0 0}
#reflist{overflow-y:auto;padding:4px 16px 30px;flex:1}
#reflist h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mid);margin:16px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--amber);background:var(--amber-pale);color:var(--navy);border-radius:999px;padding:4px 12px;font-size:.88rem;font-weight:600}
.refcard{border:1px solid var(--line);border-radius:10px;margin:6px 0;background:#fff}
.refcard summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;flex-direction:column;gap:1px}
.refcard summary::-webkit-details-marker{display:none}
.refcard .rt{font-family:var(--code);font-weight:700;color:var(--blue)}
.refcard .rs{font-size:.88rem;color:var(--deep)}
.refcard[open]{border-color:var(--blue);box-shadow:0 0 0 2px rgba(31,111,178,.15)}
.refcard[open] summary{background:var(--pale);border-radius:9px 9px 0 0}
.rb{padding:4px 12px 12px;font-size:.95rem}
.rb p{margin:.45em 0}.rb ul{margin:.3em 0;padding-left:1.2em}
.rb pre.sample{font-size:.85rem;white-space:pre}
.watch{background:var(--amber-pale);border-radius:8px;padding:7px 10px}
.watch b{color:#9A5B00}
.rb .runner .rbar .copy{display:none}
.refnone{color:var(--deep)}
.reflink{margin-top:8px;border:1px solid currentColor;background:#fff;color:inherit;border-radius:7px;padding:4px 10px;font-size:.88rem;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.toast{z-index:50}
@media (min-width:1180px){ body.refopen main{margin-left:max(20px,calc((100vw - 440px - 1000px)/2));margin-right:440px} }
@media print{.top,.navbar,.dots,.rbar,.con,.ref,.refbtn{display:none}}

/* ---- Python Rescue additions ---- */
.homelink{color:#fff;background:rgba(255,255,255,.12);border-radius:999px;padding:6px 14px;font-weight:600;text-decoration:none;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.homelink:hover{background:rgba(255,255,255,.24)}.homelink:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.top{gap:14px}
.top .brand small{opacity:.8}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.nav button,.top .resetall{background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:999px;padding:7px 14px;font-weight:600;font-size:.92rem;display:inline-flex;gap:6px;align-items:center}
.nav button.on{background:#fff;color:var(--navy)}
.top .resetall{background:none;opacity:.75;font-weight:500;text-decoration:underline}
main{max-width:980px;margin:0 auto;padding:22px 18px 70px}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(11,31,58,.08);padding:20px 24px;margin:0 0 18px}
h1{font-size:1.6rem;margin:0 0 6px;line-height:1.25}
.intro p{margin:6px 0 14px}
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tips div{background:var(--pale);border-radius:12px;padding:12px 14px;font-size:.95rem}
.tips b{display:flex;gap:6px;align-items:center;color:var(--deep);margin-bottom:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.grid .card{margin:0}
button.topic,button.doctor{display:flex;gap:16px;align-items:flex-start;text-align:left;border:2px solid transparent;cursor:pointer;width:100%;font:inherit;color:inherit}
button.topic:hover,button.doctor:hover{border-color:var(--blue)}
button.topic:focus-visible,button.doctor:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.tnum{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;font-weight:800;color:#fff;background:var(--blue)}
.tnum.big{width:72px;height:72px;font-size:2.1rem;border-radius:18px}
.c-green .tnum{background:#2E8B6A}.c-amber .tnum{background:#D98A1E}.c-purple .tnum{background:#6C55B8}
.c-green{border-top:5px solid #2E8B6A}.c-amber{border-top:5px solid #D98A1E}.c-purple{border-top:5px solid #6C55B8}.c-blue{border-top:5px solid var(--blue)}.c-doctor{border-top:5px solid var(--red)}
.tbody,.doctor>span:last-child{display:flex;flex-direction:column;gap:4px}
.ttitle{font-size:1.2rem;font-weight:700}
.ttag{color:var(--deep);font-size:.95rem;margin:0}
.dicon{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--red-pale);color:var(--red)}
.dicon .i{width:30px;height:30px}.dicon.big{width:72px;height:72px}.dicon.big .i{width:40px;height:40px}
.pips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pip{display:inline-flex;gap:4px;align-items:center;font-size:.78rem;border:1.5px solid var(--line);border-radius:999px;padding:2px 9px;color:#6E89A8}
.pip b{font-weight:600}
.pip.on{background:#E3F4EC;border-color:var(--green);color:#1C5C42}
.pip .i{width:14px;height:14px}

@media (max-width:760px){.tips,.grid,.ba,.opts{grid-template-columns:1fr}.thead{flex-direction:column}}

<script>
const TOPICS = [{"id": "ind", "title": "Indentation", "colour": "blue", "tag": "Start here if Python keeps saying IndentationError.", "aim": ["Know which lines belong to a block", "Fix indentation errors on your own", "Test both ways through an if"], "learn": "\u003cp>Python uses the spaces at the start of a line to work out which lines belong together. Those spaces are called \u003cstrong>indentation\u003c/strong>, and Python takes them very seriously.\u003c/p>\n\u003col class=\"rules\">\n\u003cli>A line that ends with a colon \u003ccode>:\u003c/code> starts a \u003cstrong>block\u003c/strong>.\u003c/li>\n\u003cli>Every line in the block is indented one step: \u003cstrong>4 spaces\u003c/strong>. Press \u003ckbd>Tab\u003c/kbd> rather than counting spaces.\u003c/li>\n\u003cli>All the lines in a block line up exactly.\u003c/li>\n\u003cli>To finish the block, go back out with \u003ckbd>Shift\u003c/kbd>+\u003ckbd>Tab\u003c/kbd>. That line runs whatever happened in the block.\u003c/li>\n\u003cli>A block can hold another block. That's two steps in: 8 spaces.\u003c/li>\n\u003c/ol>", "example": "score = int(input(\"Your score? \"))\nif score >= 5:\n    print(\"Well done!\")\n    print(\"You passed.\")\nprint(\"Thanks for playing.\")", "example_note": "The shading shows the block. Lines 3 and 4 are inside the if, so they only run when the score is 5 or more. Line 5 is back out, so it always runs. Run it twice: once with 7, then with 2.", "puzzle": {"prompt": "Only tell people to wear sun cream when it's hot. Everyone should get \u003ccode>Have a good day.\u003c/code>", "lines": [["temp = int(input(\"Temperature? \"))", 0], ["if temp > 25:", 0], ["print(\"It's hot today!\")", 1], ["print(\"Wear sun cream.\")", 1], ["print(\"Have a good day.\")", 0]]}, "fix": {"html": "\u003cp>This should greet Sam with two lines. Everyone, including Sam, gets \u003ccode>Bye for now.\u003c/code> Press \u003cstrong>Run\u003c/strong> to see the error, read the hint, then fix it.\u003c/p>", "starter": "name = input(\"What's your name? \")\nif name == \"Sam\":\nprint(\"Hi Sam!\")\n  print(\"Good to see you again.\")\nprint(\"Bye for now.\")", "check": {"inputs": ["Sam"], "win": "Both hello lines are in the block, and everyone gets the goodbye.", "py": "\ndef solid(text):\n    return [l.strip() for l in text.split(\"\\n\") if l.strip()]\n\ndef after(r, n):\n    return \"\\n\".join(r.out.split(\"\\n\")[n:])\n\nasync def try_run(typed, what):\n    try:\n        return await C.rerun(typed)\n    except CheckFail as e:\n        if \"never ends\" in str(e):\n            fail(what + \" it got stuck in a loop that never ends. \" + LOOP_TIP)\n        if \"more answers\" in str(e) and ASK_TIP:\n            fail(what + \" it asked for the password again. \" + ASK_TIP)\n        raise\nLOOP_TIP = \"\"\nASK_TIP = \"\"\n\nls = solid(out)\nif \"Hi Sam!\" not in out or \"Good to see you again.\" not in out:\n    fail(\"When I typed Sam, I should get both `Hi Sam!` and `Good to see you again.` Both lines belong inside the if, so both need one step of indent.\")\nif \"Bye for now.\" not in out:\n    fail(\"When I typed Sam, it should end with `Bye for now.`\")\nr = await C.rerun([\"Ali\"])\nif \"Hi Sam\" in r.out or \"Good to see you\" in r.out:\n    fail(\"When I typed Ali, it still said a hello line meant for Sam. Every hello line must be indented inside the if.\")\nif \"Bye for now.\" not in r.out:\n    fail(\"When I typed Ali, it should still say `Bye for now.` That line belongs back out, with no indent.\")\n"}}, "test": {"html": "\u003cp>\u003cstrong>The spec:\u003c/strong> with 10 coins or more you buy a ride ticket, pay 10 coins and see \u003ccode>Enjoy the ride!\u003c/code>. With fewer than 10 you see \u003ccode>Not enough coins.\u003c/code> Everyone sees how many coins they have left.\u003c/p>\n\u003cp>This code runs without errors, but one line is in the wrong block. Use the test table to find it: run the program once for each row and tick what happened. Then fix it.\u003c/p>", "starter": "coins = int(input(\"How many coins? \"))\nif coins >= 10:\n    print(\"You buy a ticket.\")\n    coins = coins - 10\nelse:\n    print(\"Not enough coins.\")\n    print(\"Enjoy the ride!\")\nprint(\"Coins left:\", coins)", "table": [["Normal", "15", "Ticket, Enjoy the ride!, 5 left"], ["Boundary", "10", "Ticket, Enjoy the ride!, 0 left"], ["Boundary", "9", "Not enough coins, 9 left"], ["Normal", "0", "Not enough coins, 0 left"]], "check": {"inputs": ["15"], "win": "Every test passes. That's what testing is for: the code ran fine, but it was wrong.", "py": "\ndef solid(text):\n    return [l.strip() for l in text.split(\"\\n\") if l.strip()]\n\ndef after(r, n):\n    return \"\\n\".join(r.out.split(\"\\n\")[n:])\n\nasync def try_run(typed, what):\n    try:\n        return await C.rerun(typed)\n    except CheckFail as e:\n        if \"never ends\" in str(e):\n            fail(what + \" it got stuck in a loop that never ends. \" + LOOP_TIP)\n        if \"more answers\" in str(e) and ASK_TIP:\n            fail(what + \" it asked for the password again. \" + ASK_TIP)\n        raise\nLOOP_TIP = \"\"\nASK_TIP = \"\"\n\nfor typed, ticket, left in [(\"15\", True, 5), (\"10\", True, 0), (\"9\", False, 9), (\"0\", False, 0)]:\n    r = await C.rerun([typed])\n    text = after(r, 1)\n    if ticket and \"Enjoy the ride!\" not in text:\n        fail(f\"I typed {typed}. That buys a ticket, so it should say `Enjoy the ride!` The line is in the wrong block: it belongs with the ticket lines.\")\n    if not ticket and \"Enjoy the ride!\" in text:\n        fail(f\"I typed {typed}. That isn't enough for a ticket, but it still said `Enjoy the ride!` Move that line into the if block, with the ticket lines.\")\n    if not re.search(r\"Coins left:\\s*\" + str(left) + r\"\\b\", text):\n        fail(f\"I typed {typed}. It should finish with `Coins left: {left}`.\")\n"}}, "quiz": [{"q": "What's the best way to indent a line in these code boxes?", "o": ["Press the space bar once", "Press Tab, which adds 4 spaces", "Press Enter twice", "Type a colon"], "a": 1, "e": "Tab adds exactly 4 spaces, so your lines always line up. Shift+Tab takes 4 away."}, {"q": "What will this print?", "code": "x = 3\nif x > 5:\n    print(\"A\")\n    print(\"B\")\nprint(\"C\")", "o": ["A, B, C", "C", "B, C", "Nothing"], "a": 1, "e": "3 isn't more than 5, so the whole indented block is skipped: A and B. C is back out, so it always prints."}, {"q": "Python says IndentationError: expected an indented block. What's wrong?", "o": ["A line is indented too far", "The line after a colon isn't indented", "A bracket is missing", "A variable is misspelt"], "a": 1, "e": "A colon promises a block. Python expected the next line to be indented, and it wasn't."}, {"q": "Which line is wrong?", "code": "if age > 12:\n    print(\"Teen ticket\")\n     print(\"Enjoy the film\")", "o": ["Line 1", "Line 2", "Line 3", "None of them"], "a": 2, "e": "Line 3 has 5 spaces, so it doesn't line up with line 2. Lines in the same block must line up exactly."}]}, {"id": "if", "title": "if statements", "colour": "green", "tag": "if, elif and else: making choices.", "aim": ["Line up if, elif and else", "Know that only one block runs", "Test the boundaries"], "learn": "\u003cp>An \u003ccode>if\u003c/code> lets your program choose. Python checks each condition from the top. It runs the block of the \u003cstrong>first\u003c/strong> one that's True and skips all the rest.\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>if\u003c/code>, \u003ccode>elif\u003c/code> and \u003ccode>else\u003c/code> all \u003cstrong>line up\u003c/strong> with each other, and each ends with a colon.\u003c/li>\n\u003cli>Each one's block is indented one step underneath it.\u003c/li>\n\u003cli>\u003ccode>else\u003c/code> has no condition. It catches everything that's left.\u003c/li>\n\u003c/ul>", "example": "battery = int(input(\"Battery %? \"))\nif battery >= 50:\n    print(\"You're fine.\")\nelif battery >= 20:\n    print(\"Charge it soon.\")\nelse:\n    print(\"Charge it now!\")\nprint(\"Phone check done.\")", "example_note": "if, elif and else start in the same place. Try 80, then 30, then 5: a different block runs each time, but Phone check done. always appears.", "puzzle": {"prompt": "Under 12 pays 5 pounds, 12 to 64 pays 9 pounds, and 65 or over pays 6 pounds. Everyone is told their price.", "lines": [["age = int(input(\"How old are you? \"))", 0], ["if age \u003c 12:", 0], ["price = 5", 1], ["elif age \u003c 65:", 0], ["price = 9", 1], ["else:", 0], ["price = 6", 1], ["print(\"Your ticket costs\", price, \"pounds\")", 0]]}, "fix": {"html": "\u003cp>\u003cstrong>The spec:\u003c/strong> 40 or more is grade A, 25 to 39 is B, below 25 is C. \u003cstrong>Everyone\u003c/strong> sees \u003ccode>Well done for finishing!\u003c/code>\u003c/p>\u003cp>There are two indentation bugs. Python will spot one. You'll need to test to find the other.\u003c/p>", "starter": "mark = int(input(\"Mark out of 50? \"))\nif mark >= 40:\n    print(\"Grade: A\")\n    elif mark >= 25:\n    print(\"Grade: B\")\nelse:\n    print(\"Grade: C\")\n    print(\"Well done for finishing!\")", "check": {"inputs": ["45"], "win": "Right grade every time, and everyone is praised.", "py": "\ndef solid(text):\n    return [l.strip() for l in text.split(\"\\n\") if l.strip()]\n\ndef after(r, n):\n    return \"\\n\".join(r.out.split(\"\\n\")[n:])\n\nasync def try_run(typed, what):\n    try:\n        return await C.rerun(typed)\n    except CheckFail as e:\n        if \"never ends\" in str(e):\n            fail(what + \" it got stuck in a loop that never ends. \" + LOOP_TIP)\n        if \"more answers\" in str(e) and ASK_TIP:\n            fail(what + \" it asked for the password again. \" + ASK_TIP)\n        raise\nLOOP_TIP = \"\"\nASK_TIP = \"\"\n\nfor typed, grade in [(\"45\", \"A\"), (\"40\", \"A\"), (\"39\", \"B\"), (\"25\", \"B\"), (\"24\", \"C\"), (\"0\", \"C\")]:\n    r = await C.rerun([typed])\n    text = after(r, 1)\n    got = re.findall(r\"Grade:\\s*([ABC])\", text)\n    if got != [grade]:\n        fail(f\"I typed {typed}. It should say `Grade: {grade}`\" + (f\", but it said Grade: {', '.join(got)}.\" if got else \", but no grade appeared.\"))\n    if \"Well done for finishing!\" not in text:\n        fail(f\"I typed {typed} and didn't get `Well done for finishing!` Everyone should see it, so it belongs back out, with no indent.\")\n"}}, "test": {"html": "\u003cp>\u003cstrong>The spec:\u003c/strong> 50% or more says \u003ccode>You're fine.\u003c/code>, 20% to 49% says \u003ccode>Charge it soon.\u003c/code>, and below 20% says \u003ccode>Charge it now!\u003c/code>\u003c/p>\n\u003cp>This looks right, and it works for 80 and 5. But bugs love to hide on the \u003cstrong>boundaries\u003c/strong>: the exact numbers where the answer changes. Run every row of the test table, find the bugs, then fix them.\u003c/p>", "starter": "battery = int(input(\"Battery %? \"))\nif battery > 50:\n    print(\"You're fine.\")\nelif battery > 20:\n    print(\"Charge it soon.\")\nelse:\n    print(\"Charge it now!\")", "table": [["Normal", "80", "You're fine."], ["Boundary", "50", "You're fine."], ["Boundary", "49", "Charge it soon."], ["Boundary", "20", "Charge it soon."], ["Boundary", "19", "Charge it now!"], ["Normal", "5", "Charge it now!"]], "check": {"inputs": ["80"], "win": "Spot on at every boundary.", "py": "\ndef solid(text):\n    return [l.strip() for l in text.split(\"\\n\") if l.strip()]\n\ndef after(r, n):\n    return \"\\n\".join(r.out.split(\"\\n\")[n:])\n\nasync def try_run(typed, what):\n    try:\n        return await C.rerun(typed)\n    except CheckFail as e:\n        if \"never ends\" in str(e):\n            fail(what + \" it got stuck in a loop that never ends. \" + LOOP_TIP)\n        if \"more answers\" in str(e) and ASK_TIP:\n            fail(what + \" it asked for the password again. \" + ASK_TIP)\n        raise\nLOOP_TIP = \"\"\nASK_TIP = \"\"\n\nfor typed, want in [(\"80\", \"You're fine.\"), (\"50\", \"You're fine.\"), (\"49\", \"Charge it soon.\"), (\"20\", \"Charge it soon.\"), (\"19\", \"Charge it now!\"), (\"5\", \"Charge it now!\"), (\"100\", \"You're fine.\"), (\"0\", \"Charge it now!\")]:\n    r = await C.rerun([typed])\n    text = after(r, 1)\n    if want not in text:\n        tip = {\"50\": \" That's a boundary. The spec says 50% or more, so the test needs >= not >.\",\n               \"20\": \" That's a boundary. The spec says 20% to 49% is Charge it soon, so 20 counts: use >= not >.\"}.get(typed, \"\")\n        fail(f\"I typed {typed}. It should say: `{want}`{tip}\")\n"}}, "quiz": [{"q": "What will this print?", "code": "temp = 30\nif temp > 20:\n    print(\"Warm\")\nelif temp > 25:\n    print(\"Hot\")\nelse:\n    print(\"Cold\")", "o": ["Warm", "Hot", "Warm, then Hot", "Cold"], "a": 0, "e": "30 > 20 is True, so Warm prints and Python skips the rest. elif is only checked if everything above it was False."}, {"q": "What will this print?", "code": "score = 10\nif score > 5:\n    print(\"Good\")\nif score > 8:\n    print(\"Great\")", "o": ["Good", "Great", "Good, then Great", "Nothing"], "a": 2, "e": "These are two separate ifs, not if and elif, so Python checks both. Both are True."}, {"q": "What's missing from this code?", "code": "if colour == \"red\"\n    print(\"Stop\")", "o": ["A bracket", "A colon at the end of line 1", "An else", "Nothing"], "a": 1, "e": "Every if, elif and else line ends with a colon. The colon tells Python a block is coming."}, {"q": "The rule is: if age >= 13. Which age is the boundary test?", "o": ["13", "20", "5", "thirteen"], "a": 0, "e": "13 is exactly where the answer changes. Test 13 and 12, because that's where bugs hide."}]}, {"id": "loop", "title": "Loops", "colour": "amber", "tag": "for and while: doing things again and again.", "aim": ["Put the right lines inside the loop", "Make a while loop stop", "Test more than the easy case"], "learn": "\u003cp>A loop repeats its block. The indented lines run every time round. The first line that's back out runs \u003cstrong>once\u003c/strong>, after the loop has finished.\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>for\u003c/code> repeats a set number of times: \u003ccode>for lap in range(3):\u003c/code> goes round 3 times.\u003c/li>\n\u003cli>\u003ccode>while\u003c/code> repeats as long as its condition is True. Something inside the loop must change, or it never stops.\u003c/li>\n\u003cli>Ask yourself about every line: \u003cstrong>should this happen every time, or just once?\u003c/strong> Every time means indented. Once means back out.\u003c/li>\n\u003c/ul>", "example": "for lap in range(1, 4):\n    print(\"Lap\", lap)\n    print(\"Keep going!\")\nprint(\"Race finished!\")", "example_note": "Lines 2 and 3 are in the loop, so they run 3 times. Line 4 is back out, so it runs once at the end.", "puzzle": {"prompt": "Ask for 3 scores and add each one to the total. Show the total once, at the end.", "lines": [["total = 0", 0], ["for game in range(3):", 0], ["score = int(input(\"Score? \"))", 1], ["total = total + score", 1], ["print(\"Total score:\", total)", 0]]}, "fix": {"html": "\u003cp>This should show all five square numbers, then say \u003ccode>All done!\u003c/code> once. It runs without an error, but it's wrong. Run it, spot the problem, then fix it.\u003c/p>", "starter": "for number in range(1, 6):\n    square = number * number\nprint(number, \"squared is\", square)\nprint(\"All done!\")", "check": {"win": "Five squares, then All done! just once.", "py": "\ndef solid(text):\n    return [l.strip() for l in text.split(\"\\n\") if l.strip()]\n\ndef after(r, n):\n    return \"\\n\".join(r.out.split(\"\\n\")[n:])\n\nasync def try_run(typed, what):\n    try:\n        return await C.rerun(typed)\n    except CheckFail as e:\n        if \"never ends\" in str(e):\n            fail(what + \" it got stuck in a loop that never ends. \" + LOOP_TIP)\n        if \"more answers\" in str(e) and ASK_TIP:\n            fail(what + \" it asked for the password again. \" + ASK_TIP)\n        raise\nLOOP_TIP = \"\"\nASK_TIP = \"\"\n\nls = solid(out)\nwant = [f\"{n} squared is {n * n}\" for n in range(1, 6)]\ngot = [l for l in ls if \"squared is\" in l]\nif got != want:\n    fail(f\"It printed {len(got)} square line(s). It should print all five, from `1 squared is 1` to `5 squared is 25`. Which line needs to happen every time round the loop?\")\nif ls.count(\"All done!\") != 1:\n    fail(\"`All done!` should appear once. If it appears five times, it's inside the loop: move it back out.\")\nif ls[-1] != \"All done!\":\n    fail(\"`All done!` should be the very last line.\")\n"}}, "test": {"html": "\u003cp>\u003cstrong>The spec:\u003c/strong> keep asking for the password until it's \u003ccode>pizza42\u003c/code>, saying \u003ccode>Wrong password, try again.\u003c/code> after each wrong one. Then say \u003ccode>Welcome in!\u003c/code>\u003c/p>\n\u003cp>Type the right password first and it looks nearly fine. That's the trap! Run every row of the test table, including the wrong ones. (If a loop never ends, press \u003cstrong>Stop\u003c/strong>.)\u003c/p>", "starter": "password = input(\"Password? \")\nwhile password != \"pizza42\":\n    print(\"Wrong password, try again.\")\npassword = input(\"Password? \")\nprint(\"Welcome in!\")", "table": [["Normal", "pizza42", "Welcome in!"], ["Wrong first", "cheese, then pizza42", "One wrong message, then Welcome in!"], ["Wrong twice", "a, b, then pizza42", "Two wrong messages, then Welcome in!"], ["Capitals", "PIZZA42, then pizza42", "Wrong (capitals count), then Welcome in!"]], "check": {"inputs": ["pizza42", "pizza42"], "loop_tip": "Testing only with the right password hides this bug. The line that asks again has to be inside the loop.", "win": "Right first time or after ten tries, it works. Great testing.", "py": "\ndef solid(text):\n    return [l.strip() for l in text.split(\"\\n\") if l.strip()]\n\ndef after(r, n):\n    return \"\\n\".join(r.out.split(\"\\n\")[n:])\n\nasync def try_run(typed, what):\n    try:\n        return await C.rerun(typed)\n    except CheckFail as e:\n        if \"never ends\" in str(e):\n            fail(what + \" it got stuck in a loop that never ends. \" + LOOP_TIP)\n        if \"more answers\" in str(e) and ASK_TIP:\n            fail(what + \" it asked for the password again. \" + ASK_TIP)\n        raise\nLOOP_TIP = \"\"\nASK_TIP = \"\"\n\nLOOP_TIP = \"The line that asks again has to be inside the loop, or the password never changes.\"\nASK_TIP = \"The line that asks again should only run inside the loop, after a wrong answer. Indent it into the loop.\"\nfor typed in ([\"pizza42\"], [\"cheese\", \"pizza42\"], [\"a\", \"b\", \"pizza42\"], [\"PIZZA42\", \"pizza42\"]):\n    shown = \", then \".join(typed)\n    r = await try_run(typed, f\"I typed {shown}, and\")\n    wrongs = r.out.count(\"Wrong password\")\n    if r.used != len(typed):\n        fail(f\"I typed {shown}. It should keep asking until pizza42, then stop asking.\")\n    if wrongs != len(typed) - 1:\n        fail(f\"I typed {shown}. It should say `Wrong password, try again.` {len(typed) - 1} time(s), but it said it {wrongs} time(s).\")\n    if \"Welcome in!\" not in r.out:\n        fail(f\"I typed {shown}. It should end with `Welcome in!`\")\n"}}, "quiz": [{"q": "How many times does the block of for go in range(4): run?", "o": ["3", "4", "5", "Forever"], "a": 1, "e": "range(4) gives 0, 1, 2 and 3. That's 4 numbers, so 4 times round."}, {"q": "What will this print?", "code": "for i in range(3):\n    print(\"Hi\")\nprint(\"Bye\")", "o": ["Hi, Bye, Hi, Bye, Hi, Bye", "Hi, Hi, Hi, Bye", "Hi, Bye", "Hi, Hi, Hi, Bye, Bye, Bye"], "a": 1, "e": "Only the indented line repeats. Bye is back out, so it runs once at the end."}, {"q": "What will this print?", "code": "n = 1\nwhile n \u003c 10:\n    n = n * 2\nprint(n)", "o": ["8", "10", "16", "1, 2, 4, 8"], "a": 2, "e": "n goes 1, 2, 4, 8, 16. When n is 16, n \u003c 10 is False and the loop stops. The print is back out, so it shows 16 once."}, {"q": "A while loop never stops. What's the most likely cause?", "o": ["It has too many lines", "Nothing inside the loop changes the condition", "print is inside the loop", "It needs range()"], "a": 1, "e": "The condition is checked every time round. If nothing inside the loop changes it, it stays True forever."}]}, {"id": "sub", "title": "Subroutines", "colour": "purple", "tag": "def, calling, parameters and return.", "aim": ["Keep a subroutine's lines inside its def", "Call it from the main program", "Use return to send a value back"], "learn": "\u003cp>A subroutine is a named block of code. You write it once with \u003ccode>def\u003c/code>, then use it whenever you like by \u003cstrong>calling\u003c/strong> it.\u003c/p>\n\u003cul>\n\u003cli>The \u003ccode>def\u003c/code> line ends with a colon, and the lines that belong to the subroutine are indented underneath it.\u003c/li>\n\u003cli>\u003ccode>def\u003c/code> only \u003cstrong>defines\u003c/strong> it. Nothing happens until you call it, like \u003ccode>greet(\"Priya\")\u003c/code>.\u003c/li>\n\u003cli>Calls usually go in the \u003cstrong>main program\u003c/strong> at the bottom, with no indent.\u003c/li>\n\u003cli>\u003ccode>return\u003c/code> sends a value back to wherever it was called. It must be indented inside the def.\u003c/li>\n\u003c/ul>", "example": "def greet(name):\n    print(\"Hello\", name)\n    print(\"Welcome to coding club!\")\n\ngreet(\"Priya\")\ngreet(\"Leo\")", "example_note": "Lines 2 and 3 belong to greet. Lines 5 and 6 are the main program: two calls, so the welcome happens twice, once for each name.", "puzzle": {"prompt": "The three menu lines belong to show_menu. Then the main program shows the menu and asks for a choice.", "lines": [["def show_menu():", 0], ["print(\"1. Pizza\")", 1], ["print(\"2. Pasta\")", 1], ["print(\"3. Salad\")", 1], ["show_menu()", 0], ["choice = input(\"Pick 1, 2 or 3: \")", 0]]}, "fix": {"html": "\u003cp>This should print the title \u003ccode>== Number Machine ==\u003c/code>, then \u003ccode>8\u003c/code>, then \u003ccode>20\u003c/code>. There are two indentation bugs. Python will tell you about one. The other is silent: the title never appears.\u003c/p>", "starter": "def double(number):\n    answer = number * 2\nreturn answer\n\ndef show_title():\n    print(\"== Number Machine ==\")\n    show_title()\n\nprint(double(4))\nprint(double(10))", "check": {"win": "Title, 8, 20. Both bugs fixed.", "py": "\ndef solid(text):\n    return [l.strip() for l in text.split(\"\\n\") if l.strip()]\n\ndef after(r, n):\n    return \"\\n\".join(r.out.split(\"\\n\")[n:])\n\nasync def try_run(typed, what):\n    try:\n        return await C.rerun(typed)\n    except CheckFail as e:\n        if \"never ends\" in str(e):\n            fail(what + \" it got stuck in a loop that never ends. \" + LOOP_TIP)\n        if \"more answers\" in str(e) and ASK_TIP:\n            fail(what + \" it asked for the password again. \" + ASK_TIP)\n        raise\nLOOP_TIP = \"\"\nASK_TIP = \"\"\n\nls = solid(out)\nif \"== Number Machine ==\" not in ls:\n    fail(\"The title doesn't appear. The call `show_title()` is indented, so it's inside the def and never runs. Move it back out, above the prints.\")\nif ls != [\"== Number Machine ==\", \"8\", \"20\"]:\n    fail(\"It should print exactly three lines: the title, then 8, then 20. Yours printed: \" + \" / \".join(ls))\nr = await C.call(\"double\", 7)\nif r.ret != 14:\n    fail(\"I tested `double(7)`. It should return 14.\")\n"}}, "test": {"html": "\u003cp>\u003cstrong>The spec:\u003c/strong> \u003ccode>area(width, height)\u003c/code> sends back the area of a rectangle. The main program adds two rooms together, which should give \u003ccode>Total floor: 22\u003c/code>.\u003c/p>\n\u003cp>Run it: the areas print, then it crashes. Test the subroutine with the table (you can add lines like \u003ccode>print(area(3, 4))\u003c/code> to test), then fix it.\u003c/p>", "starter": "def area(width, height):\n    print(width * height)\n\nroom1 = area(3, 4)\nroom2 = area(2, 5)\nprint(\"Total floor:\", room1 + room2)", "table": [["Normal", "area(3, 4)", "Sends back 12"], ["Normal", "area(2, 5)", "Sends back 10"], ["Boundary", "area(0, 7)", "Sends back 0"], ["Whole program", "Run it", "Total floor: 22"]], "check": {"win": "area sends its answer back, so the main program can use it.", "py": "\ndef solid(text):\n    return [l.strip() for l in text.split(\"\\n\") if l.strip()]\n\ndef after(r, n):\n    return \"\\n\".join(r.out.split(\"\\n\")[n:])\n\nasync def try_run(typed, what):\n    try:\n        return await C.rerun(typed)\n    except CheckFail as e:\n        if \"never ends\" in str(e):\n            fail(what + \" it got stuck in a loop that never ends. \" + LOOP_TIP)\n        if \"more answers\" in str(e) and ASK_TIP:\n            fail(what + \" it asked for the password again. \" + ASK_TIP)\n        raise\nLOOP_TIP = \"\"\nASK_TIP = \"\"\n\nC.need(\"area\", 2)\nfor w, h in [(3, 4), (2, 5), (0, 7), (6, 6)]:\n    r = await C.call(\"area\", w, h)\n    if r.ret is None:\n        fail(f\"I tested `area({w}, {h})` and nothing came back. Printing shows the answer, but only `return` sends it back. Write `return width * height`.\")\n    if r.ret != w * h:\n        fail(f\"I tested `area({w}, {h})`. It should send back {w * h}, but sent back {r.ret!r}.\")\nif not re.search(r\"Total floor:\\s*22\\b\", out):\n    fail(\"The main program should finish with `Total floor: 22`.\")\n"}}, "quiz": [{"q": "What will this print?", "code": "def cheer():\n    print(\"Go team!\")\n\nprint(\"Start\")", "o": ["Go team!, then Start", "Start", "Start, then Go team!", "Nothing"], "a": 1, "e": "def only defines cheer. Nothing calls cheer(), so Go team! never prints."}, {"q": "What will this print?", "code": "def add_bonus(score):\n    return score + 5\n\npoints = add_bonus(10)\nprint(points)", "o": ["10", "5", "15", "add_bonus"], "a": 2, "e": "10 goes in as score. return sends back 15, which is stored in points."}, {"q": "Where does the line that calls a subroutine usually go?", "o": ["Indented inside its own def", "In the main program, with no indent", "Above the def, indented", "Anywhere: indentation doesn't matter"], "a": 1, "e": "If you indent the call inside its own def, it becomes part of the subroutine and never runs."}, {"q": "What does return do?", "o": ["Prints the answer", "Sends a value back to where the subroutine was called", "Starts the subroutine again", "Ends the whole program"], "a": 1, "e": "return hands a value back, so the main program can store it or use it, like total = area(3, 4)."}]}];
const DOCTOR = [{"err": "IndentationError: expected an indented block", "means": "A line ends with a colon, so Python expected a block, but the next line isn't indented.", "bad": "if score > 5:\nprint(\"Well done\")", "good": "if score > 5:\n    print(\"Well done\")", "fix": "Click at the start of the line after the colon and press Tab.", "topic": "ind"}, {"err": "IndentationError: unexpected indent", "means": "This line is indented, but nothing above it started a block.", "bad": "name = \"Sam\"\n    print(name)", "good": "name = \"Sam\"\nprint(name)", "fix": "Press Shift+Tab so it lines up with the line above. Or is the line above missing its colon?", "topic": "ind"}, {"err": "IndentationError: unindent does not match any outer indentation level", "means": "This line doesn't line up with any line above it. Usually it has 1, 2 or 3 spaces too many or too few.", "bad": "if score > 5:\n    print(\"Well done\")\n  print(\"Bye\")", "good": "if score > 5:\n    print(\"Well done\")\nprint(\"Bye\")", "fix": "Indents come in steps of 4. Use Shift+Tab or Tab until it lines up exactly.", "topic": "ind"}, {"err": "SyntaxError: invalid syntax (on an elif or else line)", "means": "elif and else must start in exactly the same place as their if.", "bad": "if mark >= 40:\n    print(\"A\")\n    else:\n    print(\"B\")", "good": "if mark >= 40:\n    print(\"A\")\nelse:\n    print(\"B\")", "fix": "Press Shift+Tab on the elif or else line until it lines up with the if.", "topic": "if"}, {"err": "SyntaxError: expected ':'", "means": "if, elif, else, for, while and def lines all end with a colon.", "bad": "while lives > 0\n    play()", "good": "while lives > 0:\n    play()", "fix": "Add a colon to the end of that line.", "topic": "if"}, {"err": "SyntaxError: 'return' outside function", "means": "The return line isn't indented, so Python thinks it's in the main program.", "bad": "def double(n):\n    answer = n * 2\nreturn answer", "good": "def double(n):\n    answer = n * 2\n    return answer", "fix": "Press Tab so return lines up with the rest of the subroutine.", "topic": "sub"}, {"err": "My program never stops", "means": "A while loop's condition never becomes False. Often the line that changes it isn't indented inside the loop.", "bad": "guess = input(\"Password? \")\nwhile guess != \"open\":\n    print(\"Wrong\")\nguess = input(\"Password? \")", "good": "guess = input(\"Password? \")\nwhile guess != \"open\":\n    print(\"Wrong\")\n    guess = input(\"Password? \")", "fix": "Press Stop. Then find the line that should change the condition each time round and indent it into the loop.", "topic": "loop"}, {"err": "No error, but a line runs too often (or only once)", "means": "The line is in the wrong block. Indented means it repeats with the loop. Back out means it runs once.", "bad": "for i in range(3):\n    print(i)\n    print(\"Done\")", "good": "for i in range(3):\n    print(i)\nprint(\"Done\")", "fix": "Ask: should this line happen every time, or once? Then indent it, or bring it back out.", "topic": "loop"}, {"err": "TypeError: ... 'NoneType'", "means": "A subroutine gave back None. It probably prints its answer instead of returning it.", "bad": "def area(w, h):\n    print(w * h)\n\ntotal = area(2, 3) + 1", "good": "def area(w, h):\n    return w * h\n\ntotal = area(2, 3) + 1", "fix": "Use return to send the answer back.", "topic": "sub"}];
const RUNTIME_PY = "import ast\nimport builtins\nimport copy\nimport difflib\nimport inspect\nimport io\nimport json\nimport random\nimport re\nimport sys\nimport tokenize\nimport traceback\n\nimport rt_js\n\nFILENAME = \"\u003cyour code>\"\nLOOP_LIMIT = 200000\n\n\nclass LoopLimit(Exception):\n    pass\n\n\nclass NeedInput(Exception):\n    pass\n\n\nclass CheckFail(Exception):\n    pass\n\n\n# queue: None = ask the real person; a list = scripted answers (used by Check)\n# hits: None = not tracking paths; a set = keys of the if/elif/else paths that ran\n_state = {\"count\": 0, \"queue\": None, \"used\": 0, \"hits\": None}\n\n\ndef _rt_guard():\n    _state[\"count\"] += 1\n    if _state[\"count\"] > LOOP_LIMIT:\n        raise LoopLimit()\n\n\ndef _rt_hit(key):\n    if _state[\"hits\"] is not None:\n        _state[\"hits\"].add(key)\n\n\nasync def _rt_input(prompt=\"\"):\n    sys.stdout.write(str(prompt))\n    q = _state[\"queue\"]\n    if q is not None:\n        if not q:\n            raise NeedInput()\n        value = q.pop(0)\n        _state[\"used\"] += 1\n        sys.stdout.write(value + \"\\n\")\n        return value\n    sys.stdout.flush()\n    value = await rt_js.get_input()\n    return str(value)\n\n\ndef _calls_any(node, names):\n    for sub in ast.walk(node):\n        if isinstance(sub, ast.Call) and isinstance(sub.func, ast.Name) and sub.func.id in names:\n            return True\n    return False\n\n\ndef _async_names(tree):\n    # input() becomes awaitable, so any function that (directly or indirectly) calls it must be async too\n    names = {\"input\"}\n    funcs = [n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)]\n    changed = True\n    while changed:\n        changed = False\n        for f in funcs:\n            if f.name not in names and _calls_any(f, names):\n                names.add(f.name)\n                changed = True\n    return names\n\n\n# ---------------- paths (branch coverage) ----------------\n\ndef _branches(tree, lines):\n    \"\"\"Find every if / elif / else path. Returns {(lineno, kind): info} plus a display list.\"\"\"\n    found = []\n\n    def text(n):\n        return lines[n - 1].strip() if 0 \u003c n \u003c= len(lines) else \"\"\n\n    for node in ast.walk(tree):\n        if not isinstance(node, ast.If):\n            continue\n        kind = \"elif\" if text(node.lineno).startswith(\"elif\") else \"if\"\n        found.append((node.lineno, kind, node))\n        orelse = node.orelse\n        is_elif = (len(orelse) == 1 and isinstance(orelse[0], ast.If)\n                   and text(orelse[0].lineno).startswith(\"elif\"))\n        if orelse and not is_elif:\n            ln = orelse[0].lineno - 1\n            while ln > node.lineno and not text(ln).startswith(\"else\"):\n                ln -= 1\n            found.append((ln, \"else\", node))\n    found.sort(key=lambda x: (x[0], x[1] == \"else\"))\n    seen, table, shown = {}, {}, []\n    for ln, kind, node in found:\n        label = text(ln)\n        if kind == \"else\":\n            label = \"else  (after: \" + text(node.lineno)[:40] + \")\"\n        base = text(ln) + (\"|else|\" + text(node.lineno) if kind == \"else\" else \"\")\n        seen[base] = seen.get(base, 0) + 1\n        key = base + \"#\" + str(seen[base])\n        table[(id(node), kind)] = key\n        shown.append({\"key\": key, \"line\": ln, \"label\": label[:70]})\n    return table, shown\n\n\nclass _Transform(ast.NodeTransformer):\n    def __init__(self, names, paths=None):\n        self.names = names\n        self.paths = paths\n\n    def visit_Call(self, node):\n        self.generic_visit(node)\n        if isinstance(node.func, ast.Name) and node.func.id in self.names:\n            if node.func.id == \"input\":\n                node.func = ast.copy_location(ast.Name(\"_rt_input\", ast.Load()), node.func)\n            return ast.copy_location(ast.Await(node), node)\n        return node\n\n    def visit_FunctionDef(self, node):\n        self.generic_visit(node)\n        if node.name in self.names:\n            new = ast.AsyncFunctionDef(**{f: getattr(node, f) for f in node._fields})\n            return ast.copy_location(new, node)\n        return node\n\n    def _hit(self, key, where):\n        call = ast.Expr(ast.Call(ast.Name(\"_rt_hit\", ast.Load()), [ast.Constant(key)], []))\n        return ast.copy_location(call, where)\n\n    def visit_If(self, node):\n        keys = {}\n        if self.paths is not None:\n            for kind in (\"if\", \"elif\", \"else\"):\n                if (id(node), kind) in self.paths:\n                    keys[kind] = self.paths[(id(node), kind)]\n        self.generic_visit(node)\n        own = keys.get(\"if\") or keys.get(\"elif\")\n        if own:\n            node.body.insert(0, self._hit(own, node.body[0]))\n        if keys.get(\"else\") and node.orelse:\n            node.orelse.insert(0, self._hit(keys[\"else\"], node.orelse[0]))\n        return node\n\n    def _guard_loop(self, node):\n        self.generic_visit(node)\n        guard = ast.Expr(ast.Call(ast.Name(\"_rt_guard\", ast.Load()), [], []))\n        ast.copy_location(guard, node.body[0])\n        node.body.insert(0, guard)\n        return node\n\n    visit_While = _guard_loop\n    visit_For = _guard_loop\n\n\n# ---------------- friendly error hints ----------------\n\nERL_LINES = [\n    (r\"\\bthen\\s*:?\\s*$\", \"Python doesn't use then. End the line with a colon instead, like: if health > 0:\"),\n    (r\"^\\s*(endif|endwhile|endfor|endfunction|endprocedure|endswitch)\\b\",\n     \"Python doesn't need {0}. The indentation shows where a block ends, so delete this line.\"),\n    (r\"^\\s*next\\s+\\w+\\s*$\", \"Python doesn't need next. The indentation shows where the loop ends, so delete this line.\"),\n    (r\"^\\s*(elseif|else\\s+if)\\b\", \"In Python it's elif, like: elif health > 50:\"),\n    (r\"^\\s*for\\s+\\w+\\s*=.*\\bto\\b\", \"That's how exam papers write a loop. In Python it's: for i in range(1, 11):  (range stops before the last number).\"),\n    (r\"^\\s*(procedure|function)\\s+\\w+\", \"In Python, procedures and functions both start with def, like: def show_bag(inventory):\"),\n    (r\"^\\s*(do|until)\\b\", \"Python doesn't have do ... until. Use a while loop instead.\"),\n    (r\"\\b(AND|OR|NOT)\\b\", \"In Python, and, or and not are written in lower case.\"),\n]\n\n\ndef _erl_hint(line_text):\n    if not line_text:\n        return \"\"\n    for pat, msg in ERL_LINES:\n        m = re.search(pat, line_text)\n        if m:\n            return msg.format(m.group(1) if m.groups() else \"\")\n    return \"\"\n\n\nCOMMON_BUILTINS = {\"print\", \"input\", \"int\", \"str\", \"float\", \"len\", \"range\", \"round\", \"abs\", \"min\", \"max\",\n                   \"sum\", \"sorted\", \"list\", \"bool\", \"type\", \"ord\", \"chr\", \"True\", \"False\", \"None\"}\n\n\ndef _did_you_mean(bad, names):\n    builtin_names = set(dir(builtins))\n    cands = sorted({n for n in names if not n.startswith(\"_\") and n != bad\n                    and (n not in builtin_names or n in COMMON_BUILTINS)})\n    for c in cands:\n        if c.lower() == bad.lower():\n            return c\n    close = difflib.get_close_matches(bad, cands, n=1, cutoff=0.8)\n    return close[0] if close else \"\"\n\n\ndef _hint(e):\n    kind = type(e).__name__\n    msg = str(e)\n    low = (getattr(e, \"msg\", \"\") or msg).lower()\n    if kind in (\"IndentationError\", \"TabError\"):\n        return (\"Check the spaces at the start of this line. Lines inside an if, while or for \"\n                \"need 4 spaces, and the lines after it need to line up again.\")\n    if kind == \"SyntaxError\":\n        if \"'await'\" in low:\n            return (\"This page's runner can't use input() in this exact spot. \"\n                    \"Try moving the input() onto its own line.\")\n        if \"invalid character\" in low:\n            if any(c in low for c in \"\\u201c\\u201d\\u2018\\u2019\"):\n                return (\"This line has curly quotes, which sneak in when code is copied from a document. \"\n                        \"Delete them and type the quote marks again, straight from the keyboard.\")\n            return (\"This line has a special character Python can't read, often from copying out of a \"\n                    \"document. Delete the odd symbol and type it again from the keyboard.\")\n        if \"expected ':'\" in low:\n            return \"You might be missing a colon : at the end of this line.\"\n        if \"maybe you meant '=='\" in low:\n            return \"To compare two things, use == (two equals signs). One = stores a value.\"\n        if \"unterminated string\" in low or \"eol while\" in low:\n            return \"A quote mark is missing. Text needs a quote at the start AND at the end.\"\n        if \"never closed\" in low or \"unmatched\" in low or \"does not match\" in low:\n            return \"Your brackets don't match up. Every ( needs a ). The mistake may be on the line above.\"\n        return (\"Python can't understand this line. Check your brackets, quote marks and colons. \"\n                \"Sometimes the real mistake is on the line above.\")\n    if kind == \"NameError\":\n        bad = msg.split(\"'\")[1] if msg.count(\"'\") >= 2 else \"this name\"\n        if bad == \"random\":\n            return \"Python doesn't know what random is yet. Put import random on the very first line of your program.\"\n        return (f\"Python doesn't know what {bad} is. Check the spelling and capital letters \"\n                \"(print, not Print). If it's a variable, give it a value first. \"\n                \"If it's meant to be text, put it in quotes.\")\n    if kind == \"TypeError\":\n        if \"positional argument\" in msg:\n            return (\"The number of values in the call doesn't match the def. Count the values in the \"\n                    \"brackets where you call it, and the parameters in the brackets of the def.\")\n        if \"NoneType\" in msg:\n            return (\"One of these values is None, which means a subroutine gave nothing back. A subroutine \"\n                    \"that prints its answer doesn't return it: add return, like: return width * height\")\n        if \"not supported between instances of 'str' and 'int'\" in msg or \\\n           \"not supported between instances of 'int' and 'str'\" in msg:\n            return \"You're comparing text with a number. Did you forget int() around input()?\"\n        if \"concatenate str\" in msg or (\"unsupported operand\" in msg and \"str\" in msg) or \"can't multiply\" in msg:\n            return (\"You're mixing text and numbers. Use int() to turn typed text into a number. \"\n                    \"To show a number with text, use a comma in print instead of +.\")\n        return \"Something is the wrong type here, for example text where a number should be.\"\n    if kind == \"AttributeError\" and \"NoneType\" in msg:\n        return (\"Your list has turned into None. Check for list = list.append(...) (just write \"\n                \"list.append(...)), or a function that forgot to return the list.\")\n    if kind == \"AttributeError\" and \"random\" in msg:\n        return \"Check the spelling after random. It's random.randint or random.choice.\"\n    if kind == \"ValueError\" and \"x not in list\" in msg:\n        return \"You tried to remove something that isn't in the list. Check with in before you remove it.\"\n    if kind == \"ValueError\" and \"empty range\" in msg:\n        return \"random.randint needs the smaller number first, e.g. random.randint(1, 6).\"\n    if kind == \"ValueError\" and \"invalid literal for int()\" in msg:\n        return \"int() can only turn whole numbers into numbers. What was typed in wasn't a whole number.\"\n    if kind == \"ZeroDivisionError\":\n        return \"You can't divide by zero. Check the number you're dividing by.\"\n    if kind == \"IndexError\":\n        return \"You asked for a position that doesn't exist. Remember positions start at 0.\"\n    return \"\"\n\n\n\ndef _error_line(e):\n    if isinstance(e, SyntaxError):\n        return e.lineno\n    frames = [f for f in traceback.extract_tb(e.__traceback__) if f.filename == FILENAME]\n    return frames[-1].lineno if frames else None\n\n\ndef _known_names(e, ns):\n    names = set(ns or {}) | set(dir(builtins))\n    tb = e.__traceback__\n    while tb is not None:\n        if tb.tb_frame.f_code.co_filename == FILENAME:\n            names |= set(tb.tb_frame.f_locals) | set(tb.tb_frame.f_globals)\n        tb = tb.tb_next\n    return names\n\n\ndef _indent_hint(e, line, lines, text):\n    \"\"\"Plain-English, line-specific help for indentation mistakes.\"\"\"\n    kind = type(e).__name__\n    low = (getattr(e, \"msg\", \"\") or str(e)).lower()\n    if kind in (\"IndentationError\", \"TabError\"):\n        m = re.search(r\"expected an indented block after (.+?) on line (\\d+)\", low)\n        if m:\n            what = m.group(1).replace(\"'\", \"\").replace(\" statement\", \"\").replace(\"function definition\", \"def\")\n            return (f\"Line {m.group(2)} ends with a colon, so the line after it must be indented one step. \"\n                    f\"Click at the start of line {line} and press Tab. Everything that belongs to the {what} \"\n                    \"goes in that indented block.\")\n        if \"unexpected indent\" in low:\n            return (f\"Line {line} is indented, but the line above doesn't end with a colon, so nothing has \"\n                    \"started a block. Press Shift+Tab to line it up with the line above. (Or is a colon \"\n                    \"missing from the line above?)\")\n        if \"unindent does not match\" in low or \"inconsistent\" in low:\n            return (f\"Line {line} doesn't line up with any line above it. Indents come in steps of 4 spaces: \"\n                    \"press Shift+Tab until it lines up exactly with the lines it belongs with.\")\n        if kind == \"TabError\":\n            return \"This line mixes tabs and spaces. Delete the gap at the start and press Tab again.\"\n    if kind == \"SyntaxError\":\n        stripped = text.strip()\n        if re.match(r\"(elif|else)\\b\", stripped) and text != stripped:\n            word = stripped.split()[0].rstrip(\":\")\n            return (f\"{word} must line up exactly with the if it belongs to. Press Shift+Tab until this \"\n                    \"line starts in the same place as its if.\")\n        if \"'return' outside function\" in low:\n            return (f\"return only works inside a def. Press Tab at the start of line {line} so it lines up \"\n                    \"with the other lines of the subroutine above.\")\n    return \"\"\n\n\ndef _full_hint(e, line, lines, ns=None):\n    kind = type(e).__name__\n    text = lines[line - 1] if line and 0 \u003c line \u003c= len(lines) else \"\"\n    ind = _indent_hint(e, line, lines, text)\n    if ind:\n        return ind\n    if kind in (\"SyntaxError\", \"NameError\", \"IndentationError\"):\n        erl = _erl_hint(text)\n        if erl:\n            return erl\n    hint = _hint(e)\n    if kind == \"NameError\":\n        msg = str(e)\n        bad = msg.split(\"'\")[1] if msg.count(\"'\") >= 2 else \"\"\n        guess = _did_you_mean(bad, _known_names(e, ns)) if bad and bad != \"random\" else \"\"\n        if guess:\n            hint = f\"Did you mean {guess}? \" + hint\n    return hint\n\n\ndef _report(e, line, lines=(), ns=None):\n    return {\n        \"type\": \"error\",\n        \"line\": line,\n        \"error\": f\"{type(e).__name__}: {getattr(e, 'msg', None) or e}\",\n        \"hint\": _full_hint(e, line, lines, ns),\n    }\n\n\ndef _compile(src, cover=False, defs_only=False):\n    \"\"\"Returns (code, paths_display) or raises SyntaxError.\"\"\"\n    tree = ast.parse(src, FILENAME)\n    if defs_only:\n        keep = []\n        for n in tree.body:\n            if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef, ast.Import, ast.ImportFrom)):\n                keep.append(n)\n            elif isinstance(n, (ast.Assign, ast.AnnAssign)) and not any(isinstance(s, ast.Call) for s in ast.walk(n)):\n                keep.append(n)\n        tree.body = keep\n    shown = None\n    table = None\n    if cover:\n        table, shown = _branches(tree, src.split(\"\\n\"))\n    tree = _Transform(_async_names(tree), table).visit(tree)\n    ast.fix_missing_locations(tree)\n    code = compile(tree, FILENAME, \"exec\", flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT)\n    return code, shown\n\n\ndef _compile_tree(tree):\n    tree = _Transform(_async_names(tree), None).visit(tree)\n    ast.fix_missing_locations(tree)\n    return compile(tree, FILENAME, \"exec\", flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT)\n\n\ndef _fresh_ns():\n    return {\"__name__\": \"__main__\", \"_rt_input\": _rt_input, \"_rt_guard\": _rt_guard, \"_rt_hit\": _rt_hit}\n\n\nasync def run(src, cover=False):\n    \"\"\"Run the pupil's program for real (the Run button).\"\"\"\n    _state.update(count=0, queue=None, used=0, hits=set() if cover else None)\n    lines = src.split(\"\\n\")\n    result = {\"type\": \"ok\"}\n    shown = None\n    try:\n        code, shown = _compile(src, cover)\n    except SyntaxError as e:\n        result = _report(e, e.lineno, lines)\n    else:\n        ns = _fresh_ns()\n        try:\n            r = eval(code, ns)\n            if r is not None:\n                await r\n        except LoopLimit:\n            result = {\n                \"type\": \"loop\",\n                \"error\": f\"Stopped: a loop ran more than {LOOP_LIMIT:,} times.\",\n                \"hint\": (\"That usually means an infinite loop. Check that something inside the loop \"\n                         \"changes, so the condition can become False.\"),\n            }\n        except SystemExit:\n            pass\n        except BaseException as e:\n            if \"RT_STOPPED\" in str(e):\n                result = {\"type\": \"stopped\"}\n            else:\n                result = _report(e, _error_line(e), lines, ns)\n    sys.stdout.flush()\n    if cover and shown is not None:\n        result[\"paths\"] = shown\n        result[\"hits\"] = sorted(_state[\"hits\"] or [])\n    _state[\"hits\"] = None\n    return json.dumps(result)\n\n\n# ---------------- Check my code ----------------\n\ndef _show(v):\n    return repr(v)\n\n\ndef _say_inputs(inputs):\n    inputs = list(inputs)\n    if not inputs:\n        return \"\"\n    shown = [repr(x) if x.strip() != x or x == \"\" else x for x in inputs]\n    if len(shown) > 6:\n        return f\" and typed {', '.join(shown[:3])} and so on ({len(shown)} answers)\"\n    return \" and typed \" + \", \".join(shown)\n\n\nclass Result:\n    def __init__(self, out, ns, used, ret=None):\n        self.out = out\n        self.ns = ns\n        self.used = used\n        self.ret = ret\n\n    @property\n    def lines(self):\n        return [l.rstrip() for l in self.out.split(\"\\n\") if l.strip()]\n\n\nasync def _exec_captured(coro_or_none, inputs, seed):\n    \"\"\"Run something with scripted input and captured output. Returns (out, error, used).\"\"\"\n    old = sys.stdout\n    buf = io.StringIO()\n    sys.stdout = buf\n    _state.update(count=0, queue=list(inputs), used=0)\n    random.seed(seed)\n    err = None\n    value = None\n    try:\n        value = await coro_or_none()\n    except SystemExit:\n        pass\n    except BaseException as e:\n        err = e\n    finally:\n        sys.stdout = old\n        _state[\"queue\"] = None\n    return buf.getvalue(), err, _state[\"used\"], value\n\n\ndef _crash_text(err, lines, ns=None):\n    if isinstance(err, NeedInput):\n        return None\n    if isinstance(err, LoopLimit):\n        return \"it got stuck in a loop that never ends. Check that something inside the loop changes.\"\n    line = _error_line(err)\n    where = f\" on line {line}\" if line else \"\"\n    hint = _full_hint(err, line, lines, ns)\n    return f\"it stopped with an error{where}: `{type(err).__name__}: {err}`. \" + hint\n\n\nclass Checker:\n    def __init__(self, src, code, spec):\n        self.src = src\n        self.lines = src.split(\"\\n\")\n        self.code = code\n        self.full = code\n        self.spec = spec\n        self.ns = None\n        self.out = \"\"\n        self.used = 0\n        self.fail_line = None\n\n    # ----- running -----\n    async def rerun(self, inputs=(), seed=None, what=None, _code=None):\n        ns = _fresh_ns()\n        code = _code or self.full\n\n        async def go():\n            r = eval(code, ns)\n            if r is not None:\n                await r\n\n        out, err, used, _ = await _exec_captured(go, inputs, seed)\n        if err is not None:\n            ctx = what or (\"When I ran your program\" + _say_inputs(inputs))\n            if isinstance(err, NeedInput):\n                raise CheckFail(f\"{ctx}, it asked for more answers than I expected. \"\n                                \"Check how many times your program uses input().\")\n            if not isinstance(err, LoopLimit):\n                self.fail_line = _error_line(err)\n            tip = (\" \" + self.spec[\"loop_tip\"]) if isinstance(err, LoopLimit) and self.spec.get(\"loop_tip\") else \"\"\n            raise CheckFail(f\"{ctx}, \" + _crash_text(err, self.lines, ns) + tip)\n        return Result(out, ns, used)\n\n    async def rerun_vars(self, values, inputs=(), seed=None, what=None):\n        \"\"\"Run the whole program again, with the first top-level  name = ...  replaced for each name given.\"\"\"\n        tree = ast.parse(self.src, FILENAME)\n        done = set()\n        for node in tree.body:\n            if (isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name)\n                    and node.targets[0].id in values and node.targets[0].id not in done):\n                node.value = ast.copy_location(ast.Constant(values[node.targets[0].id]), node.value)\n                done.add(node.targets[0].id)\n        return await self.rerun(inputs, seed, what, _code=_compile_tree(tree))\n\n    def assigned(self, name):\n        \"\"\"True if the program has a top-level  name = ...  line.\"\"\"\n        for node in self.tree().body:\n            if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == name for t in node.targets):\n                return True\n        return False\n\n    def count(self, kind, inside=None):\n        \"\"\"How many nodes of an ast type, e.g. C.count(ast.For).\"\"\"\n        node = self.func_node(inside) if inside else self.tree()\n        return sum(isinstance(n, kind) for n in ast.walk(node)) if node is not None else 0\n\n    def funcs(self):\n        return [n for n in self.tree().body if isinstance(n, ast.FunctionDef)]\n\n    def top_calls(self):\n        \"\"\"Names of subroutines called by the main program (not inside a def), in order.\"\"\"\n        names = []\n        for stmt in self.tree().body:\n            if isinstance(stmt, ast.FunctionDef):\n                continue\n            for n in ast.walk(stmt):\n                if isinstance(n, ast.Call) and isinstance(n.func, ast.Name):\n                    names.append(n.func.id)\n        return names\n\n    async def call(self, name, *args, inputs=(), seed=None):\n        f = self.ns.get(name)\n        if not callable(f):\n            raise CheckFail(f\"I couldn't find a subroutine called `{name}`. Check the def line and its spelling.\")\n        shown_args = \", \".join(_show(a) for a in args)\n        args = copy.deepcopy(args)\n\n        async def go():\n            r = f(*args)\n            if inspect.iscoroutine(r):\n                r = await r\n            return r\n\n        out, err, used, value = await _exec_captured(go, inputs, seed)\n        if err is not None:\n            ctx = f\"I tested `{name}({shown_args})`\" + _say_inputs(inputs)\n            if isinstance(err, NeedInput):\n                raise CheckFail(f\"{ctx}, and it kept asking for more answers. \"\n                                \"Does the loop stop once it gets a good answer?\")\n            if not isinstance(err, LoopLimit):\n                self.fail_line = _error_line(err)\n            raise CheckFail(f\"{ctx}, and \" + _crash_text(err, self.lines, self.ns))\n        return Result(out, self.ns, used, value)\n\n    # ----- helpers for the checks -----\n    def need(self, name, nparams=None):\n        f = self.ns.get(name)\n        if f is None:\n            close = _did_you_mean(name, [k for k, v in self.ns.items() if callable(v)])\n            extra = f\" I can see `{close}`. Is that meant to be `{name}`?\" if close else \"\"\n            raise CheckFail(f\"I couldn't find a subroutine called `{name}`. Write it with `def {name}(...):`.{extra}\")\n        if not callable(f):\n            raise CheckFail(f\"`{name}` should be a subroutine made with def, but it's a variable.\")\n        if nparams is not None:\n            try:\n                params = list(inspect.signature(f).parameters)\n            except (TypeError, ValueError):\n                params = []\n            required = [p for p in inspect.signature(f).parameters.values() if p.default is inspect.Parameter.empty]\n            if len(required) != nparams and len(params) != nparams:\n                want = f\"{nparams} parameter\" + (\"\" if nparams == 1 else \"s\")\n                raise CheckFail(f\"`{name}` should have {want} in its brackets, but it has {len(params)}\"\n                                + (f\": `{', '.join(params)}`.\" if params else \".\"))\n        return f\n\n    def comments(self):\n        found = []\n        try:\n            for tok in tokenize.generate_tokens(io.StringIO(self.src).readline):\n                if tok.type == tokenize.COMMENT:\n                    found.append(tok.string)\n        except (tokenize.TokenError, IndentationError, SyntaxError):\n            pass\n        return found\n\n    def tree(self):\n        return ast. /* ---------------- indentation shading ---------------- */
// Each 4-space step gets a tinted band; leftover spaces (not a multiple of 4) show amber.
function shadeLine(line){
  const lead = line.match(/^ */)[0].length;
  const steps = Math.floor(lead / 4), extra = lead % 4;
  let html = "";
  for (let i = 0; i < steps; i++) html += `<span class="ig l${(i % 3) + 1}">    </span>`;
  if (extra) html += `<span class="ig bad">${" ".repeat(extra)}</span>`;
  return html + esc(line.slice(lead));
}
function shadeCode(code){ return code.split("\n").map(shadeLine).join("\n"); }
function codeBlock(code, cls){ return `<pre class="shaded ${cls || ""}">${shadeCode(code)}</pre>`; }

/* ---------------- live indentation checker ---------------- */
// Returns {line: message} for lines whose indentation looks wrong. Mirrors what Python will complain about.
function lintIndent(code){
  const lines = code.split("\n"), out = {};
  const stack = [0];
  let prevColon = false, depth = 0;
  lines.forEach((raw, i) => {
    const n = i + 1, line = raw.replace(/\t/g, "    ");
    const body = line.trim();
    if (!body || body.startsWith("#")) return;
    if (depth > 0) { depth += bracketDelta(body); return; }   // continuation of an open bracket
    const ind = line.length - line.trimStart().length;
    const top = stack[stack.length - 1];
    if (ind % 4) out[n] = `Line ${n} has ${ind} space${ind === 1 ? "" : "s"} at the start. Indents come in steps of 4: use Tab and Shift+Tab.`;
    else if (prevColon && ind <= top) out[n] = `Line ${n} comes straight after a line ending in a colon, so it should be indented one more step. Press Tab at the start of it.`;
    else if (!prevColon && ind > top) out[n] = `Line ${n} is indented, but the line above doesn't end with a colon. Line it up with the line above, or add the missing colon.`;
    else if (prevColon && ind > top + 4) out[n] = `Line ${n} is indented two steps. One step (4 spaces) is enough.`;
    else if (!prevColon && ind < top && !stack.includes(ind)) out[n] = `Line ${n} doesn't line up with any line above it. Press Shift+Tab or Tab until it lines up exactly.`;
    else if (/^(elif|else)\b/.test(body) && !stack.slice(0, -1).includes(ind) && !prevColon) out[n] = `Line ${n}: ${body.split(/[\s:]/)[0]} must line up exactly with its if.`;
    if (prevColon && ind > top) stack.push(ind);
    else while (stack.length > 1 && stack[stack.length - 1] > ind) stack.pop();
    const code_ = body.replace(/#.*$/, "").replace(/("[^"]*"|'[^']*')/g, "\"\"").trimEnd();
    prevColon = code_.endsWith(":");
    depth = Math.max(0, bracketDelta(code_));
  });
  return out;
}
function bracketDelta(s){
  s = s.replace(/("[^"]*"|'[^']*')/g, "");
  return (s.match(/[([{]/g) || []).length - (s.match(/[)\]}]/g) || []).length;
}

let pyPromise = null;
let active = null;          // the runner currently running
const decoder = new TextDecoder();

function loadPython(){
  if (pyPromise) return pyPromise;
  pyPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = PYODIDE_URL;
    s.onload = resolve;
    s.onerror = () => reject(new Error("Could not download Python"));
    document.head.appendChild(s);
  }).then(() => loadPyodide()).then(async py => {
    py.registerJsModule("rt_js", { get_input: () => active ? active.askInput() : Promise.reject(new Error("RT_STOPPED")) });
    const write = buf => { if (active) active.write(decoder.decode(buf, {stream: true})); return buf.length; };
    py.setStdout({ write });
    py.setStderr({ write });
    py.FS.writeFile("/home/pyodide/runtime.py", RUNTIME_PY);
    await py.runPythonAsync("import runtime");
    return py;
  });
  pyPromise.catch(() => { pyPromise = null; });
  return pyPromise;
}
