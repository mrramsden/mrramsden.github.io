          const val = box.value;
          inputRow.remove(); inputRow = null;
          segs.push({t: "in", s: val}); segs.push({t: "out", s: "\n"}); render();
          const p = pending; pending = null; p.resolve(val);
        });
        box.focus({preventScroll: true});
        con.scrollTop = con.scrollHeight;
      });
    },
    stop(){
      if (pending) { if (inputRow) { inputRow.remove(); inputRow = null; } const p = pending; pending = null; p.reject(new Error("RT_STOPPED")); }
    }
  };
  function clearMsgs(){ wrap.querySelectorAll(".msg").forEach(m => m.remove()); }
  function showMsg(cls, html){ const m = el(`<div class="msg ${cls}">${html}</div>`); con.appendChild(m); con.scrollTop = con.scrollHeight; }

  function ready(code){
    if (code.includes("___")) {
      const m = {}; code.split("\n").forEach((l, i) => { if (l.includes("___")) m[i+1] = "gap"; });
      setMarks(m);
      showMsg("warn", "<strong>Fill in the gaps first.</strong>Replace every <code>___</code> with your answer. The gaps are on the highlighted lines.");
      return false;
    }
    setMarks({});
    if (!code.trim()) { showMsg("warn", "<strong>There's no code yet.</strong>Type your program in the box above, then press Run."); return false; }
    return true;
  }
  const bCheck = wrap.querySelector(".check"), cov = wrap.querySelector(".cov");

  // ---- paths tried (if / elif / else) for the adventure box
  function showPaths(res){
    if (!cov || !res.paths) return;
    const keys = new Set(res.paths.map(p => p.key));
    const tried = new Set((S.cover[id] || []).filter(k => keys.has(k)).concat(res.hits || []));
    S.cover[id] = [...tried]; save();
    const n = res.paths.length;
    if (!n) { cov.hidden = true; return; }
    const todo = res.paths.filter(p => !tried.has(p.key)), done = n - todo.length;
    const m = {}; todo.forEach(p => { if (!marks[p.line]) m[p.line] = "todo"; });
    setMarks(Object.assign({}, marks, m));
    cov.hidden = false;
    cov.innerHTML = `<div class="covtop"><strong>Paths tested: ${done} of ${n}</strong><span class="bar"><i style="width:${Math.round(done / n * 100)}%"></i></span><button class="covreset">Start counting again</button></div>` +
      (todo.length ? `<p style="margin:6px 0 0">Every <code>if</code>, <code>elif</code> and <code>else</code> is a path through your program. Run it again and try to reach ${todo.length === 1 ? "this one" : "these"} (highlighted in the line numbers):</p><ul>${todo.slice(0, 6).map(p => `<li>Line ${p.line}: <code>${esc(p.label)}</code></li>`).join("")}${todo.length > 6 ? `<li>and ${todo.length - 6} more</li>` : ""}</ul>`
                   : `<p style="margin:6px 0 0">${IC.tick} You've tried every path. That's proper testing!</p>`);
    cov.querySelector(".covreset").addEventListener("click", () => { S.cover[id] = []; save(); cov.hidden = true; setMarks({}); });
  }

  // ---- Check my code
  async function check(){
    if (active && active !== api) { active.stop(); await active.finished; }
    if (active === api) return;
    clearMsgs(); segs = []; outLen = 0; render();
    const code = ta.value;
    if (!ready(code)) return;
    active = api; let finish; api.finished = new Promise(r => finish = r);
    bRun.disabled = true; bCheck.disabled = true;
    try {
      segs = [{t: "note", s: (window.loadPyodide && pyPromise ? "" : "Loading Python... ") + "Checking your code. I'll run it with my own test answers...\n"}]; render();
      let py;
      try { py = await loadPython(); }
      catch (e) { segs = []; render(); showMsg("error", "<strong>Python couldn't load.</strong>You might be offline, or the site that provides Python is blocked. Ask your teacher to check your work instead."); return; }
      await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
      py.globals.set("_rt_src", code);
      py.globals.set("_rt_spec", JSON.stringify(opts.check));
      const res = JSON.parse(await py.runPythonAsync("await runtime.check(_rt_src, _rt_spec)"));
      segs = [{t: "note", s: "Check finished. Press Run to play your program yourself.\n"}]; render();
      if (res.type === "pass") {
        S.checked[id] = true; save();
        showMsg("pass", `<strong>${IC.tick} Check passed!</strong>${esc(opts.check.win || "This task is done.")}`);
        if (opts.onPass) opts.onPass();
      } else {
        if (res.line) setMarks({[res.line]: "err"});
        showMsg("warn", `<strong>Not quite yet.</strong>${fmt(res.msg)}`);
      }
    } catch (e) {
      showMsg("error", "<strong>Something went wrong checking your code.</strong>" + esc(e && e.message ? e.message.split("\n").slice(-2).join(" ") : e));
    } finally {
      if (active === api) active = null;
      bRun.disabled = false; bCheck.disabled = false; finish();
    }
  }
  if (bCheck) bCheck.addEventListener("click", check);

  async function run(){
    if (active && active !== api) { active.stop(); await active.finished; }
    if (active === api) return;
    clearMsgs(); segs = []; outLen = 0; render();
    const code = ta.value;
    if (!ready(code)) return;
    active = api; let finish; api.finished = new Promise(r => finish = r);
    bRun.disabled = true; bStop.disabled = false; if (bCheck) bCheck.disabled = true;
    try {
      let py;
      if (!window.loadPyodide || !pyPromise) { segs = [{t: "note", s: "Loading Python... the first run takes a few seconds.\n"}]; render(); }
      try { py = await loadPython(); }
      catch (e) {
        segs = []; render();
        showMsg("error", "<strong>Python couldn't load.</strong>You might be offline, or the site that provides Python is blocked. Press <b>Copy</b> and paste your code into IDLE or Thonny instead.");
        return;
      }
      if (segs.length === 1 && segs[0].t === "note") { segs = []; render(); }
      py.globals.set("_rt_src", code);
      py.globals.set("_rt_cover", !!opts.cover);
      const res = JSON.parse(await py.runPythonAsync("await runtime.run(_rt_src, _rt_cover)"));
      render();
      if (res.type === "ok") showMsg("ok", segs.length ? "Program finished." : "Program finished. (It didn't print anything.)");
      else if (res.type === "stopped") showMsg("warn", "<strong>Program stopped.</strong>");
      else if (res.type === "loop") showMsg("warn", `<strong>${esc(res.error)}</strong>${esc(res.hint)}${refLink(res)}`);
      else {
        if (res.line) setMarks({[res.line]: "err"});
        showMsg("error", `<strong>${res.line ? "Problem on line " + res.line : "Problem"}</strong><code>${esc(res.error)}</code>${res.hint ? "<br>" + esc(res.hint) : ""}${refLink(res)}`);
      }
      showPaths(res);
    } catch (e) {
      showMsg("error", "<strong>Something went wrong running your code.</strong>" + esc(e && e.message ? e.message.split("\n").slice(-2).join(" ") : e));
    } finally {
      if (active === api) active = null;
      bRun.disabled = false; bStop.disabled = true; if (bCheck) bCheck.disabled = false; finish();
    }
  }
  bRun.addEventListener("click", run);
  bStop.addEventListener("click", () => api.stop());
  bReset.addEventListener("click", () => {
    if (bReset.dataset.confirm) {
      delete bReset.dataset.confirm; bReset.innerHTML = IC.reset + " Reset";
      ta.value = starter; delete S.code[id]; save(); setMarks({}); clearMsgs(); segs = []; render();
    } else {
      bReset.dataset.confirm = "1"; bReset.innerHTML = IC.reset + " Sure? Click again";
      setTimeout(() => { if (bReset.dataset.confirm) { delete bReset.dataset.confirm; bReset.innerHTML = IC.reset + " Reset"; } }, 4000);
    }
  });
  bCopy.addEventListener("click", async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) {
      ta.select(); try { ok = document.execCommand("copy"); } catch (e2) {}
    }
    bCopy.innerHTML = IC.copy + (ok ? " Copied" : " Press Ctrl+C");
    setTimeout(() => bCopy.innerHTML = IC.copy + " Copy", 1800);
  });
  const bDl = wrap.querySelector(".dl");
  if (bDl) bDl.addEventListener("click", () => {
    const name = ((S.plan && S.plan.title) || "my_adventure").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || "my_adventure";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([ta.value], {type: "text/x-python"}));
    a.download = name + ".py"; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });
  api.finished = Promise.resolve();
  wrap._stop = () => api.stop();
  return wrap;
}

/* ---------------- pages ---------------- */
const page = document.getElementById("page");
const TOPIC_BY = Object.fromEntries(TOPICS.map(t => [t.id, t]));

function quizScore(t){
  const a = S.quiz[t.id] || {};
  return t.quiz.filter((q, i) => a[i] === q.a).length;
}
function stepsDone(t){
  return {
    puzzle: !!S.puzzle[t.id],
    fix: !!S.checked[t.id + "_fix"],
    test: !!S.checked[t.id + "_test"],
    quiz: quizScore(t) >= 3,
  };
}
function pips(t){
  const d = stepsDone(t);
  const names = {puzzle: "Indent it", fix: "Fix it", test: "Test it", quiz: "Quiz"};
  return `<span class="pips">${Object.keys(names).map(k => `<span class="pip ${d[k] ? "on" : ""}" title="${names[k]}${d[k] ? ": done" : ""}">${d[k] ? IC.tick : ""}<b>${names[k]}</b></span>`).join("")}</span>`;
}

                   "Good. One more run through the quiz will help it stick.",

  const cm = page.querySelector("#confmsg");
  if (S.conf[t.id] !== undefined) cm.textContent = confMsg[S.conf[t.id]];

  }));
  page.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
  function refreshPips(){ const p = page.querySelector(".thead .pips"); if (p) p.outerHTML = pips(t); }
  page._refresh = refreshPips;
}

/* ---- Indent it! puzzle */
function buildPuzzle(t, box){
  const lines = t.puzzle.lines;
  const solved = !!S.puzzle[t.id];
  let levels = solved ? lines.map(l => l[1]) : lines.map(() => 0);
  let tries = 0;
  function draw(){
    box.innerHTML = `<ol class="plines">${lines.map((l, i) => `<li data-i="${i}">
        <span class="pbtns"><button class="pl" aria-label="Move line ${i + 1} out" ${levels[i] === 0 || S.puzzle[t.id] ? "disabled" : ""}>&larr;</button><button class="pr" aria-label="Move line ${i + 1} in" ${levels[i] >= 2 || S.puzzle[t.id] ? "disabled" : ""}>&rarr;</button></span>
        <span class="pnum">${i + 1}</span><code class="pcode">${shadeLine("    ".repeat(levels[i]) + l[0])}</code></li>`).join("")}</ol>
      <div class="pact">${S.puzzle[t.id] ? "" : `<button class="btn primary pcheck">${IC.check} Check</button>`}<span class="pmsg" aria-live="polite"></span></div>
      <div class="pslot"></div>`;
    box.querySelectorAll(".pl").forEach(b => b.addEventListener("click", () => { const i = +b.closest("li").dataset.i; levels[i]--; draw(); }));
    box.querySelectorAll(".pr").forEach(b => b.addEventListener("click", () => { const i = +b.closest("li").dataset.i; levels[i]++; draw(); }));
    const c = box.querySelector(".pcheck");
    if (c) c.addEventListener("click", check);
    if (S.puzzle[t.id]) done(false);
  }
  function check(){
    tries++;
    const wrong = lines.map((l, i) => levels[i] !== l[1] ? i : -1).filter(i => i >= 0);
    box.querySelectorAll(".plines li").forEach((li, i) => li.classList.toggle("wrong", wrong.includes(i)));
    const msg = box.querySelector(".pmsg");
    if (!wrong.length) { S.puzzle[t.id] = true; save(); draw(); if (page._refresh) page._refresh(); return; }
    const colonMiss = wrong.find(i => i > 0 && /:\s*$/.test(lines[i - 1][0]) && levels[i] <= levels[i - 1]);
    let tip;
    if (colonMiss !== undefined) tip = `Look at line ${colonMiss}: it ends with a colon, so line ${colonMiss + 1} must be indented.`;
    else tip = `Line${wrong.length > 1 ? "s" : ""} ${wrong.map(i => i + 1).join(", ")} ${wrong.length > 1 ? "aren't" : "isn't"} right yet. For each one, ask: does it belong to the block, or should it run whatever happens?`;
    msg.innerHTML = `<span class="bad">${esc(tip)}</span>` + (tries >= 3 ? ` <button class="linkbtn pshow">Show me the answer</button>` : "");
    const sh = box.querySelector(".pshow");
    if (sh) sh.addEventListener("click", () => { levels = lines.map(l => l[1]); draw(); box.querySelector(".pmsg").innerHTML = "<span>Here's the answer. Read it through: why is each line where it is? Then press Check.</span>"; });
  }
  function done(){
    box.querySelector(".pmsg").innerHTML = `<span class="good">${IC.tick} Spot on. Every line is in the right block. Try running it:</span>`;
    const slot = box.querySelector(".pslot");
    if (!slot.firstChild) slot.appendChild(makeRunner(t.id + "_puz", lines.map(l => "    ".repeat(l[1]) + l[0]).join("\n"), "Your puzzle as code"));
  }
  draw();
}

/* ---- test table */
function buildTable(t, box){
  const rows = t.test.table;
  function draw(){
    const tried = rows.filter((r, i) => (S.table[t.id + ":" + i] || {}).tried).length;
    box.innerHTML = `<table><thead><tr><th>Type of test</th><th>What to try</th><th>What should happen</th><th>Tried it?</th><th>Did it do that?</th></tr></thead><tbody>
      ${rows.map((r, i) => { const st = S.table[t.id + ":" + i] || {}; return `<tr class="${st.ok === "no" ? "no" : st.ok === "yes" ? "yes" : ""}">
        <td><span class="ttype">${esc(r[0])}</span></td><td><code>${esc(r[1])}</code></td><td>${esc(r[2])}</td>
        <td><input type="checkbox" data-tried="${i}" aria-label="Tried test ${i + 1}" ${st.tried ? "checked" : ""}></td>
        <td><select data-ok="${i}" aria-label="Did test ${i + 1} do the right thing?"><option value="">Choose</option><option value="yes" ${st.ok === "yes" ? "selected" : ""}>Yes</option><option value="no" ${st.ok === "no" ? "selected" : ""}>No: found a bug!</option></select></td></tr>`; }).join("")}
      </tbody></table>
      <p class="tcount">${IC.flask} Tests tried: ${tried} of ${rows.length}${rows.some((r, i) => (S.table[t.id + ":" + i] || {}).ok === "no") ? ". You found a bug. Now fix it, then run the tests again." : tried === rows.length ? ". Every test tried. Now press Check my code." : "."}</p>`;
    box.querySelectorAll("[data-tried]").forEach(c => c.addEventListener("change", () => { const k = t.id + ":" + c.dataset.tried; S.table[k] = Object.assign({}, S.table[k], {tried: c.checked}); save(); draw(); }));
    box.querySelectorAll("[data-ok]").forEach(c => c.addEventListener("change", () => { const k = t.id + ":" + c.dataset.ok; S.table[k] = Object.assign({}, S.table[k], {ok: c.value, tried: true}); save(); draw(); }));
  }
  draw();
}

/* ---- quiz */
function buildQuiz(t, box){
  function draw(){
    const a = S.quiz[t.id] || {};
    const answered = Object.keys(a).length, score = quizScore(t);
    box.innerHTML = t.quiz.map((q, qi) => `<div class="qq" data-q="${qi}"><p class="qtext"><b>${qi + 1}.</b> ${esc(q.q)}</p>
        ${q.code ? codeBlock(q.code, "small") : ""}
        <div class="opts">${q.o.map((o, oi) => {
          const cls = a[qi] === undefined ? "" : oi === q.a ? "right" : oi === a[qi] ? "wrong" : "";
          return `<button class="opt ${cls}" data-o="${oi}" ${a[qi] !== undefined ? "disabled" : ""}>${esc(o)}</button>`; }).join("")}</div>
        ${a[qi] !== undefined ? `<div class="msg ${a[qi] === q.a ? "pass" : "warn"}"><strong>${a[qi] === q.a ? IC.tick + " Yes!" : "Not quite."}</strong>${esc(q.e)}</div>` : ""}
      </div>`).join("") +
      (answered === t.quiz.length ? `<div class="qscore ${score >= 3 ? "good" : ""}"><b>You scored ${score} out of ${t.quiz.length}.</b> ${score === 4 ? "Perfect!" : score === 3 ? "Great work." : "Read the explanations, then have another go."} <button class="linkbtn qagain">Try the quiz again</button></div>` : "");
    box.querySelectorAll(".qq").forEach(div => div.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      S.quiz[t.id] = Object.assign({}, S.quiz[t.id], {[div.dataset.q]: +b.dataset.o}); save(); draw();
      if (page._refresh) page._refresh();
    })));
    const ag = box.querySelector(".qagain");
    if (ag) ag.addEventListener("click", () => { S.quiz[t.id] = {}; save(); draw(); if (page._refresh) page._refresh(); });
  }
  draw();
}

/* ---------------- navigation ---------------- */
function go(where){
  if (active) active.stop && active.stop();
  location.hash = where === "home" ? "" : where;
  draw();
  window.scrollTo(0, 0);
}
function draw(){
  const h = location.hash.slice(1);
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.go === (h || "home")));
  if (TOPIC_BY[h]) renderTopic(TOPIC_BY[h]);
  else if (h === "doctor") renderDoctor();
  else renderHome();
}
window.addEventListener("hashchange", draw);
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
document.getElementById("resetall").addEventListener("click", e => {
  const b = e.currentTarget;
  if (b.dataset.confirm) { S = fresh(); save(); delete b.dataset.confirm; b.textContent = "Start again"; draw(); }
  else { b.dataset.confirm = "1"; b.textContent = "Sure? Click again"; setTimeout(() => { delete b.dataset.confirm; b.textContent = "Start again"; }, 4000); }
});
