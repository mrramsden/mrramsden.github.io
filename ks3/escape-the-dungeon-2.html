\ndef prints_in(fname):\n    node = C.func_node(fname)\n    return sum(1 for n in ast.walk(node) if isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id == \"print\") if node else 0\n\ndef has_kind(fname, kind):\n    node = C.func_node(fname)\n    return node is not None and any(isinstance(n, kind) for n in ast.walk(node))\n\ndef has_if_else(fname):\n    node = C.func_node(fname)\n    return node is not None and any(isinstance(n, ast.If) and n.orelse for n in ast.walk(node))\n\ndef has_elif(fname):\n    node = C.func_node(fname)\n    if node is None:\n        return False\n    lines = C.src.split(\"\\n\")\n    return any(isinstance(n, ast.If) and lines[n.lineno - 1].strip().startswith(\"elif\") for n in ast.walk(node))\n\ndef room_names():\n    return [f.name for f in C.funcs()]\n\ndef calls_input(fname):\n    return C.calls(\"input\", inside=fname)\n\ndef main_whiles():\n    return [n for n in C.tree().body if isinstance(n, ast.While)]\n\nC.need(\"shop\", 2)\nfor g, h, typed, want in [(15, 40, \"yes\", (5, 65)), (10, 40, \"yes\", (0, 65)), (9, 40, \"yes\", (9, 40)),\n                          (50, 40, \"no\", (50, 40)), (0, 100, \"yes\", (0, 100))]:\n    r = await C.call(\"shop\", g, h, inputs=[typed])\n    if not isinstance(r.ret, tuple) or len(r.ret) != 2:\n        fail(\"shop should return two values: `return gold, health`.\")\n    if tuple(r.ret) != want:\n        if tuple(r.ret) == want[::-1]:\n            fail(\"shop returns health first. It should be `return gold, health`, to match `gold, health = shop(gold, health)`.\")\n        tip = \" 10 gold is a boundary: they can just afford it, so use >=.\" if g == 10 else \"\"\n        fail(f\"I tested `shop({g}, {h})` and typed {typed}. It should return {want}, but returned {tuple(r.ret)}.{tip}\")\nif ns.get(\"gold\") != 5 or ns.get(\"health\") != 65:\n    fail(f\"In the main program, after buying a potion, gold should be 5 and health 65. They're {ns.get('gold')!r} and {ns.get('health')!r}. Catch them in the same order: `gold, health = shop(gold, health)`.\")\n"}, "p4a2": {"defs_only": true, "win": "A fair fight that always ends.", "py": "\ndef solid(text):\n    return [l.strip() for l in text.split(\"\\n\") if l.strip()]\n\ndef prints_in(fname):\n    node = C.func_node(fname)\n    return sum(1 for n in ast.walk(node) if isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id == \"print\") if node else 0\n\ndef has_kind(fname, kind):\n    node = C.func_node(fname)\n    return node is not None and any(isinstance(n, kind) for n in ast.walk(node))\n\ndef has_if_else(fname):\n    node = C.func_node(fname)\n    return node is not None and any(isinstance(n, ast.If) and n.orelse for n in ast.walk(node))\n\ndef has_elif(fname):\n    node = C.func_node(fname)\n    if node is None:\n        return False\n    lines = C.src.split(\"\\n\")\n    return any(isinstance(n, ast.If) and lines[n.lineno - 1].strip().startswith(\"elif\") for n in ast.walk(node))\n\ndef room_names():\n    return [f.name for f in C.funcs()]\n\ndef calls_input(fname):\n    return C.calls(\"input\", inside=fname)\n\ndef main_whiles():\n    return [n for n in C.tree().body if isinstance(n, ast.While)]\n\nC.need(\"fight_room\", 1)\nwon = lost = 0\nfor s in range(150):\n    r = await C.call(\"fight_room\", 30, seed=s)\n    if not isinstance(r.ret, int):\n        fail(\"fight_room should return the player's health.\" + (\" Add `return health`.\" if r.ret is None else \"\"))\n    if r.ret > 30:\n        fail(\"The player's health went up during the fight.\")\n    if r.ret \u003c= 0:\n        lost += 1\n    else:\n        won += 1\nif not won or not lost:\n    fail(\"I ran lots of fights starting on 30 health. The player should sometimes win and sometimes lose. Does the loop stop when either side reaches 0?\")\nfor s in range(60):\n    r = await C.call(\"fight_room\", 1, seed=s)\n    if r.ret \u003c 1 - 15:\n        fail(f\"Starting on 1 health, the player should be beaten by the goblin's first hit, but finished on {r.ret}. The fight kept going after the player reached 0. The loop needs `while health > 0 and goblin > 0:`.\")\nfor s in range(30):\n    r = await C.call(\"fight_room\", 100, seed=s)\n    if r.ret > 95:\n        fail(\"Starting on 100, the player finished on \" + str(r.ret) + \". The goblin needs at least two hits to fall, so it always hits back at least once (5 to 15).\")\n"}, "p5b2": {"inputs": ["left"], "win": "Each way leads somewhere different.", "py": "\ndef solid(text):\n    return [l.strip() for l in text.split(\"\\n\") if l.strip()]\n\ndef prints_in(fname):\n    node = C.func_node(fname)\n    return sum(1 for n in ast.walk(node) if isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id == \"print\") if node else 0\n\ndef has_kind(fname, kind):\n    node = C.func_node(fname)\n    return node is not None and any(isinstance(n, kind) for n in ast.walk(node))\n\ndef has_if_else(fname):\n    node = C.func_node(fname)\n    return node is not None and any(isinstance(n, ast.If) and n.orelse for n in ast.walk(node))\n\ndef has_elif(fname):\n    node = C.func_node(fname)\n    if node is None:\n        return False\n    lines = C.src.split(\"\\n\")\n    return any(isinstance(n, ast.If) and lines[n.lineno - 1].strip().startswith(\"elif\") for n in ast.walk(node))\n\ndef room_names():\n    return [f.name for f in C.funcs()]\n\ndef calls_input(fname):\n    return C.calls(\"input\", inside=fname)\n\ndef main_whiles():\n    return [n for n in C.tree().body if isinstance(n, ast.While)]\n\nif not has(out, \"dark cave\") or has(out, \"freezing river\"):\n    fail(\"When I typed left, it should go into the cave only. Gap 1 is `\\\"left\\\"` and gap 2 is `cave()`.\")\nfor typed, room, other in [(\"right\", \"freezing river\", \"dark cave\"), (\"LEFT\", \"dark cave\", \"freezing river\"), (\"up\", \"freezing river\", \"dark cave\")]:\n    r = await C.rerun([typed])\n    if not has(r.out, room) or has(r.out, other):\n        fail(f\"When I hould run.\")\nr = await C.rerun_vars({\"health\": 100})\nif win[0] not in r.out or lose[0] in r.out:\n    fail(\"I changed the start to 100 health. The hero survives 3 traps, so only escaped() should run.\")\nif trap_line:\n    r = await C.rerun_vars({\"health\": 30})\n    n = r.out.count(trap_line)\n    if n != 2:\n        fail(f\"I changed the start to 30 health. After 2 traps the hero is below 0, so the game should stop. Your hero went through {n} traps. The while condition needs `and health > 0`.\")\n"}, "p5a1": {"defs_only": true, "win": "Rooms that choose where you go next.", "py": "\ndef solid(text):\n    return [l.strip() for l in text.split(\"\\n\") if l.strip()]\n\ndef prints_in(fname):\n    node = C.func_node(fname)\n    return sum(1 for n in ast.walk(node) if isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id == \"print\") if node else 0\n\ndef has_kind(fname, kind):\n    node = C.func_node(fname)\n    return node is not None and any(isinstance(n, kind) for n in ast.walk(node))\n\ndef has_if_else(fname):\n    node = C.func_node(fname)\n    return node is not None and any(isinstance(n, ast.If) and n.orelse for n in ast.walk(node))\n\ndef has_elif(fname):\n    node = C.func_node(fname)\n    if node is None:\n        return False\n    lines = C.src.split(\"\\n\")\n    return any(isinstance(n, ast.If) and lines[n.lineno - 1].strip().startswith(\"elif\") for n in ast.walk(node))\n\ndef room_names():\n    return [f.name for f in C.funcs()]\n\ndef calls_input(fname):\n    return C.calls(\"input\", inside=fname)\n\ndef main_whiles():\n    return [n for n in C.tree().body if isinstance(n, ast.While)]\n\nif not C.assigned(\"location\"):\n    fail(\"Keep the variable `location` in the main program.\")\nloops = main_whiles()\nif not loops or not any(\"exit\" in ast.unparse(w.test) for w in loops):\n    fail(\"The main program should loop `while location != \\\"exit\\\":`.\")\nrooms = [f.name for f in C.funcs() if not f.args.args]\nif len(rooms) /* ---------------- indentation shading ---------------- */
// Each 4-space step gets a tinted band; leftover spaces (not a multiple of 4) show amber.
function shadeLine(line){
  const lead = line.match(/^ */)[0].length;
  const steps = Math.floor(lead / 4), extra = lead % 4;
  let html = "";
  for (let i = 0; i < steps; i++) html += `<span class="ig l${(i % 3) + 1}">    </span>`;
  if (extra) html += `<span class="ig bad">${" ".repeat(extra)}</span>`;
  return html + esc(line.slice(lead));
}
function shadeCode(code){ return code.split("\n").map(shadeLine).join("\n"); }
function codeBlock(code, cls){ return `<pre class="shaded ${cls || ""}">${shadeCode(code)}</pre>`; }

/* ---------------- live indentation checker ---------------- */
// Returns {line: message} for lines whose indentation looks wrong. Mirrors what Python will complain about.
function lintIndent(code){
  const lines = code.split("\n"), out = {};
  const stack = [0];
  let prevColon = false, depth = 0;
  lines.forEach((raw, i) => {
    const n = i + 1, line = raw.replace(/\t/g, "    ");
    const body = line.trim();
    if (!body || body.startsWith("#")) return;
    if (depth > 0) { depth += bracketDelta(body); return; }   // continuation of an open bracket
    const ind = line.length - line.trimStart().length;
    const top = stack[stack.length - 1];
    if (ind % 4) out[n] = `Line ${n} has ${ind} space${ind === 1 ? "" : "s"} at the start. Indents come in steps of 4: use Tab and Shift+Tab.`;
    else if (prevColon && ind <= top) out[n] = `Line ${n} comes straight after a line ending in a colon, so it should be indented one more step. Press Tab at the start of it.`;
    else if (!prevColon && ind > top) out[n] = `Line ${n} is indented, but the line above doesn't end with a colon. Line it up with the line above, or add the missing colon.`;
    else if (prevColon && ind > top + 4) out[n] = `Line ${n} is indented two steps. One step (4 spaces) is enough.`;
    else if (!prevColon && ind < top && !stack.includes(ind)) out[n] = `Line ${n} doesn't line up with any line above it. Press Shift+Tab or Tab until it lines up exactly.`;
    else if (/^(elif|else)\b/.test(body) && !stack.slice(0, -1).includes(ind) && !prevColon) out[n] = `Line ${n}: ${body.split(/[\s:]/)[0]} must line up exactly with its if.`;
    if (prevColon && ind > top) stack.push(ind);
    else while (stack.length > 1 && stack[stack.length - 1] > ind) stack.pop();
    const code_ = body.replace(/#.*$/, "").replace(/("[^"]*"|'[^']*')/g, "\"\"").trimEnd();
    prevColon = code_.endsWith(":");
    depth = Math.max(0, bracketDelta(code_));
  });
  return out;
}
function bracketDelta(s){
  s = s.replace(/("[^"]*"|'[^']*')/g, "");
  return (s.match(/[([{]/g) || []).length - (s.match(/[)\]}]/g) || []).length;
}

let pyPromise = null;

function loadPython(){
  if (pyPromise) return pyPromise;
  pyPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = PYODIDE_URL;
    s.onload = resolve;
    s.onerror = () => reject(new Error("Could not download Python"));
    document.head.appendChild(s);
  }).then(() => loadPyodide()).then(async py => {
    py.registerJsModule("rt_js", { get_input: () => active ? active.askInput() : Promise.reject(new Error("RT_STOPPED")) });
    const write = buf => { if (active) active.write(decoder.decode(buf, {stream: true})); return buf.length; };
    py.setStdout({ write });
    py.setStderr({ write });
    py.FS.writeFile("/home/pyodide/runtime.py", RUNTIME_PY);
    await py.runPythonAsync("import runtime");
    return py;
  });
  pyPromise.catch(() => { pyPromise = null; });
  return pyPromise;
}

    const n = ta.value.split("\n").length;
    const lint = lintIndent(ta.value);
    gut.innerHTML = Array.from({length: n}, (_, i) => `<div class="${marks[i+1] || (lint[i+1] ? "lintmark" : "")}" ${lint[i+1] ? `title="${esc(lint[i+1])}"` : ""}>${i+1}</div>`).join("");
    ta.style.height = (Math.max(n, 4) * 22 + 20 + (ta.scrollWidth > ta.clientWidth ? 16 : 0)) + "px";
    guides.innerHTML = shadeCode(ta.value) + "\n";
    guides.scrollLeft = ta.scrollLeft;
    const first = Object.keys(lint)[0];
    lintBox.hidden = !first;
    if (first) lintBox.innerHTML = `${IC.bulb} <span><b>Indentation check:</b> ${esc(lint[first])}${Object.keys(lint).length > 1 ? ` (and ${Object.keys(lint).length - 1} more amber line${Object.keys(lint).length > 2 ? "s" : ""})` : ""}</span>`;
  }
  ta.addEventListener("scroll", () => { guides.scrollLeft = ta.scrollLeft; });
  ta.addEventListener("paste", e => {
    const text = (e.clipboardData || window.clipboardData).getData("text");
    if (/\t|[\u201c\u201d\u2018\u2019]/.test(text)) {
      e.preventDefault();
      insert(text.replace(/\t/g, "    ").replace(/[\u201c\u201d]/g, '"').replace(/[\u2018\u2019]/g, "'"));
    }
  });
  function setMarks(m){ marks = m; layout(); }
  function persist(){ S.code[id] = ta.value; save(); }
  ta.addEventListener("input", () => { setMarks({}); persist(); });
  layout();

  // ---- editor keys: tab indent, smart enter, smart backspace, ctrl+enter runs
  function insert(text){
    ta.focus();
    if (!document.execCommand("insertText", false, text)) ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, "end");
  }
  ta.addEventListener("keydown", e => {
    const v = ta.value, a = ta.selectionStart, b = ta.selectionEnd;
    const lineStart = v.lastIndexOf("\n", a - 1) + 1;
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); return; }
    if (e.key === "Tab") {
      e.preventDefault();
      if (a === b && !e.shiftKey) { insert("    "); return; }
      const endLine = v.indexOf("\n", b - (b > a && v[b-1] === "\n" ? 1 : 0)); const stop = endLine === -1 ? v.length : endLine;
      const block = v.slice(lineStart, stop);
      const changed = e.shiftKey ? block.split("\n").map(l => l.replace(/^ {1,4}/, "")).join("\n") : block.split("\n").map(l => "    " + l).join("\n");
      ta.setSelectionRange(lineStart, stop); insert(changed);
      ta.setSelectionRange(lineStart, lineStart + changed.length); return;
    }
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      const before = v.slice(lineStart, a);
      let indent = before.match(/^ */)[0];
      if (/:\s*$/.test(before)) indent += "    ";
      insert("\n" + indent); return;
    }
    if (e.key === "Backspace" && a === b && a > lineStart) {
      const before = v.slice(lineStart, a);
      if (/^ +$/.test(before) && before.length % 4 === 0) {
        e.preventDefault(); ta.setSelectionRange(a - 4, a); document.execCommand("delete") || ta.setRangeText("", a - 4, a, "end"); return;
      }
    }
  });

  // ---- console
  let segs = [], pending = null, inputRow = null, renderQueued = false;
  function render(){
    renderQueued = false;
    let html = segs.map(s => s.t === "in" ? `<span class="typed">${esc(s.s)}</span>` : s.t === "note" ? `<span class="muted">${esc(s.s)}</span>` : esc(s.s)).join("");
    out.innerHTML = html;
    con.scrollTop = con.scrollHeight;
  }
  function queue(){ if (!renderQueued) { renderQueued = true; requestAnimationFrame(render); } }
  let outLen = 0;
  const api = {
    write(text){
      if (outLen > 60000) return;
      outLen += text.length;
      const last = segs[segs.length - 1];
      if (last && last.t === "out") last.s += text; else segs.push({t: "out", s: text});
      if (outLen > 60000) segs.push({t: "note", s: "\n(Lots of output. The rest is hidden.)\n"});
      queue();
    },
    askInput(){
      render();
      return new Promise((resolve, reject) => {
        pending = {resolve, reject};
        inputRow = el(`<div class="inrow"><label>&gt;</label><input type="text" aria-label="Type your answer and press Enter" autocomplete="off" spellcheck="false"><small>press Enter</small></div>`);
        con.appendChild(inputRow);
        const box = inputRow.querySelector("input");
        box.addEventListener("keydown", ev => {
          if (ev.key !== "Enter") return;
          ev.preventDefault();
          const val = box.value;
          inputRow.remove(); inputRow = null;
          segs.push({t: "in", s: val}); segs.push({t: "out", s: "\n"}); render();
          const p = pending; pending = null; p.resolve(val);
        });
        box.focus({preventScroll: true});
        con.scrollTop = con.scrollHeight;
      });
    },
    stop(){
      if (pending) { if (inputRow) { inputRow.remove(); inputRow = null; } const p = pending; pending = null; p.reject(new Error("RT_STOPPED")); }
    }
  };
  function clearMsgs(){ wrap.querySelectorAll(".msg").forEach(m => m.remove()); }
  function showMsg(cls, html){ const m = el(`<div class="msg ${cls}">${html}</div>`); con.appendChild(m); con.scrollTop = con.scrollHeight; }

  function ready(code){
    if (code.includes("___")) {
      const m = {}; code.split("\n").forEach((l, i) => { if (l.includes("___")) m[i+1] = "gap"; });
      setMarks(m);
      showMsg("warn", "<strong>Fill in the gaps first.</strong>Replace every <code>___</code> with your answer. The gaps are on the highlighted lines.");
      return false;
    }
    setMarks({});
    if (!code.trim()) { showMsg("warn", "<strong>There's no code yet.</strong>Type your program in the box above, then press Run."); return false; }
    return true;
  }
  const bCheck = wrap.querySelector(".check"), cov = wrap.querySelector(".cov");

  // ---- paths tried (if / elif / else) for the adventure box
  function showPaths(res){
    if (!cov || !res.paths) return;
    const keys = new Set(res.paths.map(p => p.key));
    const tried = new Set((S.cover[id] || []).filter(k => keys.has(k)).concat(res.hits || []));
    S.cover[id] = [...tried]; save();
    const n = res.paths.length;
    if (!n) { cov.hidden = true; return; }
    const todo = res.paths.filter(p => !tried.has(p.key)), done = n - todo.length;
    const m = {}; todo.forEach(p => { if (!marks[p.line]) m[p.line] = "todo"; });
    setMarks(Object.assign({}, marks, m));
    cov.hidden = false;
    cov.innerHTML = `<div class="covtop"><strong>Paths tested: ${done} of ${n}</strong><span class="bar"><i style="width:${Math.round(done / n * 100)}%"></i></span><button class="covreset">Start counting again</button></div>` +
      (todo.length ? `<p style="margin:6px 0 0">Every <code>if</code>, <code>elif</code> and <code>else</code> is a path through your game. Play again and try to reach ${todo.length === 1 ? "this one" : "these"} (highlighted in the line numbers):</p><ul>${todo.slice(0, 6).map(p => `<li>Line ${p.line}: <code>${esc(p.label)}</code></li>`).join("")}${todo.length > 6 ? `<li>and ${todo.length - 6} more</li>` : ""}</ul>`
                   : `<p style="margin:6px 0 0">${IC.tick} You've tried every path in your game. That's proper testing!</p>`);
    cov.querySelector(".covreset").addEventListener("click", () => { S.cover[id] = []; save(); cov.hidden = true; setMarks({}); });
  }

  // ---- Check my code
  async function check(){
    if (active && active !== api) { active.stop(); await active.finished; }
    if (active === api) return;
    clearMsgs(); segs = []; outLen = 0; render();
    const code = ta.value;
    if (!ready(code)) return;
    active = api; let finish; api.finished = new Promise(r => finish = r);
    bRun.disabled = true; bCheck.disabled = true;
    try {
      segs = [{t: "note", s: (window.loadPyodide && pyPromise ? "" : "Loading Python... ") + "Checking your code. I'll run it with my own test answers...\n"}]; render();
      let py;
      try { py = await loadPython(); }
      catch (e) { segs = []; render(); showMsg("error", "<strong>Python couldn't load.</strong>You might be offline, or the site that provides Python is blocked. Ask your teacher to check your work instead."); return; }
      await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
      py.globals.set("_rt_src", code);
      py.globals.set("_rt_spec", JSON.stringify(opts.check));
      const res = JSON.parse(await py.runPythonAsync("await runtime.check(_rt_src, _rt_spec)"));
      segs = [{t: "note", s: "Check finished. Press Run to play your program yourself.\n"}]; render();
      if (res.type === "pass") {
        S.checked[id] = true; save();
        showMsg("pass", `<strong>${IC.tick} Check passed!</strong>${esc(opts.check.win || "This task is done.")}`);
        if (opts.onPass) opts.onPass();
      } else {
        if (res.line) setMarks({[res.line]: "err"});
        showMsg("warn", `<strong>Not quite yet.</strong>${fmt(res.msg)}`);
      }
    } catch (e) {
      showMsg("error", "<strong>Something went wrong checking your code.</strong>" + esc(e && e.message ? e.message.split("\n").slice(-2).join(" ") : e));
    } finally {
      if (active === api) active = null;
      bRun.disabled = false; bCheck.disabled = false; finish();
    }
  }
  if (bCheck) bCheck.addEventListener("click", check);

  async function run(){
    if (active && active !== api) { active.stop(); await active.finished; }
    if (active === api) return;
    clearMsgs(); segs = []; outLen = 0; render();
    const code = ta.value;
    if (!ready(code)) return;
    active = api; let finish; api.finished = new Promise(r => finish = r);
    bRun.disabled = true; bStop.disabled = false; if (bCheck) bCheck.disabled = true;
    try {
      let py;
      if (!window.loadPyodide || !pyPromise) { segs = [{t: "note", s: "Loading Python... the first run takes a few seconds.\n"}]; render(); }
      try { py = await loadPython(); }
      catch (e) {
        segs = []; render();
        showMsg("error", "<strong>Python couldn't load.</strong>You might be offline, or the site that provides Python is blocked. Press <b>Copy</b> and paste your code into IDLE or Thonny instead.");
        return;
      }
      if (segs.length === 1 && segs[0].t === "note") { segs = []; render(); }
      py.globals.set("_rt_src", code);
      py.globals.set("_rt_cover", !!opts.cover);
      const res = JSON.parse(await py.runPythonAsync("await runtime.run(_rt_src, _rt_cover)"));
      render();
      if (res.type === "ok") showMsg("ok", segs.length ? "Program finished." : "Program finished. (It didn't print anything.)");
      else if (res.type === "stopped") showMsg("warn", "<strong>Program stopped.</strong>");
      else if (res.type === "loop") showMsg("warn", `<strong>${esc(res.error)}</strong>${esc(res.hint)}${refLink(res)}`);
      else {
        if (res.line) setMarks({[res.line]: "err"});
        showMsg("error", `<strong>${res.line ? "Problem on line " + res.line : "Problem"}</strong><code>${esc(res.error)}</code>${res.hint ? "<br>" + esc(res.hint) : ""}${refLink(res)}`);
      }
      showPaths(res);
    } catch (e) {
      showMsg("error", "<strong>Something went wrong running your code.</strong>" + esc(e && e.message ? e.message.split("\n").slice(-2).join(" ") : e));
    } finally {
      if (active === api) active = null;
      bRun.disabled = false; bStop.disabled = true; if (bCheck) bCheck.disabled = false; finish();
    }
  }
  bRun.addEventListener("click", run);
  bStop.addEventListener("click", () => api.stop());
  bReset.addEventListener("click", () => {
    if (bReset.dataset.confirm) {
      delete bReset.dataset.confirm; bReset.innerHTML = IC.reset + " Reset";
      ta.value = starter; delete S.code[id]; save(); setMarks({}); clearMsgs(); segs = []; render();
    } else {
      bReset.dataset.confirm = "1"; bReset.innerHTML = IC.reset + " Sure? Click again";
      setTimeout(() => { if (bReset.dataset.confirm) { delete bReset.dataset.confirm; bReset.innerHTML = IC.reset + " Reset"; } }, 4000);
    }
  });
  bCopy.addEventListener("click", async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) {
      ta.select(); try { ok = document.execCommand("copy"); } catch (e2) {}
    }
    bCopy.innerHTML = IC.copy + (ok ? " Copied" : " Press Ctrl+C");
    setTimeout(() => bCopy.innerHTML = IC.copy + " Copy", 1800);
  });
  const bDl = wrap.querySelector(".dl");
  if (bDl) bDl.addEventListener("click", () => {
    const name = ((S.plan && S.plan.title) || "my_adventure").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || "my_adventure";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([ta.value], {type: "text/x-python"}));
    a.download = name + ".py"; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });
  api.finished = Promise.resolve();
  wrap._stop = () => api.stop();
  return wrap;
}

}

function partHtml(p, n){
  const isExtra = p.kind === "ext" || p.kind === "stretch";
  const label = p.kind === "ext" ? "Extension" : p.kind === "stretch" ? "Stretch" : p.kind === "step" ? "Step " + n : p.kind === "plan" ? "Plan" : "Task " + n;
  const steps = p.steps ? `<ul class="steps">${p.steps.map((s, i) => `<li><label><input type="checkbox" data-tick="${p.id}:${i}" ${S.ticks[p.id + ":" + i] ? "checked" : ""}><span>${s}</span></label></li>`).join("")}</ul>` : "";
  const hints = p.hints && p.hints.length ? `<div class="hints" data-hints="${p.id}"></div>` : "";
  const locked = isExtra && !S.unlocked[p.id];
  return `<article class="card part kind-${p.kind}${locked ? " locked" : ""}" data-part="${p.id}">
    <h3><span class="tasknum">${label}</span>${esc(cap(p.title.replace(/^(Extension|Stretch): /, "")))}${S.checked[p.id] ? `<span class="passed">${IC.tick} Checked</span>` : ""}</h3>

    <div class="pbody">${p.html}${steps}${p.kind === "plan" ? planHtml(p.rooms) : ""}<div class="rslot"></div>${hints}</div>

}

  <div class="lv-${lv}"><div class="lvhead"><span class="lvpill">${LEVELS[lv]} route</span><p>${esc(L.intro)}</p></div>${parts}</div>${gameCard}
  <div class="card endcard"><div class="grow">
    ${isDone ? `<p class="done-msg">Stage complete on the ${LEVELS[lv]} route. Well done!</p>${up ? `<p>Feeling confident? Try this stage on the ${LEVELS[up]} route.</p>` : `<p>Head to the next stage when you're ready.</p>`}`
             : `<p><strong>Finished everything you can on this stage?</strong></p><p>Mark it complete, then move on.</p>`}${checkLine}</div>
    ${isDone ? (up ? `<button class="btn ghost" id="levelup">${IC.stairs} Level up to ${LEVELS[up]}</button>` : "") : `<button class="btn primary" id="markdone">I've finished this stage</button>`}
    ${isDone ? `<button class="btn primary" id="nextstage">Next stage &rarr;</button>` : ""}
  </div>`;
  page.querySelector("#learnslot").appendChild(makeRunner(st.id + "-learn", st.learnCode, "Example"));
  wirePredict(st);
  if (st.game) page.querySelector("#gameslot").appendChild(makeRunner("mygame", GAME_STARTER, "My adventure", true, {cover: true}));
  page.querySelectorAll("[data-plan]").forEach(inp => inp.addEventListener("input", () => {
    const [k, i] = inp.dataset.plan.split(":");
    if (i === undefined) S.plan[k] = inp.value; else { S.plan.rooms[+i] = S.plan.rooms[+i] || {}; S.plan.rooms[+i][k] = inp.value; }
    save();
  }));
  L.parts.forEach(p => {
    const art = page.querySelector(`[data-part="${p.id}"]`);
    if (p.starter !== undefined && p.kind !== "step") art.querySelector(".rslot").appendChild(makeRunner(p.id, p.starter, "Your code", false, {
      check: CHECKS[p.id],
      onPass: () => {
        const h = art.querySelector("h3");
        if (!h.querySelector(".passed")) h.insertAdjacentHTML("beforeend", `<span class="passed">${IC.tick} Checked</span>`);
        const cc = page.querySelector(".checkcount");
        if (cc) { const n = checkable.filter(q => S.checked[q.id]).length; cc.innerHTML = `${IC.check} Tasks checked on this route: ${n} of ${checkable.length}`; }
      }}));
    const hb = art.querySelector(".hints"); if (hb) renderHints(hb, p);
    const ub = art.querySelector("[data-unlock]");
    if (ub) ub.addEventListener("click", () => { S.unlocked[p.id] = true; save(); art.classList.remove("locked"); ub.parentElement.hidden = true; });
  });
  page.querySelectorAll("[data-tick]").forEach(c => c.addEventListener("change", () => { S.ticks[c.dataset.tick] = c.checked; save(); }));
  const md = page.querySelector("#markdone"); if (md) md.addEventListener("click", () => { S.done[doneKey] = true; save(); renderDots(); renderStage(st); page.querySelector(".endcard").scrollIntoView({block: "center"}); });
  const lu = page.querySelector("#levelup"); if (lu) lu.addEventListener("click", () => { setLevel(up); window.scrollTo(0, 0); });
  const ns = page.querySelector("#nextstage"); if (ns) ns.addEventListener("click", () => go(S.page + 1));
}

function renderFinish(){
  const rows = STAGES.map(st => `<tr><td>Stage ${st.num}: ${esc(st.title)}</td>${["B", "I", "A"].map(l => `<td class="c">${S.done[st.id + ":" + l] ? '<span class="tick">&#10003;</span>' : ""}</td>`).join("")}</tr>`).join("");
  page.innerHTML = `
  <section class="hero">${IC.door}<div><h1>Game complete?</h1>
    <p>You've designed and built your own adventure, split into subroutines. Download it from the box below so you have a copy, and hand it in if you've been asked to.</p></div></section>
  <div class="card"><h2 class="sec">${IC.key} Your progress</h2>
    <table class="prog"><thead><tr><th>Stage</th><th class="c">Beginner</th><th class="c">Intermediate</th><th class="c">Advanced</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="card"><h2 class="sec">${IC.bulb} Check yourself</h2>
    <ul class="steps">${[
      "I can explain the difference between defining a subroutine and calling it",
      "I can explain what a parameter is",
      "I can explain what return does, and why the value must be caught in a variable",
      "I can explain the difference between a procedure and a function",
      "I can explain why a variable made inside a subroutine can't be used outside it"].map((s, i) => `<li><label><input type="checkbox" data-tick="final:${i}" ${S.ticks["final:" + i] ? "checked" : ""}><span>${s}</span></label></li>`).join("")}</ul></div>
  <div class="card"><h2 class="sec">${IC.code} My adventure</h2><div id="gameslot"></div></div>
  <div class="card"><h2 class="sec">${IC.reset} Start again</h2><p>This clears your code, plan, ticks and progress on this computer. Any progress file you saved stays in your Downloads folder.</p><button class="btn ghost" id="wipe">Reset my progress</button></div>`;
  page.querySelectorAll("[data-tick]").forEach(c => c.addEventListener("change", () => { S.ticks[c.dataset.tick] = c.checked; save(); }));
  page.querySelector("#gameslot").appendChild(makeRunner("mygame", GAME_STARTER, "My adventure", true, {cover: true}));
  const w = page.querySelector("#wipe");
  w.addEventListener("click", () => {
    if (!w.dataset.confirm) { w.dataset.confirm = "1"; w.textContent = "Are you sure? Click again to reset"; return; }
    S = fresh(); save(); setDirty(false); go(0);
  });
}

/* ---------------- navigation ---------------- */
function renderDots(){
  const d = document.getElementById("dots");
  d.innerHTML = PAGES.map((p, i) => {
    let cls = "dot", label, txt;
    if (p === "welcome") { label = "Welcome"; txt = "&#9733;"; }
    else if (p === "finish") { label = "Finish"; txt = "&#10003;"; }
    else { const st = STAGES[i - 1]; label = `Stage ${st.num}: ${st.title}`; txt = st.num;
      const best = ["A", "I", "B"].find(l => S.done[st.id + ":" + l]); if (best) cls += " done-" + best; }
    if (i === S.page) cls += " current";
    return `<button class="${cls}" data-go="${i}" title="${esc(label)}" aria-label="${esc(label)}">${txt}</button>`;
  }).join("");
  d.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(+b.dataset.go)));
}
function setLevel(lv){
  S.level = lv; save();
  document.querySelectorAll(".lvswitch button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lv === lv)));
  draw();
}
function draw(){
  if (active) active.stop();
  const p = PAGES[S.page];
  if (p === "welcome") renderWelcome(); else if (p === "finish") renderFinish(); else renderStage(STAGES.find(s => s.id === p));
  renderDots();
  refStage();
  document.getElementById("prev").disabled = S.page === 0;
  document.getElementById("next").disabled = S.page === PAGES.length - 1;
  document.getElementById("where").textContent = p === "welcome" ? "Welcome" : p === "finish" ? "Finish" : `Stage ${S.page} of ${STAGES.length}  |  ${LEVELS[level()]} route`;
}
function go(i){ S.page = Math.max(0, Math.min(PAGES.length - 1, i)); save(); draw(); window.scrollTo(0, 0); }
document.getElementById("prev").addEventListener("click", () => go(S.page - 1));
document.getElementById("next").addEventListener("click", () => go(S.page + 1));
document.querySelectorAll(".lvswitch button").forEach(b => {
  b.setAttribute("aria-pressed", String(b.dataset.lv === S.level));
  b.addEventListener("click", () => setLevel(b.dataset.lv));
});
document.getElementById("savefile").addEventListener("click", saveToFile);
const loadInput = document.getElementById("loadinput");
document.getElementById("loadfile").addEventListener("click", () => { loadInput.value = ""; loadInput.click(); });
loadInput.addEventListener("change", () => { if (loadInput.files[0]) loadFromFile(loadInput.files[0]); });
if (S.page >= PAGES.length) S.page = 0;

g.\u003c/p>\u003cul>\u003cli>A comma in print (easiest).\u003c/li>\u003cli>\u003ccode>str()\u003c/code> turns a number into text so you can use \u003ccode>+\u003c/code>.\u003c/li>\u003cli>An \u003cstrong>f-string\u003c/strong>: put \u003ccode>f\u003c/code> before the quote and the variable in curly brackets.\u003c/li>\u003c/ul>", "example": "gold = 12\nprint(\"Gold:\", gold)\nprint(\"Gold: \" + str(gold))\nprint(f\"Gold: {gold}\")", "watch": "Writing \u003ccode>\"Gold: \" + gold\u003c/code> causes a TypeError, because gold is a number."}, {"id": "tidy", "part": 1, "cat": "Output and text", "title": ".lower()  .strip()  .title()", "short": "tidy up what the player typed", "keys": ["lower", ".lower()", "strip", ".strip()", "title", ".title()", "upper", "capital", "capitals", "case", "spaces"], "syntax": "answer = input(\"Yes or no? \").strip().lower()", "html": "\u003cp>Players type \u003ccode>YES\u003c/code>, \u003ccode>Yes\u003c/code> or \u003ccode> yes \u003c/code> with spaces. Tidy the answer before you check it.\u003c/p>\u003cul>\u003cli>\u003ccode>.lower()\u003c/code> makes it all lower case.\u003c/li>\u003cli>\u003ccode>.strip()\u003c/code> removes spaces at the start and end.\u003c/li>\u003cli>\u003ccode>.title()\u003c/code> gives every word a capital letter.\u003c/li>\u003c/ul>", "example": "answer = input(\"Do you open the door? \").strip().lower()\nif answer == \"yes\":\n    print(\"It creaks open.\")\nelse:\n    print(\"You leave it shut.\")", "watch": "After \u003ccode>.lower()\u003c/code>, compare with lower case: \u003ccode>\"yes\"\u003c/code>, not \u003ccode>\"Yes\"\u003c/code>."}, {"id": "comments", "part": 1, "cat": "Output and text", "title": "# Comments", "short": "notes that Python ignores", "keys": ["#", "comment", "comments", "note"], "syntax": "# This is a comment", "html": "\u003cp>Anything after a \u003ccode>#\u003c/code> is a note for people. Python ignores it. Use comments to plan your code and to explain the tricky bits.\u003c/p>", "exampl     print(\"You feel strong.\")\nelif health > 0:\n    print(\"You are wounded.\")\nelse:\n    print(\"Game over.\")", "watch": "Every \u003ccode>if\u003c/code>, \u003ccode>elif\u003c/code> and \u003ccode>else\u003c/code> line ends with a colon, and the code underneath is indented."}, {"id": "compare", "part": 1, "cat": "Decisions", "title": "Comparisons", "short": "==  !=  \u003c  >  \u003c=  >=", "keys": ["==", "!=", "\u003c", ">", "\u003c=", ">=", "compare", "comparison", "equal", "equals", "not equal", "greater", "less"], "syntax": "==  equal to          !=  not equal to\n\u003c   less than         >   greater than\n\u003c=  less or equal     >=  greater or equal", "html": "\u003cp>A comparison is either True or False. Use them in \u003ccode>if\u003c/code> and \u003ccode>while\u003c/code>.\u003c/p>", "example": "gold = 10\nprint(gold == 10)\nprint(gold != 10)\nprint(gold > 5)\nprint(gold \u003c= 9)", "watch": "Text must match exactly: \u003ccode>\"Yes\" == \"yes\"\u003c/code> is False. Use \u003ccode>.lower()\u003c/code> first."}, {"id": "andor", "part": 1, "cat": "Decisions", "title": "and  or  not", "short": "join conditions together", "keys": ["and", "or", "not", "both", "either"], "syntax": "if gold >= 10 and health \u003c 50:\nif answer == \"yes\" or answer == \"y\":", "html": "\u003cul>\u003cli>\u003ccode>and\u003c/code>: True only if \u003cstrong>both\u003c/strong> sides are True.\u003c/li>\u003cli>\u003ccode>or\u003c/code>: True if \u003cstrong>either\u003c/strong> side is True.\u003c/li>\u003cli>\u003ccode>not\u003c/code>: flips True and False.\u003c/li>\u003c/ul>", "example": "answer = \"y\"\nif answer == \"yes\" or answer == \"y\":\n    print(\"You light the torch.\")\ngold = 15\nhealth = 30\nif gold >= 10 and health \u003c 50:\n    print(\"Buy a potion!\")", "watch": "Each side needs a full comparison: \u003ccode>answer == \"yes\" or \"y\"\u003c/code> is always True. Write \u003ccode>answer == \"yes\" or answer == \"y\"\u003c/code>."}, {"id": "indent", "part": 1, "cat": "Decisions", "title": "Colons and indentation", "short": "the : and the 4 spaces", "keys": [":", "colon", "indent", "indentation", "spaces", "tab", "block"], "syntax": "if gold > 5:\n    print(\"inside the if\")\nprint(\"after the if\")", "html": "\u003cp>Lines that start a block end with a colon: \u003ccode>if\u003c/code>, \u003ccode>elif\u003c/code>, \u003ccode>else\u003c/code>, \u003ccode>while\u003c/code>, \u003ccode>for\u003c/code> and \u003ccode>def\u003c/code>. The lines that belong to it are indented by 4 spaces (press Tab). The first line that isn't indented is outside the block.\u003c/p>", "example": "gold = 8\nif gold > 5:\n    print(\"You can buy a torch.\")\n    print(\"This line is inside the if too.\")\nprint(\"This line always runs.\")", "watch": "An IndentationError means the spaces don't line up. A missing colon causes a SyntaxError."}, {"id": "while", "part": 1, "cat": "Loops", "title": "while loop", "short": "repeat while something is True", "keys": ["while", "loop", "repeat", "iteration", "until", "infinite"], "syntax": "while password != \"open\":\n    password = input(\"Password: \")", "html": "\u003cp>Repeats the indented code for as long as the condition is True. Use it when you don't know how many times you'll need to repeat, like until the player gets an answer right.\u003c/p>", "example": "password = input(\"Password: \")\nwhile password != \"open\":\n    print(\"Wrong!\")\n    password = input(\"Password: \")\nprint(\"The door opens.\")", "watch": "Something inside the loop must change, or the condition stays True forever. That's an infinite loop. This page will stop it for you."}, {"id": "for", "part": 1, "cat": "Loops", "title": "for loop and range()", "short": "repeat a set number of times", "keys": ["for", "range", "range()", "loop", "repeat", "count", "times"], "syntax": "for i in range(5):        # 0, 1, 2, 3, 4\nfor i in range(1, 6):     # 1, 2, 3, 4, 5\nfor i in range(10, 0, -1):  # 10 down to 1", "html": "\u003cp>Repeats a set number of times. \u003ccode>range\u003c/code> gives the numbers to count through. It \u003cstrong>stops before\u003c/strong> the second number. A for loop can also go through each letter of a string.\u003c/p>", "example": "for torch in range(1, 4):\n    print(\"Torch\", torch, \"is lit.\")\nfor letter in \"DOOR\":\n    print(letter)", "watch": "\u003ccode>range(1, 5)\u003c/code> gives 1 to 4, not 1 to 5."}, {"id": "random", "part": 1, "cat": "Numbers", "title": "random", "short": "dice rolls and random picks", "keys": ["random", "import", "randint", "random.randint", "choice", "random.choice", "dice", "luck", "seed"], "syntax": "import random\nroll = random.randint(1, 6)\nbeast = random.choice([\"rat\", \"bat\"])", "html": "\u003cp>Put \u003ccode>import random\u003c/code> once, on the very first line.\u003c/p>\u003cul>\u003cli>\u003ccode>random.randint(1, 6)\u003c/code> gives a whole number from 1 to 6. Unlike range, it \u003cstrong>includes\u003c/strong> both numbers.\u003c/li>\u003cli>\u003ccode>random.choice(list)\u003c/code> picks one item from a list.\u003c/li>\u003c/ul>\u003cp>Run random code several times when you test it.\u003c/p>", "example": "import random\nroll = random.randint(1, 6)\nprint(\"You rolled\", roll)\nbeast = random.choice([\"rat\", \"bat\", \"spider\"])\nprint(\"A\", beast, \"appears!\")", "watch": "Forgetting \u003ccode>import random\u003c/code> causes a NameError. Pick a new random number inside a loop, not once before it."}, {"id": "def", "part": 2, "cat": "Subroutines", "title": "def and calling", "short": "make a subroutine, then run it", "keys": ["def", "subroutine", "procedure", "call", "calling", "()", "define"], "syntax": "def entrance():\n    print(\"You stand at the entrance.\")\n\nentrance()", "html": "\u003cp>\u003ccode>def\u003c/code> creates a subroutine: a named block of code that does one job. Defining it does \u003cstrong>not\u003c/strong> run it. It runs when you \u003cstrong>call\u003c/strong> it: its name with brackets.\u003c/p>\u003cp>A subroutine that just does a job is called a \u003cstrong>procedure\u003c/strong>.\u003c/p>", "example": "def entrance():\n    print(\"You stand at the dungeon entrance.\")\n    print(\"Cold air drifts out.\")\n\nentrance()\nentrance()", "watch": "A call without brackets, \u003ccode>entrance\u003c/code>, does nothing. Names can't have spaces."}, {"id": "main", "part": 2, "cat": "Subroutines", "title": "The main program", "short": "defs at the top, calls at the bottom", "keys": ["main", "main program", "order", "sequence", "structure"], "syntax": "def hall():\n    ...\n\ndef cellar():\n    ...\n\n# main program\nhall()\ncellar()", "html": "\u003cp>Put all your \u003ccode>def\u003c/code> blocks at the top. Underneath, the \u003cstrong>main program\u003c/strong> calls them in order. When a subroutine is called, Python jumps into it, runs it, then comes back to the next line.\u003c/p>", "example": "def hall():\n    print(\"A long hall.\")\n\ndef cellar():\n    print(\"A damp cellar.\")\n\n# main program\nprint(\"Start\")\nhall()\ncellar()\nprint(\"End\")", "watch": "Don't indent the main program, or it ends up inside the last def and never runs. Call a subroutine below its def, not above it."}, {"id": "params", "part": 2, "cat": "Subroutines", "title": "Parameters", "short": "pass values into a subroutine", "keys": ["parameter", "parameters", "argument", "arguments", "pass", "passing", "brackets"], "syntax": "def show_status(health, gold):\n    print(health, gold)\n\nshow_status(100, 25)", "html": "\u003cp>A \u003cstrong>parameter\u003c/strong> is a name in the brackets of a def. It receives a value when the subroutine is called. The value you pass in is called an \u003cstrong>argument\u003c/strong>.\u003c/p>\u003cp>Several parameters are separated by commas. The values go in \u003cstrong>in order\u003c/strong>: first to first, second to second.\u003c/p>", "example": "def show_status(health, gold):\n    print(\"Health:\", health)\n    print(\"Gold:\", gold)\n\nshow_status(100, 25)\nshow_status(60, 40)", "watch": "The call needs the same number of values as the def has parameters, in the same order."}, {"id": "return", "part": 2, "cat": "Subroutines", "title": "return and functions", "short": "send a value back out", "keys": ["return", "function", "functions", "send back", "catch", "one in one out"], "syntax": "def trap_room(health):\n    health = health - 20\n    return health\n\nhealth = trap_room(health)", "html": "\u003cp>\u003ccode>return\u003c/code> sends a value back out of a subroutine. A subroutine that returns a value is called a \u003cstrong>function\u003c/strong>.\u003c/p>\u003cp>You must \u003cstrong>catch\u003c/strong> the value in a variable: \u003ccode>health = trap_room(health)\u003c/code>. Our rule: \u003cstrong>one in, one out\u003c/strong>.\u003c/p>", "example": "def trap_room(health):\n    print(\"Spikes!\")\n    health = health - 20\n    return health\n\nhealth = 100\nhealth = trap_room(health)\nprint(\"Health:\", health)", "watch": "Without \u003ccode>health =\u003c/code> the value comes back and is thrown away. Code after \u003ccode>return\u003c/code> never runs."}, {"id": "two", "part": 2, "cat": "Subroutines", "title": "Returning two values", "short": "gold, health = shop(gold, health)", "keys": ["two values", "multiple", "tuple", "return two", "two out"], "syntax": "def shop(gold, health):\n    ...\n    return gold, health\n\ngold, health = shop(gold, health)", "html": "\u003cp>A function can send back more than one value, separated by commas. Catch them in the \u003cstrong>same order\u003c/strong> you returned them.\u003c/p>", "example": "def shop(gold, health):\n    gold = gold - 10\n    health = health + 25\n    return gold, health\n\ngold = 30\nhealth = 50\ngold, health = shop(gold, health)\nprint(\"Gold:\", gold, \"Health:\", health)", "watch": "Catch them in the wrong order and Python won't complain. It just quietly swaps them."}, {"id": "local", "part": 2, "cat": "Subroutines", "title": "Local variables", "short": "variables inside a subroutine stay inside", "keys": ["local", "scope", "global", "inside", "outside"], "syntax": "def room():\n    key = \"silver\"   # only exists in here", "html": "\u003cp>A variable made \u003cstrong>inside\u003c/strong> a subroutine is \u003cstrong>local\u003c/strong>: it only exists while that subroutine runs. Another room can't see it, and it's gone when the subroutine finishes.\u003c/p>\u003cp>To get a value out, \u003ccode>return\u003c/code> it. To get a value in, pass it as a parameter.\u003c/p>", "example": "def cell():\n    key = \"silver key\"\n    print(\"Inside cell():\", key)\n\ncell()\nprint(\"Back outside, there is no key variable here.\")", "watch": "Using a local variable outside its subroutine causes a NameError."}, {"id": "lists", "part": 3, "cat": "Lists", "title": "Lists", "short": "lots of values in one variable", "keys": ["list", "lists", "[]", "[", "]", "append", "len", "len()", "index", "inventory", "bag"], "syntax": "bag = [\"torch\", \"rope\"]\nbag.append(\"key\")\nlen(bag)\nbag[0]", "html": "\u003cp>A list stores lots of values in square brackets. An empty list is \u003ccode>[]\u003c/code>.\u003c/p>\u003cul>\u003cli>\u003ccode>bag.append(\"key\")\u003c/code> adds to the end.\u003c/li>\u003cli>\u003ccode>len(bag)\u003c/code> counts the items.\u003c/li>\u003cli>\u003ccode>bag[0]\u003c/code> is the first item. Positions start at 0.\u003c/li>\u003c/ul>", "example": "bag = [\"torch\", \"rope\"]\nbag.append(\"key\")\nprint(bag)\nprint(len(bag), \"items\")\nprint(\"First item:\", bag[0])", "watch": "Write \u003ccode>bag.append(\"key\")\u003c/code>, not \u003ccode>bag = bag.append(\"key\")\u003c/code>, which loses the whole list."}, {"id": "forlist", "part": 3, "cat": "Lists", "title": "Looping through a list", "short": "for item in bag:", "keys": ["for item", "loop list", "each", "every item", "show bag"], "syntax": "for item in bag:\n    print(item)", "html": "\u003cp>A for loop can go through a list. Each time round, the loop variable holds the next item.\u003c/p>", "example": "bag = [\"torch\", \"rope\", \"key\"]\nprint(\"Your bag holds:\")\nfor item in bag:\n    print(\"-\", item)", "watch": ""}, {"id": "in", "part": 3, "cat": "Lists", "title": "in  and  not in", "short": "is it in the list?", "keys": ["in", "not in", "contains", "has", "check", "find"], "syntax": "if \"key\" in bag:\nif \"key\" not in bag:", "html": "\u003cp>\u003ccode>in\u003c/code> checks whether something is in a list. It gives True or False, so it works in an \u003ccode>if\u003c/code> or a \u003ccode>while\u003c/code>. \u003ccode>not in\u003c/code> checks the opposite.\u003c/p>", "example": "bag = [\"torch\", \"key\"]\nif \"key\" in bag:\n    print(\"You unlock the door.\")\nif \"rope\" not in bag:\n    print(\"You need a rope for the bridge.\")", "watch": "It must match exactly: \u003ccode>\"Key\"\u003c/code> and \u003ccode>\"key\"\u003c/code> are different."}, {"id": "remove", "part": 3, "cat": "Lists", "title": ".remove()", "short": "take an item out of a list", "keys": ["remove", ".remove()", "use up", "delete", "take out"], "syntax": "bag.remove(\"potion\")", "html": "\u003cp>Takes the first matching item out of a list. Check it's there first with \u003ccode>in\u003c/code>.\u003c/p>", "example": "bag = [\"potion\", \"torch\"]\nif \"potion\" in bag:\n    bag.remove(\"potion\")\n    print(\"You drink the potion.\")\nprint(bag)", "watch": "Removing something that isn't in the list causes a ValueError."}, {"id": "validate", "part": 3, "cat": "Lists", "title": "Checking input (validation)", "short": "keep asking until the answer makes sense", "keys": ["validation", "validate", "ask", "ask()", "check input", "isdigit", "options", "nonsense"], "syntax": "def ask(question, options):\n    answer = input(question).strip().lower()\n    while answer not in options:\n        answer = input(question).strip().lower()\n    return answer", "html": "\u003cp>Write one function that keeps asking until the answer is one of the options, then returns it. Every room can use it.\u003c/p>\u003cp>For numbers, \u003ccode>text.isdigit()\u003c/code> is True if the text is all digits, so \u003ccode>int()\u003c/code> is safe to use.\u003c/p>", "example": "def ask(question, options):\n    answer = input(question).strip().lower()\n    while answer not in options:\n        print(\"Please type one of:\", options)\n        answer = input(question).strip().lower()\n    return answer\n\nway = ask(\"Left or right? \", [\"left\", \"right\"])\nprint(\"You go\", way)", "watch": "Catch the answer: \u003ccode>way = ask(...)\u003c/code>. Keep the options in lower case."}, {"id": "errors", "part": 1, "cat": "Fixing errors", "title": "Error messages", "short": "what they mean and what to check", "keys": ["error", "errors", "bug", "debug", "syntaxerror", "nameerror", "typeerror", "valueerror", "indentationerror", "fix"], "syntax": "Problem on line 3\nNameError: name 'helth' is not defined", "html": "\u003cp>The red line number shows where Python got stuck. Sometimes the real mistake is on the line above.\u003c/p>\u003cul>\u003cli>\u003cstrong>SyntaxError\u003c/strong>: breaks the rules. Check colons, brackets and quote marks.\u003c/li>\u003cli>\u003cstrong>IndentationError\u003c/strong>: the spaces don't line up.\u003c/li>\u003cli>\u003cstrong>NameError\u003c/strong>: a spelling mistake, a capital letter, or a variable used before it has a value.\u003c/li>\u003cli>\u003cstrong>TypeError\u003c/strong>: text and numbers mixed up. Did you forget \u003ccode>int()\u003c/code>?\u003c/li>\u003cli>\u003cstrong>ValueError\u003c/strong>: \u003ccode>int()\u003c/code> was given something that isn't a whole number.\u003c/li>\u003c/ul>\u003cp>A \u003cstrong>logic error\u003c/strong> has no message: the program runs but does the wrong thing. Test every choice to find those.\u003c/p>", "example": "health = 100\nprint(helth)", "watch": "Fix one error at a time, then run it again."}], REF_CATS = ["Output and text", "Variables and input", "Numbers", "Decisions", "Loops", "Subroutines", "Lists", "Fixing errors"], REF_STAGES = {"p1": ["def", "main"], "p2": ["def", "indent", "errors"], "p3": ["main", "local", "while", "for"], "p4": ["params", "return", "two"], "p5": ["if", "return", "andor", "compare"], "p6": ["errors", "return", "params"]}, REF_ERR = [["IndentationError|TabError", "indent"], ["expected ':'", "indent"], ["unterminated string|EOL while", "strings"], ["Maybe you meant '=='|cannot assign to", "compare"], ["name 'random' is not defined|module 'random'|empty range", "random"], ["positional argument", "params"], ["'NoneType' object has no attribute 'append'", "lists"], ["NoneType", "return"], ["x not in list", "remove"], ["IndexError", "lists"], ["invalid literal for int|'str' and 'int'|'int' and 'str'|concatenate str|unsupported operand", "int"], ["ZeroDivisionError", "maths"], ["Stopped: a loop", "while"], [".", "errors"]], REF_PART = 2;
const REFS = REF_ALL.filter(r => r.part <= REF_PART);
const REF_BY = Object.fromEntries(REFS.map(r => [r.id, r]));
function refFor(err){
  for (const [pat, id] of REF_ERR) if (REF_BY[id] && new RegExp(pat).test(err)) return REF_BY[id];
  return null;
}
function refLink(res){
  const r = refFor(String(res.error || ""));
  return r ? `<br><button class="reflink" data-ref="${r.id}">${IC.book} Look it up: ${esc(r.title)}</button>` : "";
}
(function(){
  const box = document.getElementById("ref"), list = document.getElementById("reflist"), q = document.getElementById("refq"), btn = document.getElementById("refbtn");
  let picked = "";
  const card = r => `<details class="refcard" data-rid="${r.id}"><summary><span class="rt">${esc(r.title)}</span><span class="rs">${esc(r.short)}</span></summary>
    <div class="rb"><pre class="sample">${esc(r.syntax)}</pre>${r.html}${r.watch ? `<p class="watch"><b>Watch out:</b> ${r.watch}</p>` : ""}<div class="rslot2"></div></div></details>`;
  function score(r, t){
    if (r.keys.includes(t) || r.title.toLowerCase() === t) return 4;
    if (r.title.toLowerCase().includes(t)) return 3;
    if (t.length > 1 && r.keys.some(k => k.includes(t) || (k.length > 2 && t.includes(k)))) return 2;
    if (t.length > 2 && (r.short + " " + r.html).toLowerCase().includes(t)) return 1;
    return 0;
  }
  function wire(){
    list.querySelectorAll(".refcard").forEach(d => d.addEventListener("toggle", () => {
      if (d.open && !d.dataset.ran) { d.dataset.ran = "1"; const r = REF_BY[d.dataset.rid]; d.querySelector(".rslot2").appendChild(makeRunner("ref-" + r.id, r.example, "Try it")); }
    }));
    list.querySelectorAll("[data-chip]").forEach(b => b.addEventListener("click", () => show(b.dataset.chip)));
  }
  function render(){
    const t = q.value.trim().toLowerCase();
    if (t) {
      const hits = REFS.map(r => [score(r, t), r]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).map(x => x[1]);
      list.innerHTML = hits.length ? `<h3>Results</h3>` + hits.map(card).join("")
        : `<p class="refnone">Nothing found for <code>${esc(t)}</code>. Try a shorter word, like <code>loop</code>, <code>print</code> or <code>error</code>.</p>` +
          (/^[a-z_][a-z0-9_]*$/.test(t) ? `<p class="refnone">If <code>${esc(t)}</code> is a name from your own program, like a variable or a room, Python only knows it because your code creates it. Check it's spelt the same everywhere.</p>` : "");
      wire();
      const first = list.querySelector(".refcard");
      if (first && (hits.length === 1 || score(hits[0], t) === 4)) first.open = true;
    } else {
      const ids = (REF_STAGES[PAGES[S.page]] || []).filter(id => REF_BY[id]);
      list.innerHTML = (ids.length ? `<h3>On this stage</h3><div class="chips">${ids.map(id => `<button data-chip="${id}">${esc(REF_BY[id].title)}</button>`).join("")}</div>` : "") +
        REF_CATS.map(c => { const rs = REFS.filter(r => r.cat === c); return rs.length ? `<h3>${esc(c)}</h3>` + rs.map(card).join("") : ""; }).join("");
      wire();
    }
  }
  function show(id){
    const d = list.querySelector(`.refcard[data-rid="${id}"]`);
    if (!d) return;
    d.open = true;
    d.scrollIntoView({block: "start"});
  }
  function open(term, id){
    box.hidden = false; document.body.classList.add("refopen"); btn.setAttribute("aria-expanded", "true");
    q.value = term || ""; render();
    if (id) { q.value = ""; render(); show(id); } else if (!term) list.scrollTop = 0;
    if (!id) q.focus({preventScroll: true});
  }
  function close(){ box.hidden = true; document.body.classList.remove("refopen"); btn.setAttribute("aria-expanded", "false"); }
  // remember a word highlighted in any code box on the page
  const grab = e => {
    const t = e.target;
    if (t.tagName !== "TEXTAREA" || box.contains(t)) return;
    const s = t.value.slice(t.selectionStart, t.selectionEnd).trim();
    picked = s && s.length <= 40 && !s.includes("\n") ? s : "";
  };
  document.addEventListener("mouseup", grab); document.addEventListener("keyup", grab);
  btn.addEventListener("mousedown", e => e.preventDefault());
  btn.addEventListener("click", () => {
    const m = picked.match(/[A-Za-z_][A-Za-z0-9_]*|==|!=|<=|>=|\/\/|[%#+*\/<>=:\[]/);
    picked = "";
    if (m) { open(m[0].toLowerCase()); return; }
    if (box.hidden) open(""); else close();
  });
  document.getElementById("refclose").addEventListener("click", close);
  q.addEventListener("input", render);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !box.hidden) close(); });
  document.addEventListener("click", e => { const b = e.target.closest("[data-ref]"); if (b) open("", b.dataset.ref); });
  window.refStage = () => { if (!box.hidden && !q.value.trim()) render(); };
})();
draw();
setDirty(dirty);
</script>
