    if (ub) ub.addEventListener("click", () => { S.unlocked[p.id] = true; save(); art.classList.remove("locked"); ub.parentElement.hidden = true; });
  });
  page.querySelectorAll("[data-tick]").forEach(c => c.addEventListener("change", () => { S.ticks[c.dataset.tick] = c.checked; save(); }));
  const md = page.querySelector("#markdone"); if (md) md.addEventListener("click", () => { S.done[doneKey] = true; save(); renderDots(); renderStage(st); page.querySelector(".endcard").scrollIntoView({block: "center"}); });
  const lu = page.querySelector("#levelup"); if (lu) lu.addEventListener("click", () => { setLevel(up); window.scrollTo(0, 0); });
  const ns = page.querySelector("#nextstage"); if (ns) ns.addEventListener("click", () => go(S.page + 1));
}

function renderFinish(){
  const rows = STAGES.map(st => `<tr><td>Stage ${st.num}: ${esc(st.title)}</td>${["B", "I", "A"].map(l => `<td class="c">${S.done[st.id + ":" + l] ? '<span class="tick">&#10003;</span>' : ""}</td>`).join("")}</tr>`).join("");
  page.innerHTML = `
  <section class="hero">${IC.door}<div><h1>Mission complete?</h1>
    <p>If you've made it this far, you can write programs that talk to the player, remember things, do maths, make decisions and repeat themselves. That's the core of every program ever written.</p></div></section>
  <div class="card"><h2 class="sec">${IC.key} Your progress</h2>
    <table class="prog"><thead><tr><th>Stage</th><th class="c">Beginner</th><th class="c">Intermediate</th><th class="c">Advanced</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="card"><h2 class="sec">${IC.bulb} Check yourself</h2>
    <ul class="steps">${[
      "I can explain the difference between a string and an integer",
      "I can explain why int() is needed around input() when I want a number",
      "I can explain the difference between if and while",
      "I can choose between a for loop and a while loop, and say why",
      "I can spot and fix an infinite loop"].map((s, i) => `<li><label><input type="checkbox" data-tick="final:${i}" ${S.ticks["final:" + i] ? "checked" : ""}><span>${s}</span></label></li>`).join("")}</ul></div>
  <div class="card"><h2 class="sec">${IC.reset} Start again</h2><p>This clears your code, ticks and progress on this computer. Any progress file you saved stays in your Downloads folder.</p><button class="btn ghost" id="wipe">Reset my progress</button></div>`;
  page.querySelectorAll("[data-tick]").forEach(c => c.addEventListener("change", () => { S.ticks[c.dataset.tick] = c.checked; save(); }));
  const w = page.querySelector("#wipe");
  w.addEventListener("click", () => {
    if (!w.dataset.confirm) { w.dataset.confirm = "1"; w.textContent = "Are you sure? Click again to reset"; return; }
    S = fresh(); save(); setDirty(false); go(0);
  });
}

/* ---------------- navigation ---------------- */
function renderDots(){
  const d = document.getElementById("dots");
  d.innerHTML = PAGES.map((p, i) => {
    let cls = "dot", label, txt;
    if (p === "welcome") { label = "Welcome"; txt = "&#9733;"; }
    else if (p === "finish") { label = "Finish"; txt = "&#10003;"; }
    else { const st = STAGES[i - 1]; label = `Stage ${st.num}: ${st.title}`; txt = st.num;
      const best = ["A", "I", "B"].find(l => S.done[st.id + ":" + l]); if (best) cls += " done-" + best; }
    if (i === S.page) cls += " current";
    return `<button class="${cls}" data-go="${i}" title="${esc(label)}" aria-label="${esc(label)}">${txt}</button>`;
  }).join("");
  d.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(+b.dataset.go)));
}
function setLevel(lv){
  S.level = lv; save();
  document.querySelectorAll(".lvswitch button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lv === lv)));
  draw();
}
function draw(){
  if (active) active.stop();
  const p = PAGES[S.page];
  if (p === "welcome") renderWelcome(); else if (p === "finish") renderFinish(); else renderStage(STAGES.find(s => s.id === p));
  renderDots();
  refStage();
  document.getElementById("prev").disabled = S.page === 0;
  document.getElementById("next").disabled = S.page === PAGES.length - 1;
  document.getElementById("where").textContent = p === "welcome" ? "Welcome" : p === "finish" ? "Finish" : `Stage ${S.page} of ${STAGES.length}  |  ${LEVELS[level()]} route`;
}
function go(i){ S.page = Math.max(0, Math.min(PAGES.length - 1, i)); save(); draw(); window.scrollTo(0, 0); }
document.getElementById("prev").addEventListener("click", () => go(S.page - 1));
document.getElementById("next").addEventListener("click", () => go(S.page + 1));
document.querySelectorAll(".lvswitch button").forEach(b => {
  b.setAttribute("aria-pressed", String(b.dataset.lv === S.level));
  b.addEventListener("click", () => setLevel(b.dataset.lv));
});
document.getElementById("savefile").addEventListener("click", saveToFile);
const loadInput = document.getElementById("loadinput");
document.getElementById("loadfile").addEventListener("click", () => { loadInput.value = ""; loadInput.click(); });
loadInput.addEventListener("change", () => { if (loadInput.files[0]) loadFromFile(loadInput.files[0]); });
if (S.page >= PAGES.length) S.page = 0;

g.\u003c/p>\u003cul>\u003cli>A comma in print (easiest).\u003c/li>\u003cli>\u003ccode>str()\u003c/code> turns a number into text so you can use \u003ccode>+\u003c/code>.\u003c/li>\u003cli>An \u003cstrong>f-string\u003c/strong>: put \u003ccode>f\u003c/code> before the quote and the variable in curly brackets.\u003c/li>\u003c/ul>", "example": "gold = 12\nprint(\"Gold:\", gold)\nprint(\"Gold: \" + str(gold))\nprint(f\"Gold: {gold}\")", "watch": "Writing \u003ccode>\"Gold: \" + gold\u003c/code> causes a TypeError, because gold is a number."}, {"id": "tidy", "part": 1, "cat": "Output and text", "title": ".lower()  .strip()  .title()", "short": "tidy up what the player typed", "keys": ["lower", ".lower()", "strip", ".strip()", "title", ".title()", "upper", "capital", "capitals", "case", "spaces"], "syntax": "answer = input(\"Yes or no? \").strip().lower()", "html": "\u003cp>Players type \u003ccode>YES\u003c/code>, \u003ccode>Yes\u003c/code> or \u003ccode> yes \u003c/code> with spaces. Tidy the answer before you check it.\u003c/p>\u003cul>\u003cli>\u003ccode>.lower()\u003c/code> makes it all lower case.\u003c/li>\u003cli>\u003ccode>.strip()\u003c/code> removes spaces at the start and end.\u003c/li>\u003cli>\u003ccode>.title()\u003c/code> gives every word a capital letter.\u003c/li>\u003c/ul>", "example": "answer = input(\"Do you open the door? \").strip().lower()\nif answer == \"yes\":\n    print(\"It creaks open.\")\nelse:\n    print(\"You leave it shut.\")", "watch": "After \u003ccode>.lower()\u003c/code>, compare with lower case: \u003ccode>\"yes\"\u003c/code>, not \u003ccode>\"Yes\"\u003c/code>."}, {"id": "comments", "part": 1, "cat": "Output and text", "title": "# Comments", "short": "notes that Python ignores", "keys": ["#", "comment", "comments", "note"], "syntax": "# This is a comment", "html": "\u003cp>Anything after a \u003ccode>#\u003c/code> is a note for people. Python ignores it. Use comments to plan your code and to explain the tricky bits.\u003c/p>", "example": "# Print the title\nprint(\"ESCAPE THE DUNGEON\")  # this part is ignored too", "watch": ""}, {"id": "variables", "part": 1, "cat": "Variables and input", "title": "Variables", "short": "a named box that stores a value", "keys": ["variable", "variables", "=", "store", "assign", "assignment"], "syntax": "name = \"Asha\"\nhealth = 100\nhealth = health - 20", "html": "\u003cp>A variable stores a value under a name. \u003ccode>=\u003c/code> puts the value on the right into the variable on the left. You can change it later, even using its old value.\u003c/p>\u003cp>Names can't have spaces or start with a number. \u003ccode>Health\u003c/code> and \u003ccode>health\u003c/code> are different variables.\u003c/p>", "example": "health = 100\nprint(health)\nhealth = health - 20\nprint(health)", "watch": "One \u003ccode>=\u003c/code> stores a value. Two, \u003ccode>==\u003c/code>, compares. A NameError often means the variable was spelt differently, or used before it was given a value."}, {"id": "input", "part": 1, "cat": "Variables and input", "title": "input()", "short": "ask the player a question", "keys": ["input", "ask", "question", "type", "typed"], "syntax": "name = input(\"What is your name? \")", "html": "\u003cp>Shows a question, waits for the player to type an answer and press Enter, then gives back what they typed. Store it in a variable so you can use it.\u003c/p>\u003cp>Leave a space before the closing quote so the answer doesn't touch the question.\u003c/p>", "example": "name = input(\"What is your name? \")\nprint(\"Welcome,\", name)", "watch": "input() \u003cstrong>always\u003c/strong> gives back text, even if they type a number. Use \u003ccode>int()\u003c/code> to do maths with it."}, {"id": "int", "part": 1, "cat": "Numbers", "title": "int()", "short": "turn typed text into a whole number", "keys": ["int", "int()", "integer", "number", "whole number"], "syntax": "coins = int(input(\"How many coins? \"))", "html": "\u003cp>Turns text like \u003ccode>\"5\"\u003c/code> into the number \u003ccode>5\u003c/code> so you can do maths with it. Most often wrapped round \u003ccode>input()\u003c/code>.\u003c/p>", "example": "coins = int(input(\"How many coins? \"))\nprint(\"Double that is\", coins * 2)", "watch": "\u003ccode>int(\"ten\")\u003c/code> or \u003ccode>int(\"2.5\")\u003c/code> causes a ValueError. Only whole numbers work."}, {"id": "maths", "part": 1, "cat": "Numbers", "title": "Maths", "short": "+  -  *  /  //  %", "keys": ["maths", "math", "+", "-", "*", "/", "//", "%", "add", "subtract", "multiply", "divide", "remainder", "modulus", "div", "mod"], "syntax": "+ add   - subtract   * multiply   / divide\n// whole-number divide   % remainder", "html": "\u003cp>Python does maths in the usual order: brackets first, then \u003ccode>* / // %\u003c/code>, then \u003ccode>+ -\u003c/code>.\u003c/p>\u003cul>\u003cli>\u003ccode>17 / 5\u003c/code> gives \u003ccode>3.4\u003c/code>\u003c/li>\u003cli>\u003ccode>17 // 5\u003c/code> gives \u003ccode>3\u003c/code> (how many whole times)\u003c/li>\u003cli>\u003ccode>17 % 5\u003c/code> gives \u003ccode>2\u003c/code> (what's left over)\u003c/li>\u003c/ul>", "example": "print(17 / 5)\nprint(17 // 5)\nprint(17 % 5)\nprint(2 + 3 * 4)\nprint((2 + 3) * 4)", "watch": "You can't divide by zero. That's a ZeroDivisionError."}, {"id": "if", "part": 1, "cat": "Decisions", "title": "if  elif  else", "short": "choose which code runs", "keys": ["if", "elif", "else", "selection", "decision", "choice", "branch", "branching"], "syntax": "if health > 50:\n    print(\"Strong\")\nelif health > 0:\n    print(\"Wounded\")\nelse:\n    print(\"Game over\")", "html": "\u003cp>Python checks each condition from the top. The first one that is True runs, and the rest are skipped. \u003ccode>else\u003c/code> runs if nothing above was True. You can have as many \u003ccode>elif\u003c/code> lines as you like, and you don't have to have an \u003ccode>else\u003c/code>.\u003c/p>", "example": "health = 40\nif health > 50:\n    print(\"You feel strong.\")\nelif health > 0:\n    print(\"You are wounded.\")\nelse:\n    print(\"Game over.\")", "watch": "Every \u003ccode>if\u003c/code>, \u003ccode>elif\u003c/code> and \u003ccode>else\u003c/code> line ends with a colon, and the code underneath is indented."}, {"id": "compare", "part": 1, "cat": "Decisions", "title": "Comparisons", "short": "==  !=  \u003c  >  \u003c=  >=", "keys": ["==", "!=", "\u003c", ">", "\u003c=", ">=", "compare", "comparison", "equal", "equals", "not equal", "greater", "less"], "syntax": "==  equal to          !=  not equal to\n\u003c   less than         >   greater than\n\u003c=  less or equal     >=  greater or equal", "html": "\u003cp>A comparison is either True or False. Use them in \u003ccode>if\u003c/code> and \u003ccode>while\u003c/code>.\u003c/p>", "example": "gold = 10\nprint(gold == 10)\nprint(gold != 10)\nprint(gold > 5)\nprint(gold \u003c= 9)", "watch": "Text must match exactly: \u003ccode>\"Yes\" == \"yes\"\u003c/code> is False. Use \u003ccode>.lower()\u003c/code> first."}, {"id": "andor", "part": 1, "cat": "Decisions", "title": "and  or  not", "short": "join conditions together", "keys": ["and", "or", "not", "both", "either"], "syntax": "if gold >= 10 and health \u003c 50:\nif answer == \"yes\" or answer == \"y\":", "html": "\u003cul>\u003cli>\u003ccode>and\u003c/code>: True only if \u003cstrong>both\u003c/strong> sides are True.\u003c/li>\u003cli>\u003ccode>or\u003c/code>: True if \u003cstrong>either\u003c/strong> side is True.\u003c/li>\u003cli>\u003ccode>not\u003c/code>: flips True and False.\u003c/li>\u003c/ul>", "example": "answer = \"y\"\nif answer == \"yes\" or answer == \"y\":\n    print(\"You light the torch.\")\ngold = 15\nhealth = 30\nif gold >= 10 and health \u003c 50:\n    print(\"Buy a potion!\")", "watch": "Each side needs a full comparison: \u003ccode>answer == \"yes\" or \"y\"\u003c/code> is always True. Write \u003ccode>answer == \"yes\" or answer == \"y\"\u003c/code>."}, {"id": "indent", "part": 1, "cat": "Decisions", "title": "Colons and indentation", "short": "the : and the 4 spaces", "keys": [":", "colon", "indent", "indentation", "spaces", "tab", "block"], "syntax": "if gold > 5:\n    print(\"inside the if\")\nprint(\"after the if\")", "html": "\u003cp>Lines that start a block end with a colon: \u003ccode>if\u003c/code>, \u003ccode>elif\u003c/code>, \u003ccode>else\u003c/code>, \u003ccode>while\u003c/code>, \u003ccode>for\u003c/code> and \u003ccode>def\u003c/code>. The lines that belong to it are indented by 4 spaces (press Tab). The first line that isn't indented is outside the block.\u003c/p>", "example": "gold = 8\nif gold > 5:\n    print(\"You can buy a torch.\")\n    print(\"This line is inside the if too.\")\nprint(\"This line always runs.\")", "watch": "An IndentationError means the spaces don't line up. A missing colon causes a SyntaxError."}, {"id": "while", "part": 1, "cat": "Loops", "title": "while loop", "short": "repeat while something is True", "keys": ["while", "loop", "repeat", "iteration", "until", "infinite"], "syntax": "while password != \"open\":\n    password = input(\"Password: \")", "html": "\u003cp>Repeats the indented code for as long as the condition is True. Use it when you don't know how many times you'll need to repeat, like until the player gets an answer right.\u003c/p>", "example": "password = input(\"Password: \")\nwhile password != \"open\":\n    print(\"Wrong!\")\n    password = input(\"Password: \")\nprint(\"The door opens.\")", "watch": "Something inside the loop must change, or the condition stays True forever. That's an infinite loop. This page will stop it for you."}, {"id": "for", "part": 1, "cat": "Loops", "title": "for loop and range()", "short": "repeat a set number of times", "keys": ["for", "range", "range()", "loop", "repeat", "count", "times"], "syntax": "for i in range(5):        # 0, 1, 2, 3, 4\nfor i in range(1, 6):     # 1, 2, 3, 4, 5\nfor i in range(10, 0, -1):  # 10 down to 1", "html": "\u003cp>Repeats a set number of times. \u003ccode>range\u003c/code> gives the numbers to count through. It \u003cstrong>stops before\u003c/strong> the second number. A for loop can also go through each letter of a string.\u003c/p>", "example": "for torch in range(1, 4):\n    print(\"Torch\", torch, \"is lit.\")\nfor letter in \"DOOR\":\n    print(letter)", "watch": "\u003ccode>range(1, 5)\u003c/code> gives 1 to 4, not 1 to 5."}, {"id": "random", "part": 1, "cat": "Numbers", "title": "random", "short": "dice rolls and random picks", "keys": ["random", "import", "randint", "random.randint", "choice", "random.choice", "dice", "luck", "seed"], "syntax": "import random\nroll = random.randint(1, 6)\nbeast = random.choice([\"rat\", \"bat\"])", "html": "\u003cp>Put \u003ccode>import random\u003c/code> once, on the very first line.\u003c/p>\u003cul>\u003cli>\u003ccode>random.randint(1, 6)\u003c/code> gives a whole number from 1 to 6. Unlike range, it \u003cstrong>includes\u003c/strong> both numbers.\u003c/li>\u003cli>\u003ccode>random.choice(list)\u003c/code> picks one item from a list.\u003c/li>\u003c/ul>\u003cp>Run random code several times when you test it.\u003c/p>", "example": "import random\nroll = random.randint(1, 6)\nprint(\"You rolled\", roll)\nbeast = random.choice([\"rat\", \"bat\", \"spider\"])\nprint(\"A\", beast, \"appears!\")", "watch": "Forgetting \u003ccode>import random\u003c/code> causes a NameError. Pick a new random number inside a loop, not once before it."}, {"id": "def", "part": 2, "cat": "Subroutines", "title": "def and calling", "short": "make a subroutine, then run it", "keys": ["def", "subroutine", "procedure", "call", "calling", "()", "define"], "syntax": "def entrance():\n    print(\"You stand at the entrance.\")\n\nentrance()", "html": "\u003cp>\u003ccode>def\u003c/code> creates a subroutine: a named block of code that does one job. Defining it does \u003cstrong>not\u003c/strong> run it. It runs when you \u003cstrong>call\u003c/strong> it: its name with brackets.\u003c/p>\u003cp>A subroutine that just does a job is called a \u003cstrong>procedure\u003c/strong>.\u003c/p>", "example": "def entrance():\n    print(\"You stand at the dungeon entrance.\")\n    print(\"Cold air drifts out.\")\n\nentrance()\nentrance()", "watch": "A call without brackets, \u003ccode>entrance\u003c/code>, does nothing. Names can't have spaces."}, {"id": "main", "part": 2, "cat": "Subroutines", "title": "The main program", "short": "defs at the top, calls at the bottom", "keys": ["main", "main program", "order", "sequence", "structure"], "syntax": "def hall():\n    ...\n\ndef cellar():\n    ...\n\n# main program\nhall()\ncellar()", "html": "\u003cp>Put all your \u003ccode>def\u003c/code> blocks at the top. Underneath, the \u003cstrong>main program\u003c/strong> calls them in order. When a subroutine is called, Python jumps into it, runs it, then comes back to the next line.\u003c/p>", "example": "def hall():\n    print(\"A long hall.\")\n\ndef cellar():\n    print(\"A damp cellar.\")\n\n# main program\nprint(\"Start\")\nhall()\ncellar()\nprint(\"End\")", "watch": "Don't indent the main program, or it ends up inside the last def and never runs. Call a subroutine below its def, not above it."}, {"id": "params", "part": 2, "cat": "Subroutines", "title": "Parameters", "short": "pass values into a subroutine", "keys": ["parameter", "parameters", "argument", "arguments", "pass", "passing", "brackets"], "syntax": "def show_status(health, gold):\n    print(health, gold)\n\nshow_status(100, 25)", "html": "\u003cp>A \u003cstrong>parameter\u003c/strong> is a name in the brackets of a def. It receives a value when the subroutine is called. The value you pass in is called an \u003cstrong>argument\u003c/strong>.\u003c/p>\u003cp>Several parameters are separated by commas. The values go in \u003cstrong>in order\u003c/strong>: first to first, second to second.\u003c/p>", "example": "def show_status(health, gold):\n    print(\"Health:\", health)\n    print(\"Gold:\", gold)\n\nshow_status(100, 25)\nshow_status(60, 40)", "watch": "The call needs the same number of values as the def has parameters, in the same order."}, {"id": "return", "part": 2, "cat": "Subroutines", "title": "return and functions", "short": "send a value back out", "keys": ["return", "function", "functions", "send back", "catch", "one in one out"], "syntax": "def trap_room(health):\n    health = health - 20\n    return health\n\nhealth = trap_room(health)", "html": "\u003cp>\u003ccode>return\u003c/code> sends a value back out of a subroutine. A subroutine that returns a value is called a \u003cstrong>function\u003c/strong>.\u003c/p>\u003cp>You must \u003cstrong>catch\u003c/strong> the value in a variable: \u003ccode>health = trap_room(health)\u003c/code>. Our rule: \u003cstrong>one in, one out\u003c/strong>.\u003c/p>", "example": "def trap_room(health):\n    print(\"Spikes!\")\n    health = health - 20\n    return health\n\nhealth = 100\nhealth = trap_room(health)\nprint(\"Health:\", health)", "watch": "Without \u003ccode>health =\u003c/code> the value comes back and is thrown away. Code after \u003ccode>return\u003c/code> never runs."}, {"id": "two", "part": 2, "cat": "Subroutines", "title": "Returning two values", "short": "gold, health = shop(gold, health)", "keys": ["two values", "multiple", "tuple", "return two", "two out"], "syntax": "def shop(gold, health):\n    ...\n    return gold, health\n\ngold, health = shop(gold, health)", "html": "\u003cp>A function can send back more than one value, separated by commas. Catch them in the \u003cstrong>same order\u003c/strong> you returned them.\u003c/p>", "example": "def shop(gold, health):\n    gold = gold - 10\n    health = health + 25\n    return gold, health\n\ngold = 30\nhealth = 50\ngold, health = shop(gold, health)\nprint(\"Gold:\", gold, \"Health:\", health)", "watch": "Catch them in the wrong order and Python won't complain. It just quietly swaps them."}, {"id": "local", "part": 2, "cat": "Subroutines", "title": "Local variables", "short": "variables inside a subroutine stay inside", "keys": ["local", "scope", "global", "inside", "outside"], "syntax": "def room():\n    key = \"silver\"   # only exists in here", "html": "\u003cp>A variable made \u003cstrong>inside\u003c/strong> a subroutine is \u003cstrong>local\u003c/strong>: it only exists while that subroutine runs. Another room can't see it, and it's gone when the subroutine finishes.\u003c/p>\u003cp>To get a value out, \u003ccode>return\u003c/code> it. To get a value in, pass it as a parameter.\u003c/p>", "example": "def cell():\n    key = \"silver key\"\n    print(\"Inside cell():\", key)\n\ncell()\nprint(\"Back outside, there is no key variable here.\")", "watch": "Using a local variable outside its subroutine causes a NameError."}, {"id": "lists", "part": 3, "cat": "Lists", "title": "Lists", "short": "lots of values in one variable", "keys": ["list", "lists", "[]", "[", "]", "append", "len", "len()", "index", "inventory", "bag"], "syntax": "bag = [\"torch\", \"rope\"]\nbag.append(\"key\")\nlen(bag)\nbag[0]", "html": "\u003cp>A list stores lots of values in square brackets. An empty list is \u003ccode>[]\u003c/code>.\u003c/p>\u003cul>\u003cli>\u003ccode>bag.append(\"key\")\u003c/code> adds to the end.\u003c/li>\u003cli>\u003ccode>len(bag)\u003c/code> counts the items.\u003c/li>\u003cli>\u003ccode>bag[0]\u003c/code> is the first item. Positions start at 0.\u003c/li>\u003c/ul>", "example": "bag = [\"torch\", \"rope\"]\nbag.append(\"key\")\nprint(bag)\nprint(len(bag), \"items\")\nprint(\"First item:\", bag[0])", "watch": "Write \u003ccode>bag.append(\"key\")\u003c/code>, not \u003ccode>bag = bag.append(\"key\")\u003c/code>, which loses the whole list."}, {"id": "forlist", "part": 3, "cat": "Lists", "title": "Looping through a list", "short": "for item in bag:", "keys": ["for item", "loop list", "each", "every item", "show bag"], "syntax": "for item in bag:\n    print(item)", "html": "\u003cp>A for loop can go through a list. Each time round, the loop variable holds the next item.\u003c/p>", "example": "bag = [\"torch\", \"rope\", \"key\"]\nprint(\"Your bag holds:\")\nfor item in bag:\n    print(\"-\", item)", "watch": ""}, {"id": "in", "part": 3, "cat": "Lists", "title": "in  and  not in", "short": "is it in the list?", "keys": ["in", "not in", "contains", "has", "check", "find"], "syntax": "if \"key\" in bag:\nif \"key\" not in bag:", "html": "\u003cp>\u003ccode>in\u003c/code> checks whether something is in a list. It gives True or False, so it works in an \u003ccode>if\u003c/code> or a \u003ccode>while\u003c/code>. \u003ccode>not in\u003c/code> checks the opposite.\u003c/p>", "example": "bag = [\"torch\", \"key\"]\nif \"key\" in bag:\n    print(\"You unlock the door.\")\nif \"rope\" not in bag:\n    print(\"You need a rope for the bridge.\")", "watch": "It must match exactly: \u003ccode>\"Key\"\u003c/code> and \u003ccode>\"key\"\u003c/code> are different."}, {"id": "remove", "part": 3, "cat": "Lists", "title": ".remove()", "short": "take an item out of a list", "keys": ["remove", ".remove()", "use up", "delete", "take out"], "syntax": "bag.remove(\"potion\")", "html": "\u003cp>Takes the first matching item out of a list. Check it's there first with \u003ccode>in\u003c/code>.\u003c/p>", "example": "bag = [\"potion\", \"torch\"]\nif \"potion\" in bag:\n    bag.remove(\"potion\")\n    print(\"You drink the potion.\")\nprint(bag)", "watch": "Removing something that isn't in the list causes a ValueError."}, {"id": "validate", "part": 3, "cat": "Lists", "title": "Checking input (validation)", "short": "keep asking until the answer makes sense", "keys": ["validation", "validate", "ask", "ask()", "check input", "isdigit", "options", "nonsense"], "syntax": "def ask(question, options):\n    answer = input(question).strip().lower()\n    while answer not in options:\n        answer = input(question).strip().lower()\n    return answer", "html": "\u003cp>Write one function that keeps asking until the answer is one of the options, then returns it. Every room can use it.\u003c/p>\u003cp>For numbers, \u003ccode>text.isdigit()\u003c/code> is True if the text is all digits, so \u003ccode>int()\u003c/code> is safe to use.\u003c/p>", "example": "def ask(question, options):\n    answer = input(question).strip().lower()\n    while answer not in options:\n        print(\"Please type one of:\", options)\n        answer = input(question).strip().lower()\n    return answer\n\nway = ask(\"Left or right? \", [\"left\", \"right\"])\nprint(\"You go\", way)", "watch": "Catch the answer: \u003ccode>way = ask(...)\u003c/code>. Keep the options in lower case."}, {"id": "errors", "part": 1, "cat": "Fixing errors", "title": "Error messages", "short": "what they mean and what to check", "keys": ["error", "errors", "bug", "debug", "syntaxerror", "nameerror", "typeerror", "valueerror", "indentationerror", "fix"], "syntax": "Problem on line 3\nNameError: name 'helth' is not defined", "html": "\u003cp>The red line number shows where Python got stuck. Sometimes the real mistake is on the line above.\u003c/p>\u003cul>\u003cli>\u003cstrong>SyntaxError\u003c/strong>: breaks the rules. Check colons, brackets and quote marks.\u003c/li>\u003cli>\u003cstrong>IndentationError\u003c/strong>: the spaces don't line up.\u003c/li>\u003cli>\u003cstrong>NameError\u003c/strong>: a spelling mistake, a capital letter, or a variable used before it has a value.\u003c/li>\u003cli>\u003cstrong>TypeError\u003c/strong>: text and numbers mixed up. Did you forget \u003ccode>int()\u003c/code>?\u003c/li>\u003cli>\u003cstrong>ValueError\u003c/strong>: \u003ccode>int()\u003c/code> was given something that isn't a whole number.\u003c/li>\u003c/ul>\u003cp>A \u003cstrong>logic error\u003c/strong> has no message: the program runs but does the wrong thing. Test every choice to find those.\u003c/p>", "example": "health = 100\nprint(helth)", "watch": "Fix one error at a time, then run it again."}], REF_CATS = ["Output and text", "Variables and input", "Numbers", "Decisions", "Loops", "Subroutines", "Lists", "Fixing errors"], REF_STAGES = {"s1": ["print", "strings", "comments"], "s2": ["variables", "input", "strings", "joining", "tidy"], "s3": ["int", "maths", "joining"], "s4": ["if", "compare", "andor", "tidy", "indent"], "s5": ["while", "compare", "random"], "s6": ["for", "indent"], "s7": ["if", "while", "for", "errors"]}, REF_ERR = [["IndentationError|TabError", "indent"], ["expected ':'", "indent"], ["unterminated string|EOL while", "strings"], ["Maybe you meant '=='|cannot assign to", "compare"], ["name 'random' is not defined|module 'random'|empty range", "random"], ["positional argument", "params"], ["'NoneType' object has no attribute 'append'", "lists"], ["NoneType", "return"], ["x not in list", "remove"], ["IndexError", "lists"], ["invalid literal for int|'str' and 'int'|'int' and 'str'|concatenate str|unsupported operand", "int"], ["ZeroDivisionError", "maths"], ["Stopped: a loop", "while"], [".", "errors"]], REF_PART = 1;
const REFS = REF_ALL.filter(r => r.part <= REF_PART);
const REF_BY = Object.fromEntries(REFS.map(r => [r.id, r]));
function refFor(err){
  for (const [pat, id] of REF_ERR) if (REF_BY[id] && new RegExp(pat).test(err)) return REF_BY[id];
  return null;
}
function refLink(res){
  const r = refFor(String(res.error || ""));
  return r ? `<br><button class="reflink" data-ref="${r.id}">${IC.book} Look it up: ${esc(r.title)}</button>` : "";
}
(function(){
  const box = document.getElementById("ref"), list = document.getElementById("reflist"), q = document.getElementById("refq"), btn = document.getElementById("refbtn");
  let picked = "";
  const card = r => `<details class="refcard" data-rid="${r.id}"><summary><span class="rt">${esc(r.title)}</span><span class="rs">${esc(r.short)}</span></summary>
    <div class="rb"><pre class="sample">${esc(r.syntax)}</pre>${r.html}${r.watch ? `<p class="watch"><b>Watch out:</b> ${r.watch}</p>` : ""}<div class="rslot2"></div></div></details>`;
  function score(r, t){
    if (r.keys.includes(t) || r.title.toLowerCase() === t) return 4;
    if (r.title.toLowerCase().includes(t)) return 3;
    if (t.length > 1 && r.keys.some(k => k.includes(t) || (k.length > 2 && t.includes(k)))) return 2;
    if (t.length > 2 && (r.short + " " + r.html).toLowerCase().includes(t)) return 1;
    return 0;
  }
  function wire(){
    list.querySelectorAll(".refcard").forEach(d => d.addEventListener("toggle", () => {
      if (d.open && !d.dataset.ran) { d.dataset.ran = "1"; const r = REF_BY[d.dataset.rid]; d.querySelector(".rslot2").appendChild(makeRunner("ref-" + r.id, r.example, "Try it")); }
    }));
    list.querySelectorAll("[data-chip]").forEach(b => b.addEventListener("click", () => show(b.dataset.chip)));
  }
  function render(){
    const t = q.value.trim().toLowerCase();
    if (t) {
      const hits = REFS.map(r => [score(r, t), r]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).map(x => x[1]);
      list.innerHTML = hits.length ? `<h3>Results</h3>` + hits.map(card).join("")
        : `<p class="refnone">Nothing found for <code>${esc(t)}</code>. Try a shorter word, like <code>loop</code>, <code>print</code> or <code>error</code>.</p>` +
          (/^[a-z_][a-z0-9_]*$/.test(t) ? `<p class="refnone">If <code>${esc(t)}</code> is a name from your own program, like a variable or a room, Python only knows it because your code creates it. Check it's spelt the same everywhere.</p>` : "");
      wire();
      const first = list.querySelector(".refcard");
      if (first && (hits.length === 1 || score(hits[0], t) === 4)) first.open = true;
    } else {
      const ids = (REF_STAGES[PAGES[S.page]] || []).filter(id => REF_BY[id]);
      list.innerHTML = (ids.length ? `<h3>On this stage</h3><div class="chips">${ids.map(id => `<button data-chip="${id}">${esc(REF_BY[id].title)}</button>`).join("")}</div>` : "") +
        REF_CATS.map(c => { const rs = REFS.filter(r => r.cat === c); return rs.length ? `<h3>${esc(c)}</h3>` + rs.map(card).join("") : ""; }).join("");
      wire();
    }
  }
  function show(id){
    const d = list.querySelector(`.refcard[data-rid="${id}"]`);
    if (!d) return;
    d.open = true;
    d.scrollIntoView({block: "start"});
  }
  function open(term, id){
    box.hidden = false; document.body.classList.add("refopen"); btn.setAttribute("aria-expanded", "true");
    q.value = term || ""; render();
    if (id) { q.value = ""; render(); show(id); } else if (!term) list.scrollTop = 0;
    if (!id) q.focus({preventScroll: true});
  }
  function close(){ box.hidden = true; document.body.classList.remove("refopen"); btn.setAttribute("aria-expanded", "false"); }
  // remember a word highlighted in any code box on the page
  const grab = e => {
    const t = e.target;
    if (t.tagName !== "TEXTAREA" || box.contains(t)) return;
    const s = t.value.slice(t.selectionStart, t.selectionEnd).trim();
    picked = s && s.length <= 40 && !s.includes("\n") ? s : "";
  };
  document.addEventListener("mouseup", grab); document.addEventListener("keyup", grab);
  btn.addEventListener("mousedown", e => e.preventDefault());
  btn.addEventListener("click", () => {
    const m = picked.match(/[A-Za-z_][A-Za-z0-9_]*|==|!=|<=|>=|\/\/|[%#+*\/<>=:\[]/);
    picked = "";
    if (m) { open(m[0].toLowerCase()); return; }
    if (box.hidden) open(""); else close();
  });
  document.getElementById("refclose").addEventListener("click", close);
  q.addEventListener("input", render);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !box.hidden) close(); });
  document.addEventListener("click", e => { const b = e.target.closest("[data-ref]"); if (b) open("", b.dataset.ref); });
  window.refStage = () => { if (!box.hidden && !q.value.trim()) render(); };
})();
draw();
setDirty(dirty);
</script>
