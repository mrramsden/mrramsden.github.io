<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape the Dungeon Part 3: Loot and legends</title>
<style>
:root{
  --navy:#0B1F3A; --deep:#13315C; --blue:#1F6FB2; --mid:#5B8DBE; --sky:#8CCBF5;
  --pale:#EAF2FB; --bg:#F3F7FC; --line:#D3E2F2; --amber:#F2A541; --amber-pale:#FFF4E2;
  --red:#C2413A; --red-pale:#FDECEA; --green:#2A9D6F;
  --lvB:#2A9D8F; --lvI:#1F6FB2; --lvA:#13315C;
  --code:"Cascadia Mono","Cascadia Code",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--navy);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:17px;line-height:1.55}
code{font-family:var(--code);background:var(--pale);color:var(--deep);padding:1px 5px;border-radius:4px;font-size:.92em}
h1,h2,h3{line-height:1.2;margin:0}
button{font:inherit;cursor:pointer}
svg.i{width:1.1em;height:1.1em;vertical-align:-.18em;flex:none}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:18px;padding:10px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem;margin-right:auto}
.brand svg{color:var(--amber);width:28px;height:28px}
.brand small{font-weight:400;color:var(--sky);font-size:.9rem}
.lvswitch{display:flex;background:var(--deep);border-radius:999px;padding:4px;gap:2px}
.lvswitch span{font-size:.8rem;color:var(--sky);align-self:center;padding:0 8px 0 10px}
.lvswitch button{border:0;background:transparent;color:#fff;padding:6px 14px;border-radius:999px;font-size:.92rem}
.lvswitch button[aria-pressed="true"]{background:#fff;color:var(--navy);font-weight:700}
.filebar{display:flex;gap:6px;align-items:center}
.filebar button{border:0;border-radius:999px;padding:6px 14px;font-size:.92rem;font-weight:600;display:inline-flex;gap:6px;align-items:center;background:var(--deep);color:#fff;position:relative}
.filebar button.savebtn{background:var(--amber);color:var(--navy)}
.filebar button.savebtn.dirty::after{content:"";position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--navy)}
.filebar button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;box-shadow:0 4px 14px rgba(11,31,58,.3);z-index:30;font-size:.95rem;max-width:90vw}
.toast.bad{background:var(--red)}
.toast[hidden]{display:none}
.dots{display:flex;justify-content:center;gap:8px;padding:12px 10px 4px;flex-wrap:wrap}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--mid);font-weight:700;font-size:.85rem;display:grid;place-items:center;padding:0}
.dot.current{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 3px rgba(31,111,178,.2)}
.dot.done-B{background:var(--lvB);border-color:var(--lvB);color:#fff}
.dot.done-I{background:var(--lvI);border-color:var(--lvI);color:#fff}
.dot.done-A{background:var(--lvA);border-color:var(--lvA);color:#fff}

main{max-width:1000px;margin:0 auto;padding:10px 20px 110px}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(19,49,92,.12);padding:22px 24px;margin:18px 0}

/* stage header */
.stage-head{background:var(--deep);color:#fff;border-radius:16px;padding:24px 28px;margin-top:14px;display:flex;gap:22px;align-items:center}
.stage-head .badge{flex:none;width:76px;height:76px;border-radius:50%;background:var(--navy);display:grid;place-items:center;color:var(--amber);font-size:2rem;font-weight:800}
.stage-head .kicker{color:var(--sky);font-size:.9rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stage-head h1{font-size:2rem;margin:2px 0 6px}
.stage-head p{margin:0;color:#DCE9F7}
.stage-head code{background:rgba(255,255,255,.14);color:#fff}

h2.sec{display:flex;align-items:center;gap:10px;font-size:1.3rem;margin-bottom:10px}
h2.sec svg{color:var(--blue)}
.learn p{margin:.4em 0}
.learn ul{margin:.3em 0;padding-left:1.3em}

details.help{padding:0}
details.help summary{list-style:none;cursor:pointer;padding:16px 24px;font-weight:700;display:flex;align-items:center;gap:10px}
details.help summary::-webkit-details-marker{display:none}
details.help summary::after{content:"Show";margin-left:auto;font-weight:600;font-size:.85rem;color:var(--blue)}
details.help[open] summary::after{content:"Hide"}
.helpgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:0 24px 20px}
.helpgrid h3{font-size:1rem;margin-bottom:6px;color:var(--deep)}
.kw{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}
.kw dt{font-family:var(--code);font-weight:700;color:var(--blue)}
.kw dd{margin:0}
.mist{margin:0;padding-left:1.2em;font-size:.95rem}
.mist li{margin-bottom:4px}

/* level panel */
.lvhead{display:flex;align-items:center;gap:14px;margin:30px 0 4px}
.lvpill{color:#fff;font-weight:700;border-radius:999px;padding:6px 16px;font-size:.95rem}
.lv-B .lvpill{background:var(--lvB)} .lv-I .lvpill{background:var(--lvI)} .lv-A .lvpill{background:var(--lvA)}
.lvhead p{margin:0;color:var(--deep)}
.part{border-left:0}
.part h3{font-size:1.2rem;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tasknum{background:var(--pale);color:var(--blue);font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 10px;border-radius:999px}
.part p{margin:.4em 0}
.part ul{margin:.3em 0 .6em;padding-left:1.3em}
pre.sample{background:var(--navy);color:#E6F0FB;font-family:var(--code);font-size:.92rem;padding:12px 16px;border-radius:10px;overflow-x:auto;margin:10px 0;line-height:1.45}
.steps{list-style:none;padding:0;margin:10px 0}
.steps li{margin:6px 0}
.steps label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.steps input{width:20px;height:20px;margin-top:3px;accent-color:var(--green);flex:none}
.steps input:checked + span{color:var(--mid);text-decoration:line-through}

.part.kind-ext, .part.kind-stretch{background:linear-gradient(#fff,#fff) padding-box;border:2px dashed var(--sky)}
.part.locked .pbody{display:none}
.lockrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lockrow p{margin:0;color:var(--deep)}
.lockrow[hidden]{display:none}

.hints{margin-top:12px}
.hintbtn{background:var(--amber-pale);border:1px solid var(--amber);color:var(--navy);border-radius:8px;padding:7px 14px;display:inline-flex;gap:8px;align-items:center;font-weight:600}
.hintbtn[disabled]{opacity:.55;cursor:default}
.hint{background:var(--amber-pale);border-radius:8px;padding:9px 14px;margin-top:8px;font-size:.95rem}
.hint b{color:#9A5B00}

.btn{border:0;border-radius:9px;padding:9px 18px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.btn.primary{background:var(--blue);color:#fff}
.btn.ghost{background:var(--pale);color:var(--deep)}
.btn.amber{background:var(--amber);color:var(--navy)}
.btn:focus-visible,.dot:focus-visible,.lvswitch button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* runner */
.runner{margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.rbar{display:flex;align-items:center;gap:6px;background:var(--pale);padding:7px 10px;flex-wrap:wrap}
.rbar .lbl{font-size:.8rem;font-weight:700;color:var(--mid);text-transform:uppercase;letter-spacing:.06em;margin-right:auto;padding-left:4px}
.rbar button{border:0;border-radius:7px;padding:6px 12px;font-size:.88rem;font-weight:600;display:inline-flex;gap:6px;align-items:center;background:#fff;color:var(--deep)}
.rbar button.run{background:var(--green);color:#fff}
.rbar button.stop{background:var(--red);color:#fff}
.rbar button[disabled]{opacity:.45;cursor:default}
.ed{display:grid;grid-template-columns:auto 1fr;font-family:var(--code);font-size:15px;line-height:22px;background:#fff}
.gut{background:#F6F9FD;color:#9AB3CF;text-align:right;padding:10px 8px 10px 10px;user-select:none;border-right:1px solid var(--line);min-width:38px}
.gut div{height:22px}
.gut div.err{background:var(--red);color:#fff;border-radius:4px;padding-right:4px}
.gut div.gap{background:var(--amber);color:var(--navy);border-radius:4px;padding-right:4px}
.ed textarea{border:0;outline:0;resize:none;font:inherit;line-height:22px;padding:10px 12px;white-space:pre;overflow-x:auto;overflow-y:hidden;color:var(--navy);background:#fff;tab-size:4;min-height:110px}
.ed textarea:focus{background:#FCFDFF}
.con{background:var(--navy);color:#E6F0FB;font-family:var(--code);font-size:14.5px;line-height:1.5;padding:10px 14px;min-height:56px;max-height:340px;overflow-y:auto}
.con pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit}
.con .typed{color:var(--amber);font-weight:700}
.con .muted{color:#8FAACA;font-style:italic}
.inrow{display:flex;align-items:center;gap:8px;margin-top:4px}
.inrow label{color:var(--amber);font-weight:700}
.inrow input{flex:1;font-family:var(--code);font-size:14.5px;border:2px solid var(--amber);border-radius:6px;padding:5px 8px;background:#14294A;color:#fff;outline:0}
.inrow small{color:#8FAACA;font-family:"Segoe UI",system-ui,sans-serif}
.msg{font-family:"Segoe UI",system-ui,sans-serif;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:.95rem;line-height:1.45}
.msg.error{background:var(--red-pale);color:#7A1F1A}
.msg.warn{background:var(--amber-pale);color:#6B4100}
.msg.ok{background:#E3F4EC;color:#1C5C42;padding:6px 12px}
.msg strong{display:block}
.msg code{background:rgba(255,255,255,.7)}

/* welcome */
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:34px 34px;margin-top:14px;display:flex;gap:28px;align-items:center}
.hero h1{font-size:2.5rem}
.hero p{color:#DCE9F7;margin:.6em 0 0;max-width:560px}
.hero svg.big{width:120px;height:120px;color:var(--amber);flex:none}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.how div{background:var(--pale);border-radius:12px;padding:16px}
.how b{display:flex;gap:8px;align-items:center;color:var(--deep)}
.how svg{color:var(--blue)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lvcard{border:3px solid transparent;background:#fff;border-radius:14px;padding:20px;text-align:left;box-shadow:0 1px 3px rgba(19,49,92,.12);display:flex;flex-direction:column;gap:8px;color:var(--navy)}
.lvcard .lvpill{align-self:flex-start}
.lvcard.lv-B .lvpill{background:var(--lvB)} .lvcard.lv-I .lvpill{background:var(--lvI)} .lvcard.lv-A .lvpill{background:var(--lvA)}
.lvcard[aria-pressed="true"]{border-color:var(--amber)}
.lvcard q{font-weight:700;font-size:1.05rem;quotes:none}
.lvcard span.d{font-size:.95rem;color:var(--deep)}

/* stage end */
.endcard{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.endcard .grow{flex:1;min-width:240px}
.endcard p{margin:0}
.done-msg{color:var(--green);font-weight:700}

/* finish */
table.prog{border-collapse:collapse;width:100%}
table.prog th,table.prog td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.prog td.c,table.prog th.c{text-align:center}
.tick{color:var(--green);font-weight:800}

/* bottom nav */
.navbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:10px 22px;z-index:20}
.navbar .where{color:var(--mid);font-size:.9rem}

.plan label{display:block;font-weight:600;margin:10px 0}
.plan input,.plan select{display:block;width:100%;font:inherit;font-weight:400;border:1px solid var(--line);border-radius:7px;padding:7px 9px;margin-top:4px;background:#fff;color:var(--navy)}
.plan table{width:100%;border-collapse:collapse;margin-top:12px}
.plan th{text-align:left;font-size:.85rem;color:var(--deep);padding:4px}
.plan td{padding:4px;vertical-align:top}.plan td input,.plan td select{margin:0}
.plan td.rn{font-weight:800;color:var(--blue);width:24px;padding-top:11px}
.plan th:nth-child(3){width:38%}
.saved{font-size:.85rem;color:var(--mid);margin:8px 0 0}
.gamecard{border:3px solid var(--amber)}
.myplan summary{cursor:pointer;font-weight:600;color:var(--blue);margin:6px 0}
.myplan ol{margin:6px 0;padding-left:1.4em}.muted2{color:var(--mid)}
@media (max-width:760px){
  .helpgrid,.how,.levels{grid-template-columns:1fr}
  .hero{flex-direction:column;align-items:flex-start}
  .stage-head{flex-direction:column;align-items:flex-start}
}
/* reference panel */
.refbtn{border:0;border-radius:999px;padding:6px 14px;font-size:.92rem;font-weight:600;display:inline-flex;gap:6px;align-items:center;background:var(--sky);color:var(--navy)}
.refbtn[aria-expanded="true"]{background:#fff}
.refbtn:focus-visible,.reflink:focus-visible,.chips button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.ref{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:#fff;z-index:40;box-shadow:-6px 0 24px rgba(11,31,58,.22);display:flex;flex-direction:column}
.ref[hidden]{display:none}
.refhead{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.refhead h2{font-size:1.15rem;margin-right:auto;display:flex;gap:8px;align-items:center}
.refhead h2 svg{color:var(--amber)}
.refhead button{border:0;background:var(--deep);color:#fff;border-radius:8px;padding:5px 12px;font-weight:600}
.refsearch{padding:12px 16px 4px}
.refsearch input{width:100%;font:inherit;border:2px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--navy)}
.refsearch input:focus{border-color:var(--blue);outline:0}
.reftip{font-size:.85rem;color:var(--mid);margin:6px 0 0}
#reflist{overflow-y:auto;padding:4px 16px 30px;flex:1}
#reflist h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mid);margin:16px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--amber);background:var(--amber-pale);color:var(--navy);border-radius:999px;padding:4px 12px;font-size:.88rem;font-weight:600}
.refcard{border:1px solid var(--line);border-radius:10px;margin:6px 0;background:#fff}
.refcard summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;flex-direction:column;gap:1px}
.refcard summary::-webkit-details-marker{display:none}
.refcard .rt{font-family:var(--code);font-weight:700;color:var(--blue)}
.refcard .rs{font-size:.88rem;color:var(--deep)}
.refcard[open]{border-color:var(--blue);box-shadow:0 0 0 2px rgba(31,111,178,.15)}
.refcard[open] summary{background:var(--pale);border-radius:9px 9px 0 0}
.rb{padding:4px 12px 12px;font-size:.95rem}
.rb p{margin:.45em 0}.rb ul{margin:.3em 0;padding-left:1.2em}
.rb pre.sample{font-size:.85rem;white-space:pre}
.watch{background:var(--amber-pale);border-radius:8px;padding:7px 10px}
.watch b{color:#9A5B00}
.rb .runner .rbar .copy{display:none}
.refnone{color:var(--deep)}
.reflink{margin-top:8px;border:1px solid currentColor;background:#fff;color:inherit;border-radius:7px;padding:4px 10px;font-size:.88rem;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.toast{z-index:50}
@media (min-width:1180px){ body.refopen main{margin-left:max(20px,calc((100vw - 440px - 1000px)/2));margin-right:440px} }
@media print{.top,.navbar,.dots,.rbar,.con,.ref,.refbtn{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M11.7 12H22M18 12v4M21 12v3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    Escape the Dungeon <small>Part 3: loot and legends</small></div>
  <button class="refbtn" id="refbtn" aria-expanded="false" aria-controls="ref" title="Look up print, input, if, loops and more. Tip: highlight a word in your code first."><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2zM4 20a2 2 0 0 0 2 2h13v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg> Look it up</button>
  <div class="lvswitch" role="group" aria-label="Choose your level"><span>My level</span>
    <button data-lv="B">Beginner</button><button data-lv="I">Intermediate</button><button data-lv="A">Advanced</button></div>
  <div class="filebar" role="group" aria-label="Save or load your progress">
    <button class="savebtn" id="savefile" title="Download your progress as a file">Save progress</button>
    <button id="loadfile" title="Open a progress file you saved earlier">Load progress</button>
    <input type="file" id="loadinput" accept=".json,application/json" hidden></div>
</header>
<aside class="ref" id="ref" hidden aria-label="Python reference">
  <div class="refhead"><h2><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2zM4 20a2 2 0 0 0 2 2h13v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg> Look it up</h2><button id="refclose">Close</button></div>
  <div class="refsearch"><input type="search" id="refq" placeholder="Search: print, loop, list, error..." aria-label="Search the reference" autocomplete="off" spellcheck="false">
    <p class="reftip">Tip: highlight a word in your code, then press Look it up.</p></div>
  <div id="reflist"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<nav class="dots" id="dots" aria-label="Stages"></nav>
<main id="page"></main>
<footer class="navbar">
  <button class="btn ghost" id="prev">&larr; Back</button>
  <span class="where" id="where"></span>
  <button class="btn primary" id="next">Next &rarr;</button>
</footer>

<script>
const STAGES = [{"id": "q1", "num": 1, "concept": "procedures with parameters", "title": "Show your stats", "hook": "Your hero has health and gold, but the player can't see them. Let's build a status box you can show from anywhere.", "learnHtml": "\u003cp>In Part 2, parameters went into \u003cstrong>functions\u003c/strong> that sent a value back with \u003ccode>return\u003c/code>. A \u003cstrong>procedure\u003c/strong> can take parameters too. It uses the values, but sends nothing back.\u003c/p>\n\u003cp>You can pass in more than one value. Separate them with commas. The values go in \u003cstrong>in order\u003c/strong>: the first value in the call goes into the first parameter, the second into the second.\u003c/p>\n\u003cp>The value you pass in when you call a subroutine is called an \u003cstrong>argument\u003c/strong>.\u003c/p>", "learnCode": "def show_status(health, gold):\n    print(\"~\" * 20)\n    print(\"Health:\", health)\n    print(\"Gold:\", gold)\n    print(\"~\" * 20)\n\ndef trap_room(health):\n    print(\"A dart flies out of the wall!\")\n    health = health - 15\n    return health\n\nhealth = 100\ngold = 25\nshow_status(health, gold)\nhealth = trap_room(health)\nshow_status(health, gold)", "keywords": [["parameter", "a name in the brackets of a def that receives a value"], ["argument", "the actual value you pass in when you call a subroutine"], ["procedure", "a subroutine that does a job but doesn't return a value"]], "mistakes": ["Arguments in the wrong order: \u003ccode>show_status(gold, health)\u003c/code> shows your gold as health. Python won't warn you.", "The wrong number of arguments. If the def has two parameters, the call needs two values.", "Trying to catch a value from a procedure. It doesn't return anything, so there's nothing to catch."], "game": {"B": "Add a \u003ccode>show_status(health)\u003c/code> procedure to your adventure, and call it after every room that changes the health.", "I": "Add \u003ccode>show_status(health, gold)\u003c/code> and call it after every room that changes health or gold.", "A": "Add a status display with a health bar, and show it every time the player arrives somewhere new."}, "levels": {"B": {"intro": "Small steps, with help whenever you need it.", "parts": [{"id": "q1b1", "kind": "step", "title": "Run the example", "html": "\u003cp>Run the example in the Learn box. Then swap \u003ccode>health\u003c/code> and \u003ccode>gold\u003c/code> round in the \u003cstrong>first\u003c/strong> call, so it says \u003ccode>show_status(gold, health)\u003c/code>. Run it again. What went wrong? Swap them back.\u003c/p>", "steps": ["I saw the status box twice", "Health went from 100 to 85", "I swapped the arguments and saw gold shown as health", "I swapped them back"]}, {"id": "q1b2", "kind": "main", "title": "Fill the gaps: the welcome sign", "html": "\u003cp>Gap 1: inside the procedure, the player's name is called \u003ccode>name\u003c/code>. Gap 2: the main program stores the name in \u003ccode>hero\u003c/code>, so pass that in.\u003c/p>", "starter": "def welcome(name):\n    print(\"Welcome to the dungeon,\", ___)\n    print(\"Good luck,\", name)\n\nhero = input(\"What is your name? \")\nwelcome(___)", "hints": ["Inside the procedure, use the parameter's name: name", "The call passes in the variable from the main program: welcome(hero)"]}, {"id": "q1b3", "kind": "main", "title": "Your turn: the status box", "html": "\u003cp>Write \u003ccode>show_status(health, gold)\u003c/code> above the main program. It should print the health and the gold. The main program is already written. When it works, you should see two status boxes: 100 and 10, then 60 and 35.\u003c/p>", "steps": ["def show_status(health, gold): with a colon", "A print line for health and one for gold, indented", "I ran it and saw both boxes"], "starter": "# Write show_status(health, gold) here\n\n\n# main program\nhealth = 100\ngold = 10\nshow_status(health, gold)\nhealth = 60\ngold = 35\nshow_status(health, gold)\n", "hints": ["Copy the shape of show_status in the Learn box.", "def show_status(health, gold):\n    print(\"Health:\", health)\n    print(\"Gold:\", gold)"]}]}, "I": {"intro": "A short brief. Use the hints only if you need them.", "parts": [{"id": "q1i1", "kind": "main", "title": "The hero card", "html": "\u003cp>Write \u003ccode>show_hero(name, health, gold)\u003c/code>, which prints a card like the one below. Also write \u003ccode>trap_room(health)\u003c/code>, which takes 25 health and returns it. The main program asks for the hero's name, starts with 100 health and 20 gold, shows the card, visits the trap, then shows the card again.\u003c/p>\n\u003cpre class=\"sample\">== Ash ==\nHealth: 100\nGold: 20\u003c/pre>", "starter": "# show_hero(name, health, gold): print the card\n\n# trap_room(health): take 25, return health\n\n# main program\n", "hints": ["Three parameters, separated by commas. The call must give three values in the same order.", "print(\"==\", name, \"==\") prints the top line."]}, {"id": "q1i2", "kind": "ext", "title": "Extension: a divider of any size", "html": "\u003cp>In Part 2 you may have made \u003ccode>divider()\u003c/code>. Now make it better: \u003ccode>divider(length, symbol)\u003c/code> prints \u003ccode>symbol\u003c/code> repeated \u003ccode>length\u003c/code> times. Call it as \u003ccode>divider(30, \"~\")\u003c/code> and \u003ccode>divider(10, \"*\")\u003c/code>. Why is one procedure with parameters better than writing two procedures?\u003c/p>", "starter": "", "hints": ["print(symbol * length)", "The call divider(30, \"~\") puts 30 into length and \"~\" into symbol."]}]}, "A": {"intro": "A specification only. Work it out, then try the stretch.", "parts": [{"id": "q1a1", "kind": "main", "title": "The health bar", "html": "\u003cp>Write \u003ccode>show_bar(health)\u003c/code>. It prints a bar with one \u003ccode>#\u003c/code> for every 10 health (rounded down) and a \u003ccode>-\u003c/code> for each missing 10, out of 100, then the number. Health below 0 should show as an empty bar and 0.\u003c/p>\n\u003cpre class=\"sample\">Health [#######---] 70\nHealth [####------] 45\nHealth [----------] 0\u003c/pre>\n\u003cp>Test it with 100, 70, 45, 5, 0 and -20.\u003c/p>", "starter": "", "hints": ["health // 10 gives the number of #. 10 minus that gives the number of -.", "Before working anything out, if health \u003c 0, set health to 0."]}, {"id": "q1a2", "kind": "stretch", "title": "Stretch: default values", "html": "\u003cp>Not every hero has 100 maximum health. Change the def to \u003ccode>def show_bar(health, max_health=100):\u003c/code>. Now \u003ccode>show_bar(45)\u003c/code> still works, but \u003ccode>show_bar(45, 60)\u003c/code> draws a bar out of 60. The bar should still be 10 characters long. Add a comment explaining what \u003ccode>=100\u003c/code> does in the def.\u003c/p>", "starter": "", "hints": ["The number of # is health * 10 // max_health.", "A parameter with a default value is optional in the call."]}]}}}, {"id": "q2", "num": 2, "concept": "the random module", "title": "Roll the dice", "hook": "If a trap always does 20 damage, the game is the same every time. Let's add some luck.", "learnHtml": "\u003cp>Python has extra tools stored in \u003cstrong>modules\u003c/strong>. To use one, \u003ccode>import\u003c/code> it once, at the very top of your program: \u003ccode>import random\u003c/code>\u003c/p>\n\u003cul>\u003cli>\u003ccode>random.randint(1, 6)\u003c/code> gives a random whole number from 1 to 6. Unlike \u003ccode>range\u003c/code>, it \u003cstrong>includes\u003c/strong> both numbers.\u003c/li>\n\u003cli>\u003ccode>random.choice([\"rat\", \"bat\", \"spider\"])\u003c/code> picks one of the options. The square brackets hold a \u003cstrong>list\u003c/strong>. More on lists in Stage 3.\u003c/li>\u003c/ul>\n\u003cp>Run the example a few times. You get a different result each time.\u003c/p>", "learnCode": "import random\n\ndef monster():\n    beast = random.choice([\"rat\", \"bat\", \"giant spider\"])\n    print(\"A\", beast, \"blocks your path!\")\n\ndef trap_room(health):\n    damage = random.randint(10, 30)\n    print(\"A trapdoor opens! You lose\", damage, \"health.\")\n    health = health - damage\n    return health\n\nhealth = 100\nmonster()\nhealth = trap_room(health)\nprint(\"Health:\", health)", "keywords": [["module", "a collection of extra tools you can import into your program"], ["import", "loads a module so you can use it"], ["random.randint(a, b)", "a random whole number from a to b, including both"], ["random.choice(list)", "picks one item from a list at random"]], "mistakes": ["Forgetting \u003ccode>import random\u003c/code> at the top. Python says it doesn't know what \u003ccode>random\u003c/code> is.", "Writing \u003ccode>random.randint(1-6)\u003c/code>. It needs two numbers separated by a comma.", "Picking the random number once, before a loop, so it's the same number every time round. Pick it inside the loop.", "Testing only once. Random code needs running several times."], "game": {"B": "Add \u003ccode>import random\u003c/code> at the top of your adventure, and make your trap do a random amount of damage.", "I": "Make your traps do random damage and your treasure give random gold.", "A": "Add a random encounter to at least one room, so no two games play the same."}, "levels": {"B": {"intro": "Small steps, with help whenever you need it.", "parts": [{"id": "q2b1", "kind": "step", "title": "Run the example", "html": "\u003cp>Run the example in the Learn box \u003cstrong>three times\u003c/strong>. Then change the damage to \u003ccode>random.randint(1, 100)\u003c/code> and run it a few more times.\u003c/p>", "steps": ["I ran it three times and got different monsters", "The damage changed each time", "I changed it to 1 to 100 and saw some huge hits"]}, {"id": "q2b2", "kind": "main", "title": "Fill the gaps: the dice", "html": "\u003cp>Make an ordinary dice: a random number from 1 to 6. Run it until you roll a 6.\u003c/p>", "starter": "import random\n\nroll = random.randint(___, ___)\nprint(\"You rolled a\", roll)\nif roll == 6:\n    print(\"A critical hit!\")", "hints": ["The smallest number on a dice, then the biggest.", "random.randint(1, 6)"]}, {"id": "q2b3", "kind": "main", "title": "Your turn: random treasure", "html": "\u003cp>The chest should give a random amount of gold, from 5 to 20. Replace the \u003ccode>___\u003c/code> so \u003ccode>coins\u003c/code> is a random number. Run it a few times.\u003c/p>", "starter": "import random\n\ndef treasure_room(gold):\n    coins = ___\n    print(\"You find\", coins, \"gold coins!\")\n    gold = gold + coins\n    return gold\n\ngold = 0\ngold = treasure_room(gold)\nprint(\"Gold:\", gold)", "hints": ["You need random.randint with two numbers in the brackets.", "coins = random.randint(5, 20)"]}]}, "I": {"intro": "A short brief. Use the hints only if you need them.", "parts": [{"id": "q2i1", "kind": "main", "title": "Lucky or not", "html": "\u003cp>Write \u003ccode>trap_room(health)\u003c/code>. Roll a number from 1 to 4. On a 1, the player dodges and takes no damage. Otherwise they lose a random 5 to 25 health. Print what happens and return health. The main program starts on 100 health, visits the trap 3 times, then prints the health. Run it several times.\u003c/p>", "starter": "import random\n\n# trap_room(health): 1 in 4 chance to dodge, otherwise lose 5 to 25\n\n# main program\n", "hints": ["dodge = random.randint(1, 4) then if dodge == 1:", "Put return health at the end, outside the if/else."]}, {"id": "q2i2", "kind": "ext", "title": "Extension: random monsters", "html": "\u003cp>Write \u003ccode>encounter(health)\u003c/code>. It picks a random monster from a list of four with \u003ccode>random.choice\u003c/code>, then the fight costs a random 5 to 15 health. Print the monster's name and the damage, and return health. Call it three times.\u003c/p>", "starter": "", "hints": ["beast = random.choice([\"rat\", \"bat\", \"ghoul\", \"slime\"])", "The damage is a second random number, picked after the monster."]}]}, "A": {"intro": "A specification only. Work it out, then try the stretch.", "parts": [{"id": "q2a1", "kind": "main", "title": "The goblin fight, with real dice", "html": "\u003cp>Write \u003ccode>fight(health)\u003c/code>. A goblin starts with 30 health. Each round, the player chooses \u003ccode>attack\u003c/code> or \u003ccode>defend\u003c/code>. Attack hits the goblin for a random 5 to 15. Then, if the goblin is still standing, it hits back for a random 4 to 12, but defending halves that (use \u003ccode>//\u003c/code>). Print every hit. The fight ends when either health reaches 0 or less. Return the player's health.\u003c/p>", "starter": "import random\n", "hints": ["while health > 0 and goblin > 0:", "Roll the goblin's damage first, then halve it if the player defended."]}, {"id": "q2a2", "kind": "stretch", "title": "Stretch: loaded dice for testing", "html": "\u003cp>Random code is hard to test, because it changes every time. Add \u003ccode>random.seed(1)\u003c/code> on the line after \u003ccode>import random\u003c/code> and run your fight twice with the same choices. What do you notice? Add a comment explaining why a tester might do this, and why you must take it out before release.\u003c/p>", "starter": "", "hints": ["A seed is the starting point for the random numbers.", "Same seed, same choices: same numbers, every time."]}]}}}, {"id": "q3", "num": 3, "concept": "lists", "title": "The backpack", "hook": "Keys, rope, potions. Your hero needs somewhere to keep things, and one variable for each item won't do.", "learnHtml": "\u003cp>A \u003cstrong>list\u003c/strong> stores lots of values in one variable. Lists use square brackets: \u003ccode>inventory = [\"torch\", \"rope\"]\u003c/code>. An empty list is \u003ccode>[]\u003c/code>.\u003c/p>\n\u003cul>\u003cli>\u003ccode>inventory.append(\"key\")\u003c/code> adds an item to the end.\u003c/li>\n\u003cli>\u003ccode>len(inventory)\u003c/code> counts the items.\u003c/li>\n\u003cli>\u003ccode>for item in inventory:\u003c/code> runs once for each item.\u003c/li>\u003c/ul>\n\u003cp>We keep our rule from Part 2: the inventory goes \u003cstrong>in\u003c/strong>, and comes back \u003cstrong>out\u003c/strong>: \u003ccode>inventory = pick_up(inventory, \"rope\")\u003c/code>\u003c/p>", "learnCode": "def pick_up(inventory, item):\n    print(\"You pick up the\", item)\n    inventory.append(item)\n    return inventory\n\ndef show_bag(inventory):\n    print(\"Your bag holds\", len(inventory), \"items:\")\n    for item in inventory:\n        print(\"-\", item)\n\ninventory = [\"torch\"]\ninventory = pick_up(inventory, \"rope\")\ninventory = pick_up(inventory, \"silver key\")\nshow_bag(inventory)", "keywords": [["list", "one variable that stores many values, in square brackets"], ["append", "adds an item to the end of a list"], ["len()", "counts how many items are in a list"], ["index", "an item's position in a list; the first is 0"]], "mistakes": ["Writing \u003ccode>inventory = []\u003c/code> inside a room. That empties the bag every time the player walks in. Create the list once, in the main program.", "Writing \u003ccode>inventory = inventory.append(\"key\")\u003c/code>. append changes the list but gives back nothing, so the whole bag is lost. Just write \u003ccode>inventory.append(\"key\")\u003c/code>", "Forgetting the quote marks around an item's name.", "Expecting the first item to be at position 1. It's at position 0."], "game": {"B": "Add \u003ccode>inventory = []\u003c/code> to your main program, and make one room put an item in the bag.", "I": "Add an inventory. At least two rooms pick something up, and the bag is shown at the end.", "A": "Add chests with random loot that goes into the inventory."}, "levels": {"B": {"intro": "Small steps, with help whenever you need it.", "parts": [{"id": "q3b1", "kind": "step", "title": "Run the example", "html": "\u003cp>Run the example. Then add one more line before \u003ccode>show_bag(inventory)\u003c/code> so the hero also picks up an \u003ccode>\"apple\"\u003c/code>. Run it again.\u003c/p>", "steps": ["I saw 3 items in the bag", "I added the apple", "Now the bag holds 4 items"]}, {"id": "q3b2", "kind": "main", "title": "Fill the gaps: pack the bag", "html": "\u003cp>Gap 1 adds the map to the end of the list. Gap 2 counts the items. Gap 3 is the list to loop through. It should say there are 3 items, then list them.\u003c/p>", "starter": "bag = [\"torch\", \"bread\"]\nbag.___(\"map\")\nprint(\"You have\", ___(bag), \"items:\")\nfor item in ___:\n    print(item)", "hints": ["Gap 1 adds to the end of a list: append", "Gap 2 counts: len. Gap 3 is the name of the list: bag"]}, {"id": "q3b3", "kind": "main", "title": "Your turn: the armoury", "html": "\u003cp>Replace the three \u003ccode>___\u003c/code> lines. The armoury adds a \u003ccode>\"sword\"\u003c/code> and a \u003ccode>\"shield\"\u003c/code> to the inventory, then returns it. When it works it should print:\u003c/p>\n\u003cpre class=\"sample\">Weapons hang on the walls.\n['torch', 'sword', 'shield']\u003c/pre>", "starter": "def armoury(inventory):\n    print(\"Weapons hang on the walls.\")\n    ___\n    ___\n    ___\n\ninventory = [\"torch\"]\ninventory = armoury(inventory)\nprint(inventory)", "hints": ["Two lines use inventory.append(...), one for each item.", "The last line sends the list back: return inventory"]}]}, "I": {"intro": "A short brief. Use the hints only if you need them.", "parts": [{"id": "q3i1", "kind": "main", "title": "Pick up and show", "html": "\u003cp>Write \u003ccode>pick_up(inventory, item)\u003c/code>, which adds the item and returns the inventory. Write \u003ccode>show_bag(inventory)\u003c/code>, which prints a numbered list like the one below, or \u003ccode>Your bag is empty.\u003c/code> if there's nothing in it. The main program starts with an empty bag, shows it, picks up two items, then shows it again.\u003c/p>\n\u003cpre class=\"sample\">Your bag is empty.\n1. rope\n2. lantern\u003c/pre>", "starter": "# pick_up(inventory, item)\n\n# show_bag(inventory)\n\n# main program\n", "hints": ["if len(inventory) == 0: tells you the bag is empty.", "Keep a counter: number = 1 before the loop, add 1 to it inside the loop."]}, {"id": "q3i2", "kind": "ext", "title": "Extension: the bag is full", "html": "\u003cp>The bag only holds 4 things. Change \u003ccode>pick_up\u003c/code> so that if there are already 4 items, it prints \u003ccode>Your bag is full!\u003c/code> and doesn't add the item. Test it by picking up 5 things.\u003c/p>", "starter": "", "hints": ["if len(inventory) >= 4:", "Return the inventory either way, at the end, outside the if/else."]}]}, "A": {"intro": "A specification only. Work it out, then try the stretch.", "parts": [{"id": "q3a1", "kind": "main", "title": "The treasure hall", "html": "\u003cp>Write \u003ccode>chest(inventory, gold)\u003c/code>. It picks random loot from \u003ccode>[\"gold\", \"potion\", \"key\", \"nothing\"]\u003c/code>. Gold adds a random 5 to 20 to \u003ccode>gold\u003c/code>. Nothing prints a sad message. Anything else is added to the inventory. Return both: \u003ccode>inventory, gold = chest(inventory, gold)\u003c/code>\u003c/p>\n\u003cp>The main program opens 5 chests, then prints the gold and the bag.\u003c/p>", "starter": "import random\n", "hints": ["loot = random.choice([...]) then if / elif / else.", "Return them in the same order you catch them: return inventory, gold"]}, {"id": "q3a2", "kind": "stretch", "title": "Stretch: count the loot", "html": "\u003cp>A bag like \u003ccode>[\"potion\", \"key\", \"potion\"]\u003c/code> looks messy. Write \u003ccode>show_bag(inventory)\u003c/code> so it prints each item \u003cstrong>once\u003c/strong>, with how many there are: \u003ccode>potion x2\u003c/code>, \u003ccode>key x1\u003c/code>. Look up what \u003ccode>inventory.count(\"potion\")\u003c/code> does.\u003c/p>", "starter": "", "hints": ["Keep a second list of items you've already printed.", "Before printing an item, check it isn't in that list already."]}]}}}, {"id": "q4", "num": 4, "concept": "in, not in and remove", "title": "Locked doors", "hook": "Items are no use sitting in a bag. Time to make keys open doors, and to use things up.", "learnHtml": "\u003cp>\u003ccode>in\u003c/code> checks whether something is in a list. It gives \u003ccode>True\u003c/code> or \u003ccode>False\u003c/code>, so it works in an \u003ccode>if\u003c/code>: \u003ccode>if \"key\" in inventory:\u003c/code>\u003c/p>\n\u003cp>\u003ccode>not in\u003c/code> checks the opposite: \u003ccode>if \"key\" not in inventory:\u003c/code>\u003c/p>\n\u003cp>\u003ccode>inventory.remove(\"key\")\u003c/code> takes an item out of the list. Only remove something you've checked is there. If it isn't, Python stops with an error.\u003c/p>", "learnCode": "def locked_door(inventory):\n    print(\"A heavy iron door blocks the way.\")\n    if \"key\" in inventory:\n        print(\"You turn the key. The door swings open!\")\n        inventory.remove(\"key\")\n    else:\n        print(\"It's locked. You need a key.\")\n    return inventory\n\ninventory = [\"torch\"]\ninventory = locked_door(inventory)\ninventory.append(\"key\")\ninventory = locked_door(inventory)\nprint(\"Bag:\", inventory)", "keywords": [["in", "checks whether a value is in a list; gives True or False"], ["not in", "checks that a value is not in a list"], ["remove", "takes the first matching item out of a list"]], "mistakes": ["Removing an item that isn't there. Check with \u003ccode>in\u003c/code> first.", "Different spelling or capitals: \u003ccode>\"Key\"\u003c/code> and \u003ccode>\"key\"\u003c/code> are different items.", "Removing inside a loop that goes through the same list. Python skips items. Loop through the list, or change it, but not both at once."], "game": {"B": "Add a locked door that needs an item from another room. Make sure the player can find the item first.", "I": "Add at least one door that needs an item, and one item that gets used up when it's used.", "A": "Add potions that get used up to restore health, and a door that leads somewhere different depending on what you carry."}, "levels": {"B": {"intro": "Small steps, with help whenever you need it.", "parts": [{"id": "q4b1", "kind": "step", "title": "Run the example", "html": "\u003cp>Run the example. The door is locked the first time and opens the second time. Then change \u003ccode>inventory.append(\"key\")\u003c/code> to \u003ccode>inventory.append(\"Key\")\u003c/code> with a capital K. Run it. Why does the door stay locked? Change it back.\u003c/p>", "steps": ["The door opened the second time", "The key disappeared from the bag after it was used", "With a capital K the door stayed locked", "I changed it back"]}, {"id": "q4b2", "kind": "main", "title": "Fill the gaps: the broken bridge", "html": "\u003cp>Gap 1 checks whether the item is in the list. Gap 2 is the item the player needs: \u003ccode>\"rope\"\u003c/code>. The player has a rope, so they should get across.\u003c/p>", "starter": "def bridge(inventory):\n    print(\"The rope bridge has snapped.\")\n    if \"rope\" ___ inventory:\n        print(\"You tie your rope across and climb over.\")\n    else:\n        print(\"You'll have to find another way.\")\n    return inventory\n\ninventory = [\"torch\", ___]\ninventory = bridge(inventory)", "hints": ["The word that checks a list is: in", "Gap 2 needs quote marks: \"rope\""]}, {"id": "q4b3", "kind": "main", "title": "Your turn: the hungry troll", "html": "\u003cp>A troll blocks the path. If the player has \u003ccode>\"bread\"\u003c/code>, they give it to the troll (remove it from the bag) and the troll lets them pass. If not, the troll roars and they have to turn back. The main program tests it twice: once with bread and once without.\u003c/p>", "steps": ["if \"bread\" in inventory:", "remove the bread inside the if", "an else for when there's no bread", "return inventory at the end"], "starter": "def troll(inventory):\n    print(\"A huge troll blocks the path.\")\n    # if the bread is in the inventory: remove it and let them pass\n    # else: the troll roars\n\n    return inventory\n\ninventory = [\"torch\", \"bread\"]\ninventory = troll(inventory)\nprint(\"Bag:\", inventory)\ninventory = troll(inventory)", "hints": ["Copy the shape of locked_door in the Learn box.", "inventory.remove(\"bread\") goes inside the if, indented."]}]}, "I": {"intro": "A short brief. Use the hints only if you need them.", "parts": [{"id": "q4i1", "kind": "main", "title": "The cell and the door", "html": "\u003cp>Write \u003ccode>cell(inventory)\u003c/code>: the player finds a key there, but only if they don't already have one. Write \u003ccode>door(inventory)\u003c/code>: it opens if the player has the key, and uses the key up. The main program starts with an empty bag and tries the door, visits the cell, then tries the door again.\u003c/p>", "starter": "# cell(inventory): add a key if there isn't one already\n\n# door(inventory): open if there's a key, and use it up\n\n# main program\n", "hints": ["In the cell: if \"key\" not in inventory:", "Both functions take the inventory in and return it."]}, {"id": "q4i2", "kind": "ext", "title": "Extension: use an item", "html": "\u003cp>Write \u003ccode>use_item(inventory)\u003c/code>. It asks the player what they want to use. If they have it, it prints \u003ccode>You use the ...\u003c/code> and removes it. If not, it prints \u003ccode>You don't have that.\u003c/code> Return the inventory. Test it with an item you have and one you don't.\u003c/p>", "starter": "", "hints": ["thing = input(\"What do you want to use? \").lower()", "if thing in inventory: ... else: ..."]}]}, "A": {"intro": "A specification only. Work it out, then try the stretch.", "parts": [{"id": "q4a1", "kind": "main", "title": "Potions: two in, two out", "html": "\u003cp>Write \u003ccode>drink(inventory, health)\u003c/code>. If the player has a \u003ccode>\"potion\"\u003c/code>, use it up and add 30 health, but never go above 100. If not, say so. Return both: \u003ccode>inventory, health = drink(inventory, health)\u003c/code>\u003c/p>\n\u003cp>Test it with: 2 potions and 50 health, drinking 3 times. You should end with 100 health and no potions.\u003c/p>", "starter": "", "hints": ["After adding 30: if health > 100: health = 100", "Remember: return them in the same order you catch them."]}, {"id": "q4a2", "kind": "stretch", "title": "Stretch: why do lists change without return?", "html": "\u003cp>Run this. Then add a comment explaining why the list changed even though \u003ccode>add_item\u003c/code> has no \u003ccode>return\u003c/code>, but the health didn't change. Which style is clearer for someone reading your game: returning the list, or not? Say why.\u003c/p>", "starter": "def add_item(inventory):\n    inventory.append(\"gem\")\n\ndef heal(health):\n    health = health + 50\n\ninventory = []\nhealth = 10\nadd_item(inventory)\nheal(health)\nprint(inventory, health)", "hints": ["The list inside the function and the list outside are the same list, not a copy.", "health = health + 50 makes a new value inside the function. The one outside is untouched."]}]}}}, {"id": "q5", "num": 5, "concept": "reusable functions and validation", "title": "Write it once, use it everywhere", "hook": "Players type nonsense. Instead of fixing every question in every room, let's fix it once.", "learnHtml": "\u003cp>Your rooms keep asking questions, and players keep typing things you didn't expect. You could put a \u003ccode>while\u003c/code> loop around every \u003ccode>input\u003c/code>, but that's a lot of copying.\u003c/p>\n\u003cp>Instead, write one function, \u003ccode>ask(question, options)\u003c/code>, that keeps asking until the answer is one of the options, then returns it. Write it once, and every room can use it. Checking that input makes sense is called \u003cstrong>validation\u003c/strong>.\u003c/p>\n\u003cp>It takes \u003cstrong>two values in\u003c/strong> (the question and a list of options) and sends \u003cstrong>one back\u003c/strong> (the answer).\u003c/p>", "learnCode": "def ask(question, options):\n    answer = input(question).strip().lower()\n    while answer not in options:\n        print(\"Please type one of:\", options)\n        answer = input(question).strip().lower()\n    return answer\n\ndef fork():\n    way = ask(\"Left or right? \", [\"left\", \"right\"])\n    print(\"You go\", way)\n\ndef chest():\n    choice = ask(\"Open the chest? \", [\"yes\", \"no\"])\n    if choice == \"yes\":\n        print(\"It's full of cobwebs.\")\n    else:\n        print(\"You leave it shut.\")\n\nfork()\nchest()", "keywords": [["validation", "checking that input is sensible before using it"], ["reusable", "written once and used in many places"], ["not in", "True when a value is not in a list"]], "mistakes": ["Not catching the answer: \u003ccode>ask(\"Left or right? \", [\"left\", \"right\"])\u003c/code> on its own throws the answer away. Write \u003ccode>way = ask(...)\u003c/code>", "Options with capital letters. The answer is made lower case, so \u003ccode>\"Left\"\u003c/code> in the options can never match.", "Forgetting to ask again inside the loop. The answer never changes, so the loop never ends."], "game": {"B": "Copy \u003ccode>ask()\u003c/code> into your adventure and use it for at least two questions.", "I": "Use \u003ccode>ask()\u003c/code> for every question in your adventure, so nothing the player types can break it.", "A": "Every input goes through \u003ccode>ask()\u003c/code> or \u003ccode>ask_number()\u003c/code>, including first-letter shortcuts."}, "levels": {"B": {"intro": "Small steps, with help whenever you need it.", "parts": [{"id": "q5b1", "kind": "step", "title": "Run the example", "html": "\u003cp>Run the example. When it asks \u003ccode>Left or right?\u003c/code>, type \u003ccode>banana\u003c/code> first. Then type \u003ccode>LEFT\u003c/code> in capitals. Try something silly for the chest too.\u003c/p>", "steps": ["banana was refused and it asked again", "LEFT in capitals was accepted", "Both rooms used the same ask function"]}, {"id": "q5b2", "kind": "main", "title": "Fill the gaps: the door", "html": "\u003cp>Gap 1: \u003ccode>ask\u003c/code> must send the answer back. Gaps 2 and 3: the two options for the door, \u003ccode>\"yes\"\u003c/code> and \u003ccode>\"no\"\u003c/code>, in quote marks. Test it with a silly answer first.\u003c/p>", "starter": "def ask(question, options):\n    answer = input(question).strip().lower()\n    while answer not in options:\n        print(\"Please type one of:\", options)\n        answer = input(question).strip().lower()\n    return ___\n\nchoice = ask(\"Open the door? \", [___, ___])\nif choice == \"yes\":\n    print(\"The door creaks open.\")\nelse:\n    print(\"You walk away.\")", "hints": ["The variable holding the player's answer is called answer.", "[\"yes\", \"no\"]"]}, {"id": "q5b3", "kind": "main", "title": "Your turn: use it twice", "html": "\u003cp>\u003ccode>ask\u003c/code> is already written for you. Finish the two rooms. Each one should use \u003ccode>ask\u003c/code> once and then do something different depending on the answer.\u003c/p>", "steps": ["The well asks up or down, using ask", "The statue asks touch or leave, using ask", "Each room uses if and else on the answer"], "starter": "def ask(question, options):\n    answer = input(question).strip().lower()\n    while answer not in options:\n        print(\"Please type one of:\", options)\n        answer = input(question).strip().lower()\n    return answer\n\ndef well():\n    print(\"You find an old well with a bucket on a rope.\")\n    # use ask: \"up\" or \"down\"\n\ndef statue():\n    print(\"A stone statue stares at you.\")\n    # use ask: \"touch\" or \"leave\"\n\nwell()\nstatue()", "hints": ["way = ask(\"Climb up or down? \", [\"up\", \"down\"])", "Then if way == \"down\": ... else: ..."]}]}, "I": {"intro": "A short brief. Use the hints only if you need them.", "parts": [{"id": "q5i1", "kind": "main", "title": "Write ask yourself", "html": "\u003cp>Write \u003ccode>ask(question, options)\u003c/code> from memory, without looking at the Learn box. It should accept answers in any case and with extra spaces. Then write three short rooms that each use it with different options, and call them.\u003c/p>", "starter": "# ask(question, options)\n\n# three rooms that use ask\n\n# main program\n", "hints": [".strip().lower() on the input makes it forgiving.", "Ask once before the while loop, and again at the end of the loop."]}, {"id": "q5i2", "kind": "ext", "title": "Extension: ask for a number", "html": "\u003cp>Write \u003ccode>ask_number(question, low, high)\u003c/code>. It keeps asking until the player types a whole number from \u003ccode>low\u003c/code> to \u003ccode>high\u003c/code>, then returns it as an integer. Three values in, one out. Use it for a shop: \u003ccode>potions = ask_number(\"How many potions? \", 0, 5)\u003c/code>\u003c/p>", "starter": "", "hints": ["text.isdigit() is True if text is all digits. Only use int() once you know it's safe.", "You need two checks: is it a number, and is it in range?"]}]}, "A": {"intro": "A specification only. Work it out, then try the stretch.", "parts": [{"id": "q5a1", "kind": "main", "title": "ask with shortcuts", "html": "\u003cp>Write \u003ccode>ask(question, options)\u003c/code> so it also accepts the \u003cstrong>first letter\u003c/strong> of an option: typing \u003ccode>l\u003c/code> for \u003ccode>[\"left\", \"right\"]\u003c/code> returns \u003ccode>\"left\"\u003c/code>. It must still return the full word. Answers in any case and with spaces should work. Test it with full words, letters, and rubbish.\u003c/p>", "starter": "", "hints": ["Loop through the options. For each one, check whether the answer equals it, or equals option[0].", "Return from inside the for loop as soon as you find a match. If nothing matches, ask again."]}, {"id": "q5a2", "kind": "stretch", "title": "Stretch: ask_number, properly", "html": "\u003cp>Write \u003ccode>ask_number(question, low, high)\u003c/code>. It must cope with blanks, words, decimals, negative numbers and numbers out of range, without ever crashing. Then write a test plan as comments: at least one normal, one boundary and one erroneous test, with the expected result for each. Run every test.\u003c/p>", "starter": "", "hints": ["isdigit() is False for \"-3\" and \"2.5\", which is what you want here.", "Boundary tests sit right on the edge: low and high themselves."]}]}}}, {"id": "q6", "num": 6, "concept": "putting it all together and testing", "title": "The boss room", "hook": "Every adventure needs a final challenge. Build a boss that uses everything from Part 3, then test it until it can't break.", "learnHtml": "\u003cp>A boss room brings it all together: \u003cstrong>parameters\u003c/strong> to pass in health and the bag, \u003cstrong>random\u003c/strong> damage, \u003cstrong>in\u003c/strong> to check for a useful item, \u003cstrong>ask\u003c/strong> for the player's moves, and \u003cstrong>return\u003c/strong> to send the health back.\u003c/p>\n\u003cp>Random code is harder to test, because it changes every time. Run it lots of times, and test every choice and every item. A \u003cstrong>test table\u003c/strong> lists each test, what you typed and what should happen.\u003c/p>", "learnCode": "import random\n\ndef ask(question, options):\n    answer = input(question).strip().lower()\n    while answer not in options:\n        print(\"Please type one of:\", options)\n        answer = input(question).strip().lower()\n    return answer\n\ndef dragon(health, inventory):\n    dragon_hp = 50\n    print(\"A dragon wakes up!\")\n    while health > 0 and dragon_hp > 0:\n        move = ask(\"Attack or shield? \", [\"attack\", \"shield\"])\n        if move == \"attack\":\n            hit = random.randint(5, 15)\n            if \"sword\" in inventory:\n                hit = hit + 10\n            dragon_hp = dragon_hp - hit\n            print(\"You hit the dragon for\", hit, \"damage.\")\n        if dragon_hp > 0:\n            burn = random.randint(10, 20)\n            if move == \"shield\":\n                burn = burn // 2\n            health = health - burn\n            print(\"Fire! You lose\", burn, \"health. You have\", health, \"left.\")\n    return health\n\nhealth = 60\ninventory = [\"torch\", \"sword\"]\nhealth = dragon(health, inventory)\nif health > 0:\n    print(\"The dragon falls. You escape the dungeon!\")\nelse:\n    print(\"Game over.\")", "keywords": [["test table", "a list of tests, the inputs used and the expected results"], ["normal data", "sensible input the program should accept"], ["boundary data", "input right on the edge of a rule, like exactly 0 health"], ["erroneous data", "input the program should refuse"]], "mistakes": ["A boss that can't be beaten, or can't beat you. Play it lots of times and adjust the numbers.", "Testing only with the sword. Test without the item too.", "Forgetting the game over check after the boss."], "game": {"B": "Add a boss room at the end of your adventure, then test every path.", "I": "Add a boss room that uses an item from the inventory. Test both endings, with and without the item.", "A": "Add a boss with at least three moves, one of which uses up an item. Write a test table as comments and run every test."}, "levels": {"B": {"intro": "Build a boss, then test your whole game.", "parts": [{"id": "q6b1", "kind": "step", "title": "Run the example", "html": "\u003cp>Play the dragon fight twice. Then delete \u003ccode>\"sword\"\u003c/code> from the inventory (leave \u003ccode>[\"torch\"]\u003c/code>) and play again. Is it harder?\u003c/p>", "steps": ["I beat the dragon (or it beat me)", "I tried shield and saw the fire damage halved", "Without the sword the fight was harder", "I put the sword back"]}, {"id": "q6b2", "kind": "main", "title": "Fill the gaps: the giant spider", "html": "\u003cp>Gap 1: the spider bites for a random 5 to 15. Gap 2: the item that protects the player is \u003ccode>\"shield\"\u003c/code>. Gap 3: send the health back. Run it a few times.\u003c/p>", "starter": "import random\n\ndef spider(health, inventory):\n    print(\"A giant spider drops from the ceiling!\")\n    bite = random.randint(___, ___)\n    if ___ in inventory:\n        bite = bite // 2\n        print(\"Your shield blocks some of the bite.\")\n    health = health - bite\n    print(\"You lose\", bite, \"health.\")\n    return ___\n\nhealth = 30\ninventory = [\"torch\", \"shield\"]\nhealth = spider(health, inventory)\nprint(\"Health:\", health)", "hints": ["random.randint(5, 15)", "Gap 2 needs quote marks: \"shield\". Gap 3 is health."]}, {"id": "q6b3", "kind": "step", "title": "Test your game", "html": "\u003cp>Play your adventure in the box below. Tick each one off.\u003c/p>", "steps": ["I tried every choice in every room", "I played with and without the item that helps", "I typed something silly to check ask() catches it", "I reached the win and the game over ending", "A partner played it and gave me one thing to improve"]}]}, "I": {"intro": "Build a boss, then test your whole game.", "parts": [{"id": "q6i1", "kind": "main", "title": "Your boss", "html": "\u003cp>Design your own boss as a function \u003ccode>boss(health, inventory)\u003c/code> that returns health. It must use \u003ccode>ask\u003c/code> for the player's moves, random damage, and an item from the inventory that helps. The fight ends when either side reaches 0. The main program prints a win or game over message afterwards.\u003c/p>", "starter": "import random\n\n# ask(question, options)\n\n# boss(health, inventory)\n\n# main program: health, inventory, call the boss, then win or game over\n", "hints": ["Use the dragon in the Learn box as a model, but change the boss, the moves and the item.", "while health > 0 and boss_hp > 0:"]}, {"id": "q6i2", "kind": "step", "title": "Test your game", "html": "\u003cp>Play your adventure in the box below, then swap.\u003c/p>", "steps": ["I tested every path", "I fought the boss with and without the item", "I reached both the win and the game over ending", "My partner played it and gave me one thing to improve"]}]}, "A": {"intro": "A tougher boss, a proper test plan, then your whole game.", "parts": [{"id": "q6a1", "kind": "main", "title": "The boss, three ways", "html": "\u003cp>Write \u003ccode>boss(health, inventory)\u003c/code>, returning \u003ccode>inventory, health\u003c/code>. Each round the player can \u003ccode>attack\u003c/code>, \u003ccode>shield\u003c/code> or drink a \u003ccode>potion\u003c/code>. The potion option only works if they have one, and uses it up (use your \u003ccode>drink\u003c/code> function from Stage 4). Random damage both ways. A \u003ccode>\"sword\"\u003c/code> in the bag adds damage.\u003c/p>", "starter": "import random\n", "hints": ["Reuse ask and drink. That's the point of writing them as functions.", "If they choose potion without one, tell them and don't let the boss get a free hit (or do, but decide on purpose)."]}, {"id": "q6a2", "kind": "stretch", "title": "Stretch: a repeatable test plan", "html": "\u003cp>Write a test table as comments for your boss: normal, boundary (for example exactly 0 health after a hit) and erroneous inputs, with expected results. Use \u003ccode>random.seed()\u003c/code> so your tests give the same numbers every time. Run every test, and note any you had to fix.\u003c/p>", "starter": "", "hints": ["Boundary: does the boss still win if your health lands on exactly 0?", "Erroneous: what happens if they type potion with an empty bag?"]}, {"id": "q6a3", "kind": "step", "title": "Test your game", "html": "\u003cp>Now test your own adventure.\u003c/p>", "steps": ["My test table is written as comments at the top of my game", "I ran every test and fixed what failed", "A partner played it and found nothing I hadn't tested (or I fixed what they found)"]}]}}}];
const RUNTIME_PY = "import ast\nimport json\nimport sys\nimport traceback\n\nimport rt_js\n\nFILENAME = \"\u003cyour code>\"\nLOOP_LIMIT = 200000\n\n\nclass LoopLimit(Exception):\n    pass\n\n\n_state = {\"count\": 0}\n\n\ndef _rt_guard():\n    _state[\"count\"] += 1\n    if _state[\"count\"] > LOOP_LIMIT:\n        raise LoopLimit()\n\n\nasync def _rt_input(prompt=\"\"):\n    sys.stdout.write(str(prompt))\n    sys.stdout.flush()\n    value = await rt_js.get_input()\n    return str(value)\n\n\ndef _calls_any(node, names):\n    for sub in ast.walk(node):\n        if isinstance(sub, ast.Call) and isinstance(sub.func, ast.Name) and sub.func.id in names:\n            return True\n    return False\n\n\ndef _async_names(tree):\n    # input() becomes awaitable, so any function that (directly or indirectly) calls it must be async too\n    names = {\"input\"}\n    funcs = [n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)]\n    changed = True\n    while changed:\n        changed = False\n        for f in funcs:\n            if f.name not in names and _calls_any(f, names):\n                names.add(f.name)\n                changed = True\n    return names\n\n\nclass _Transform(ast.NodeTransformer):\n    def __init__(self, names):\n        self.names = names\n\n    def visit_Call(self, node):\n        self.generic_visit(node)\n        if isinstance(node.func, ast.Name) and node.func.id in self.names:\n            if node.func.id == \"input\":\n                node.func = ast.copy_location(ast.Name(\"_rt_input\", ast.Load()), node.func)\n            return ast.copy_location(ast.Await(node), node)\n        return node\n\n    def visit_FunctionDef(self, node):\n        self.generic_visit(node)\n        if node.name in self.names:\n            new = ast.AsyncFunctionDef(**{f: getattr(node, f) for f in node._fields})\n            return ast.copy_location(new, node)\n        return node\n\n    def _guard_loop(self, node):\n        self.generic_visit(node)\n        guard = ast.Expr(ast.Call(ast.Name(\"_rt_guard\", ast.Load()), [], []))\n        ast.copy_location(guard, node.body[0])\n        node.body.insert(0, guard)\n        return node\n\n    visit_While = _guard_loop\n    visit_For = _guard_loop\n\n\ndef _hint(e):\n    kind = type(e).__name__\n    msg = str(e)\n    low = (getattr(e, \"msg\", \"\") or msg).lower()\n    if kind in (\"IndentationError\", \"TabError\"):\n        return (\"Check the spaces at the start of this line. Lines inside an if, while or for \"\n                \"need 4 spaces, and the lines after it need to line up again.\")\n    if kind == \"SyntaxError\":\n        if \"'await'\" in low:\n            return (\"This page's runner can't use input() in this exact spot. \"\n                    \"Try moving the input() onto its own line.\")\n        if \"expected ':'\" in low:\n            return \"You might be missing a colon : at the end of this line.\"\n        if \"maybe you meant '=='\" in low:\n            return \"To compare two things, use == (two equals signs). One = stores a value.\"\n        if \"unterminated string\" in low or \"eol while\" in low:\n            return \"A quote mark is missing. Text needs a quote at the start AND at the end.\"\n        if \"never closed\" in low or \"unmatched\" in low or \"does not match\" in low:\n            return \"Your brackets don't match up. Every ( needs a ). The mistake may be on the line above.\"\n        return (\"Python can't understand this line. Check your brackets, quote marks and colons. \"\n                \"Sometimes the real mistake is on the line above.\")\n    if kind == \"NameError\":\n        bad = msg.split(\"'\")[1] if msg.count(\"'\") >= 2 else \"this name\"\n        if bad == \"random\":\n            return \"Python doesn't know what random is yet. Put import random on the very first line of your program.\"\n        return (f\"Python doesn't know what {bad} is. Check the spelling and capital letters \"\n                \"(print, not Print). If it's a variable, give it a value first. \"\n                \"If it's meant to be text, put it in quotes.\")\n    if kind == \"TypeError\":\n        if \"positional argument\" in msg:\n            return (\"The number of values in the call doesn't match the def. Count the values in the \"\n                    \"brackets where you call it, and the parameters in the brackets of the def.\")\n        if \"NoneType\" in msg:\n            return (\"One of these values is None, which means nothing came back. Does the function \"\n                    \"end with return? Did you catch the result of a procedure, which returns nothing?\")\n        if \"not supported between instances of 'str' and 'int'\" in msg or \\\n           \"not supported between instances of 'int' and 'str'\" in msg:\n            return \"You're comparing text with a number. Did you forget int() around input()?\"\n        if \"concatenate str\" in msg or (\"unsupported operand\" in msg and \"str\" in msg) or \"can't multiply\" in msg:\n            return (\"You're mixing text and numbers. Use int() to turn typed text into a number. \"\n                    \"To show a number with text, use a comma in print instead of +.\")\n        return \"Something is the wrong type here, for example text where a number should be.\"\n    if kind == \"AttributeError\" and \"NoneType\" in msg:\n        return (\"Your list has turned into None. Check for list = list.append(...) (just write \"\n                \"list.append(...)), or a function that forgot to return the list.\")\n    if kind == \"AttributeError\" and \"random\" in msg:\n        return \"Check the spelling after random. It's random.randint or random.choice.\"\n    if kind == \"ValueError\" and \"x not in list\" in msg:\n        return \"You tried to remove something that isn't in the list. Check with in before you remove it.\"\n    if kind == \"ValueError\" and \"empty range\" in msg:\n        return \"random.randint needs the smaller number first, e.g. random.randint(1, 6).\"\n    if kind == \"ValueError\" and \"invalid literal for int()\" in msg:\n        return \"int() can only turn whole numbers into numbers. What was typed in wasn't a whole number.\"\n    if kind == \"ZeroDivisionError\":\n        return \"You can't divide by zero. Check the number you're dividing by.\"\n    if kind == \"IndexError\":\n        return \"You asked for a position that doesn't exist. Remember positions start at 0.\"\n    return \"\"\n\n\ndef _report(e, line):\n    return json.dumps({\n        \"type\": \"error\",\n        \"line\": line,\n        \"error\": f\"{type(e).__name__}: {getattr(e, 'msg', None) or e}\",\n        \"hint\": _hint(e),\n    })\n\n\nasync def run(src):\n    _state[\"count\"] = 0\n    try:\n        tree = ast.parse(src, FILENAME)\n    except SyntaxError as e:\n        return _report(e, e.lineno)\n    tree = _Transform(_async_names(tree)).visit(tree)\n    ast.fix_missing_locations(tree)\n    try:\n        code = compile(tree, FILENAME, \"exec\", flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT)\n    except SyntaxError as e:\n        return _report(e, e.lineno)\n    ns = {\"__name__\": \"__main__\", \"_rt_input\": _rt_input, \"_rt_guard\": _rt_guard}\n    try:\n        result = eval(code, ns)\n        if result is not None:\n            await result\n    except LoopLimit:\n        sys.stdout.flush()\n        return json.dumps({\n            \"type\": \"loop\",\n            \"error\": f\"Stopped: a loop ran more than {LOOP_LIMIT:,} times.\",\n            \"hint\": (\"That usually means an infinite loop. Check that something inside the loop \"\n                     \"changes, so the condition can become False.\"),\n        })\n    except SystemExit:\n        pass\n    except BaseException as e:\n        sys.stdout.flush()\n        if \"RT_STOPPED\" in str(e):\n            return json.dumps({\"type\": \"stopped\"})\n        frames = [f for f in traceback.extract_tb(e.__traceback__) if f.filename == FILENAME]\n        line = frames[-1].lineno if frames else None\n        return _report(e, line)\n    sys.stdout.flush()\n    return json.dumps({\"type\": \"ok\"})\n";
